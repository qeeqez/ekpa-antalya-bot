- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Assurance tremblement de terre Dask*


    ℹ️ *Informations :*

    \- Obligatoire pour ouvrir un compte pour l''eau et l''électricité\.

    \- Avant d''aller chez Asat ou CK Akdeniz Elektrik, vous *devriez déjà avoir Dask*\.

    \- Vous ne pouvez pas le faire dans Dask Bank\.

    \- Vous pouvez le faire auprès de n''importe quelle compagnie d''assurance ou à Nkolay en utilisant le lien ci\-dessous\.


    💼 *Emportez avec vous :*

    1\. Tapu ou contrat de location

    2\. Passeport ou Ikamet

    3\. Numéro fiscal turc \(Le numéro lui\-même suffit\)

    4\. Adresse complète / Dites à Ekpa


    📍 *Commandez Dask à [Nkolay](https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Électricité*


    💼 *Emportez avec vous :*

    1\. *Tapu* ou *contrat de location*

    2\. *Passeport* ou *Ikamet*

    3\. Turc *numéro fiscal* \(Le numéro lui\-même suffit\)

    4\. Assurance tremblement de terre *Dask*

    5\. *Argent* pour le dépôt \(Restitué lors de la déconnexion\)


    📍 *Vous pouvez vous connecter uniquement au [siège social de CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    🧑‍💼*Déclaration au Code criminel :*

    Numéro d''immeuble et d''appartement, ainsi que numéro d''abonné à l''électricité\.


    ℹ️ La lumière apparaîtra dans l''appartement dans un délai d''un jour ouvrable\.

    ℹ️ S''il y a des problèmes avec l''électricité\- aviser le Code criminel\.


    ⚠️ Le panneau électrique est dans le placard\.

    ⚠️ Le compteur électrique est situé au sous\-sol derrière une porte fermée\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Eau*


    💼 *Emportez avec vous :*

    1\. *Tapu* ou *contrat de location*

    2\. *Passeport* ou *Ikamet*

    3\. Turc *numéro fiscal* \(Le numéro lui\-même suffit\)

    4\. Assurance tremblement de terre *Dask*

    5\. *Argent* pour le dépôt \(Restitué lors de la déconnexion\)


    📍 *Connectez l''eau à [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*Déclaration au Code criminel :*

    Numéro d''immeuble et d''appartement ainsi que numéro d''abonné à l''eau\.


    ℹ️ Dans les 3 jours ouvrables, de l''eau apparaîtra dans l''appartement\.

    ℹ️ Si vous avez des problèmes d''eau ou de pression dans les robinets\- prévenez le Code criminel\.


    ⚠️ L''appartement dispose d''une vanne pour couper l''eau\.

    \- A 1\+1, regarde sous l''évier\.

    \- En 2\+1 est dans l''âme\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎Internet*


    ℹ️ *Pour vous connecter à Internet vous avez besoin d''un titre de séjour \(ikamet\)*


    ℹ️ *Internet résidentiel en Turquie sous contrat*

    \- Le contrat est d''un an ou deux ans

    \- En cas de résiliation anticipée du contrat, une pénalité est versée

    \- Le paiement est effectué mensuellement


    🌐 *Opérateurs Internet*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Pour vous connecter, vous devez contacter le bureau de l''opérateur avec un ikamet\. Le prix est le même que sur le
    site de l''opérateur\.

    ⚠️ Il est possible que le bureau ne trouve pas notre adresse dans le système, nous vous recommandons de contacter les
    bureaux les plus proches du complexe\.


    🏴‍☠️ *Connectez\-vous sans titre de séjour*

    \- Pour vous connecter sans permis de séjour, vous devez trouver une personne qui s''occupera elle\-même d''Internet\.

    \- C''est généralement plus cher, de nombreux « assistants » facturent de l''argent pour un tel service\.

    \- Une aide peut être trouvée auprès de votre agent immobilier ou auprès des bureaux des opérateurs Internet\.


    ⚡️ *Méthodes alternatives*

    \- Partagez Internet depuis votre téléphone

    \- Demandez de l''aide à vos voisins, partagez le Wi\-Fi'
- id: HOW_TO_DISCONNECT
  text: '*⛔️ Comment désactiver ?*'
  button_texts:
    disconnect_electricity: ⚡️ Électricité
    disconnect_water: 💧 Eau
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Électricité*


    💰 Si vous vous déconnectez, l''acompte versé lors de la connexion vous est restitué, moins le solde à payer


    🌎 *Désactiver en ligne*

    \- Connectez\-vous à Edevlet

    \- Allez sur la page [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- Ou tapez la recherche `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu`

    \- Cliquez sur *"Nouvelle application" \(Yeni Başvuru\)*, sélectionnez un compte et remplissez vos coordonnées

    \- Remplissez l''IBAN sur lequel l''argent sera transféré

    ⚠️ *Vous ne pouvez vous déconnecter en ligne que si vous êtes connecté à Ikamet*


    📍 *Coupez l''électricité hors ligne au [siège social de CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *Emportez avec vous :*

    1\. *Numéro d''abonné* \(il sera trouvé plus rapidement dans le système\)

    2\. *Passeport* ou *Ikamet*

    3\. *IBAN* sur lequel l''argent sera transféré


    ℹ️ Dans les 24 heures, l''appartement perdra l''électricité\.

    ℹ️ L''argent ne sera crédité sur le compte turc qu''après la déconnexion, dans un délai de 7\-30 jours\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Eau*


    💰 Si vous vous déconnectez, l''acompte versé lors de la connexion vous est restitué, moins le solde à payer


    🌎 *Désactiver en ligne*

    \- Connectez\-vous à Edevlet

    \- Allez sur la page [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- Ou tapez recherche `ASAT Abonelik Sözleşme Feshi Başvurusu`

    \- Cliquez sur *"Nouvelle application" \(Yeni Başvuru\)*, sélectionnez un compte et remplissez vos coordonnées

    \- Remplissez l''IBAN sur lequel l''argent sera transféré

    ⚠️ *Vous ne pouvez vous déconnecter en ligne que si vous êtes connecté à Ikamet*


    📍 *Activez l''eau hors ligne dans [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Emportez avec vous :*

    1\. *Numéro d''abonné* \(il sera trouvé plus rapidement dans le système\)

    2\. *Passeport* ou *Ikamet*

    3\. *IBAN* sur lequel l''argent sera transféré


    ℹ️ D''ici 3 jours ouvrés, l''eau de l''appartement disparaîtra\.

    ℹ️ L''argent ne sera crédité sur le compte turc qu''après la déconnexion, dans un délai de 7\-30 jours\.'
