  text: '*🧑‍🔧 Қалай қосылуға/қайта тіркелуге болады? ♻️*


    1️⃣ Бірінші қосылу процесі қайта тіркеуден еш айырмашылығы жоқ

    2️⃣ Қайта тіркеу кезінде алдыңғы төлеуші ажырату үшін бөлек жол жүрудің қажеті жоқ\.'
