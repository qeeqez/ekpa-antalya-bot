    2️⃣ Бул жерде жолугушуу \(жашоого уруксат алуу\) болуп, жашоого уруксатка\ байланыштуу бардык маселелер чечилет\.

    3️⃣ Буйруй электерди бул жерге манжа изин алуу үчүн чакырса болот\.


