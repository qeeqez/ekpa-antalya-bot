    Ризонел, 0,05% \- аллергиялык ринитке, вазоконстрикторлорду узак мөөнөткө колдонуу менен\. Мурундогу шишиктерди кетирет,
    \(Назонекс аналоги\) агымын азайтат, 2 дозадан ар бир таноосуна 2 жолудан 2 жумадан кийин 1 дозадан 2 жолудан 2 жумадан
