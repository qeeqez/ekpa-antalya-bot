- id: AMBULANCE
  text: '*🚑 Скорая помощь*


    ☎️ `112`


    ℹ️ *Скорую помощь вызывайте только в самом крайнем случае\.*

    В Турции вызов скорой помощи может обойтись в огромную копеечку\.

    При вызове скорой скажите English, должны переключить на английского оператора\.


    😷️ *Горячая линия для иностранцев*


    ☎️ `+90 850 288 38 38`


    ℹ️ *В Горячей линии говорят на всех языках*

    Помогают по всем вопросам медицины, в том числе и с вызовом скорой помощи\.

    '
- id: PHARMACIES
  text: '*🧑‍⚕️ Аптеки \- Eczane*


    ℹ️ В воскресенье обычные аптеки не работают


    📍 Множество аптек находится по дороге к больнице:

    📍 [Kepez Devlet Hastanesi](https://goo.gl/maps/b5cnrK2H4apXkqWw9)


    *🏥 Дежурные аптеки \- Nöbetçi Eczaneler*


    \- Работают круглосуточно

    \- Каждый день они разные

    \- Актуальные можно посмотреть на сайте или в приложении

    '
  button_texts:
