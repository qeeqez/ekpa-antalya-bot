name: Build Bot

on:
  push:

env:
  AWS_IAM: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/iam-github-oidc
  DOCKER_IMAGE_NAME: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ github.event.repository.name }}
  DOCKER_IMAGE_TAG: ${{ contains(github.ref, 'refs/heads/main') && 'latest' || github.ref_name }}

# These permissions are needed to interact with GitHub's OIDC Token endpoint.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Bot
    runs-on: ubuntu-latest

    steps:

      - name: 🧰 Checkout
        uses: actions/checkout@v3

      - name: ⬇️ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: ⬇️ Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: 🛠️ Build
        run: ./gradlew bootJar

      - name: 🚀 Cache jar
        uses: actions/cache/save@v3
        with:
          path: build/libs/
          key: ekpa-bot-jar-${{ github.run_number }}

      - name: 🚀 Cache Docker & AWS Task
        uses: actions/cache/save@v3
        with:
          path: |
            Dockerfile
            task-definition.json
          key: ekpa-bot-publish-deploy-${{ github.run_number }}

  publish:
    name: Publish docker image to AWS ECR
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_IAM }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: ⬇️ Restore Docker & AWS Task
        uses: actions/cache/restore@v3
        with:
          path: |
            Dockerfile
            task-definition.json
          key: ekpa-bot-publish-deploy-${{ github.run_number }}

      - name: ⬇️ Download jar
        uses: actions/cache@v3
        with:
          path: build/libs/
          key: ekpa-bot-jar-${{ github.run_number }}

      - name: 🐳️ Build and push 🚀
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          cache-from: type=gha,src=/tmp/.buildx-cache
          cache-to: type=gha,dest=/tmp/.buildx-cache

  deploy:
    name: Deploy docker image to AWS ECS
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: publish

    steps:

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_IAM }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: ⬇️ Restore Docker & AWS Task
        uses: actions/cache/restore@v3
        with:
          path: |
            Dockerfile
            task-definition.json
          key: ekpa-bot-publish-deploy-${{ github.run_number }}

      - name: 💼 Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ekpa-antalya-bot
          image: ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

      - name: 🚀 Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        timeout-minutes: 2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ekpa-antalya-bot-service
          cluster: ecs-cluster
          wait-for-service-stability: true
