- id: HOSPITALS
  text: '*🏥 Больницы \- Hastane*


    🛡️ *По Страховке*


    1️⃣️ Для обращения по страховке, для начала нужно узнать с какими больницами она работает

    2️⃣ Страховка зачастую не покрывает всю сумму лечения, впрочем это зависит от вашего полиса и страховой компании


    ⁉️ *Как узнать с какими больницами работает страховка:*

    1\. Зайти на сайт [imecedestek](https://imecedestek.com/ContractedOrganizations)

    2\. Указать название страховой компании и тип страховки

    3\. Выбрать район, в котором вы хотите посмотреть контрактные организации

    4\. Выбрать тип заведения

    5\. Нажать *Ara / Search*


    ⭐️ Таким образом вы получите список больниц и других мед учреждений, в которых у вас работает страховка\.


    ❤️‍🩹 *Без Страховки*


    \- Можно обращаться в больницы и частные клиники и не из списка страховой\.

    \- В таком случае ваша страховка тоже может покрывать небольшую часть лечения\. \(Читайте об этом в ее описании и условиях
    страхования\)

    \- Если у вас не будет никакой страховки, то готовтесь приготовить немаленькую сумму\.


    📍 Ищите больницы на карте по турецкому слову *Hastane*\.

    '
  button_texts:
    hospitals_insurance_site: 🌎 Поиск мед учреждения по страховке
- id: POLYCLINIC
  text: '*🧑‍⚕️ Бесплатная медицина*


    💫 В Турции можно получать *базовую медицинскую помощь бесплатно*

    \- Для этого нужно после получения ВНЖ прикрепиться к семейному врачу


    🆓️ *Что дает:*

    \- У семейного врача можно сделать общий осмотр

    \- Сдать базовые анализы

    \- Получить рецепт на лекарства

    \- Сделать прививки себе и детям

    \- Получить рекомендации специалистов в больницах

    \- История всех анализов и обследований будут отображаться в приложении e\-Nabız\.

    \- Причем из всех больниц, включая частные\.


    💼 *Что нужно:*

    \- Турецкий номер телефона

    \- e\-Devlet \(делается на почте\)

    \- Прописка по вашему адресу


    🌎 *Как прикрепиться:*

    1\. Зарегистрироваться на [сайте enabiz](https://enabiz.gov.tr/)

    2\. Выбрать функцию *Сменить семейного врача / Change your family physician*

    3\. Выбрать город, район

    4\. Откроется список доступных семейных клиник aile sağlık merkezi и специалистов\.

    \- Врача, выделенного красным выбрать нельзя

    \- Врачи, выделенные зелёным более свободные

    \- Смена врача с 5 по 21 числа происходит в тот же день\. Заявки с 22 по 4 число будут обработаны 5\-го числа\.


    ⚡️*Дополнительно:*

    \- Зарегистрироваться на [сайте MHRS](https://www.mhrs.gov.tr/) \(сайт для записи к врачу\)


    ⭐ Теперь вам доступна *Запись к врачу / Appointment / Randevu* через сайт и приложение e\-Nabız\

    '
  button_texts:
    polyclinic_site: '🌎 Сайт для записи к врачу

      '
