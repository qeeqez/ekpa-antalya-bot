- id: AMBULANCE
  text: '*🚑 الإسعاف*


    ☎️`112`


    ℹ️ *الاتصال بالإسعاف كملاذ أخير فقط\.*

    في تركيا، يمكن أن يكلف استدعاء سيارة إسعاف فلساً واحداً\.

    عند الاتصال بسيارة إسعاف، قل الإنجليزية، يجب عليك التبديل إلى عامل الهاتف باللغة الإنجليزية\.


    😷️ *الخط الساخن للأجانب*


    ☎️ `+90 850 288 38 38`


    ℹ️ *يتم التحدث بجميع اللغات في الخط الساخن*

    إنهم يساعدون في جميع المشكلات الطبية، بما في ذلك الاتصال بسيارة الإسعاف\.'
- id: PHARMACIES
  text: '*🧑‍⚕️ الصيدليات \- اكزان*


    ℹ️ الصيدليات العادية مغلقة يوم الأحد


    📍تتواجد العديد من الصيدليات على طريق المستشفى:

    📍[كبيز ديفلت هاستانيسي](https://goo.gl/maps/b5cnrK2H4apXkqWw9)


    *🏥 الصيدليات المناوبة \- Nöbetçi Eczaneler*


    \- يعملون على مدار الساعة

    \- كل يوم هم مختلفون

    \- يمكن الاطلاع على الحالية على الموقع أو في التطبيق'
  button_texts:
    pharmacies_site: 🌎 {{button_pharmacies_site}}
    pharmacies_android: 🤖 {{button_android}}
    pharmacies_iphone: 📱 {{button_iphone}}
- id: HOSPITALS
  text: '*🏥المستشفيات\-الحستانة*


    🛡️ *بالتأمين*


    1️⃣️للتقدم بطلب التأمين، عليك أولاً معرفة المستشفيات التي يعمل معها

    2️⃣ التأمين في كثير من الأحيان لا يغطي كامل مبلغ العلاج، ولكن هذا يعتمد على وثيقة التأمين الخاصة بك وشركة التأمين


    ⁉️ *كيفية معرفة المستشفيات التي يعمل معها تأمينك:*

    1\. تفضل بزيارة الموقع الإلكتروني [imecedestek](https://imecedestek.com/ContractedOrganizations)

    2\. اذكر اسم شركة التأمين ونوع التأمين

    3\. حدد المنطقة التي تريد عرض المؤسسات التعاقدية فيها

    4\. اختر نوع المنشأة

    5\. اضغط على *ارا / بحث*


    ⭐️ بهذه الطريقة سوف تتلقى قائمة بالمستشفيات والمؤسسات الطبية الأخرى التي لديك تأمين عليها\.


    ❤️‍🩹 *بدون تأمين*


    \- بإمكانك الذهاب إلى المستشفيات والعيادات الخاصة وليس من قائمة التأمين\.

    \- في هذه الحالة، قد يغطي التأمين الخاص بك أيضًا جزءًا صغيرًا من العلاج\. \(اقرأ عن ذلك في وصفه وشروط التأمين\)

    \- إذا لم يكن لديك أي تأمين، فاستعد لتجهيز مبلغ كبير إلى حد ما\.


    📍البحث عن المستشفيات على الخريطة باستخدام الكلمة التركية *Hastane*\.'
  button_texts:
    hospitals_insurance_site: 🌎 {{button_hospital_search}}
- id: POLYCLINIC
  text: '*🧑‍⚕️ دواء مجاني*


    💫 في تركيا يمكنك الحصول على *الرعاية الطبية الأساسية مجانًا*

    \- للقيام بذلك، بعد حصولك على تصريح الإقامة، يجب أن يتم تعيينك لطبيب الأسرة


    🆓️ *ما يعطي:*

    \- يمكنك إجراء فحص عام من طبيب الأسرة

    \- اجتياز الاختبارات الأساسية

    \- الحصول على وصفة طبية للأدوية

    \- احصل على التطعيم لنفسك ولأطفالك

    \- الحصول على توصيات من المتخصصين في المستشفيات

    \- سيتم عرض تاريخ كافة التحاليل والفحوصات في تطبيق e\-Nabız\.

    \- ومن كافة المستشفيات بما فيها الخاصة\.


    💼 *ما تحتاجه:*

    \- رقم الهاتف التركي

    \- e\-Devlet \(تم ذلك في مكتب البريد\)

    \- التسجيل على عنوانك


    🌎 *طريقة الإرفاق:*

    1\. سجل في [موقع enabiz](https://enabiz.gov.tr/)

    2\. اختر الوظيفة *تغيير طبيب العائلة*

    3\. اختر المدينة، المنطقة

    4\. سيتم فتح قائمة بعيادات الأسرة والمتخصصين المتاحين\.

    \- لا يمكن تحديد الطبيب المظلل باللون الأحمر

    \- الأطباء المظللون باللون الأخضر أكثر حرية

    \- تغيير الطبيب من يوم 5 إلى يوم 21 يكون في نفس اليوم\. ستتم معالجة الطلبات من اليوم 22 إلى اليوم 4 في يوم 5\.


    ⚡️*بالإضافة إلى ذلك:*

    \- قم بالتسجيل على [موقع MHRS الإلكتروني](https://www.mhrs.gov.tr/) \(موقع ويب لتحديد موعد مع الطبيب\)


    ⭐ الآن يمكنك *تحديد موعد مع الطبيب / موعد / Randevu* من خلال الموقع والتطبيق e\-Nabız\'
  button_texts:
