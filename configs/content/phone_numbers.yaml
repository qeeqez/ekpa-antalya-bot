version: "1.0"
screens:
    - id: PHONE_NUMBERS
      text: "*\U0001F4DE Важные телефоны*"
      parse_mode: MarkdownV2
      inline_keyboard:
        rows:
            - buttons:
                - id: ekpa_management
                  text: "\U0001F3D8 Управление EKPA"
                  type: callback
