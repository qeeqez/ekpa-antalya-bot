- id: AMBULANCE
  text: '*🚑 Жедел жәрдем*


    ☎️ `112`


    ℹ️ *Жедел жәрдемді тек соңғы шара ретінде шақырыңыз\.*

    Түркияда жедел жәрдем шақыру бір тиын тұрады\.

    Жедел жәрдем шақырғанда ағылшынша айтыңыз, ағылшын операторына ауысуыңыз керек\.


    😷️ *Шетелдіктерге арналған сенім телефоны*


    ☎️ `+90 850 288 38 38`


    ℹ️ *Жедел желіде барлық тілдер сөйлейді*

    Олар барлық медициналық мәселелерге, соның ішінде жедел жәрдем шақыруға көмектеседі\.'
- id: PHARMACIES
  text: '*🧑‍⚕️ Дәріханалар \- Eczane*


    ℹ️ Тұрақты дәріханалар жексенбі күні жабық


    📍 Көптеген дәріханалар ауруханаға барар жолда орналасқан:

    📍 [Kepez Devlet Hastanesi](https://goo.gl/maps/b5cnrK2H4apXkqWw9)


    *🏥 Кезекші дәріханалар \- Nöbetçi Eczaneler*


    \- Олар тәулік бойы жұмыс істейді

    \- Күн сайын олар әртүрлі

    \- Ағымдағыларды веб\-сайттан немесе қолданбадан көруге болады'
