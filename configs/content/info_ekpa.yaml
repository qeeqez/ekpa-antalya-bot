  - id: "HOW_TO_PAY_AIDAT"
    text: |
      *Aйдат*
      
      ℹ️ Ежемесячная плата за обслуживание комплекса\.
      ⚠️ Оплачивать обязательно, даже если вы не живете в квартире\.
      
      *Стоимость:*
      ```
      1\+1 \-  840 TL
      2\+1 \-  1310 TL
      2\+1 \- 1590 TL \(Отдельная кухня\)
      3\+1 \- 1970 TL
      ```
      *Срок оплаты:*
      ⏳ До 5 числа каждого месяца
      
      *Оплата:*
      🪙 Наличными или картой в Офисе УК
      
      💳 Онлайн переводом с карты турецкого банка на счет:
      
      🏦 `TR24 0013 4000 0203 8787 9000 01`
      
      *Имя получателя и описание платежа*
      🧑 `EKPA 1207 SITESI YONETIMI`
      ℹ️ `Aidat Ekpa 1207` Блок Квартира Месяц
      
      ⚠️ Обязательно указывайте номера блока, квартиры и месяца за который оплачиваете
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "HOW_TO_PAY_CONDITIONER"
    text: |
      *Кондиционер*
      
      ℹ️ Cистема Центрального Кондиционирования не входит в счет за оплату электричества\.
      ⚠️ Имейте ввиду, что Турция это жаркая страна, а электричество тут дорогое\.
      
      *Срок оплаты:*
      ⏳ 7 дней со дня получения счета
      ⚠️ При неоплате будет отключен\. На пульте появится значек замочка и надпись Centralized\.
      
      *Оплата:*
      🪙 Наличными или картой в Офисе УК
      
      💳 Онлайн переводом с карты турецкого банка на счет:
      
      🏦 `TR24 0013 4000 0203 8787 9000 01`
      
      *Имя получателя и описание платежа*
      🧑 `EKPA 1207 SITESI YONETIMI`
      ℹ️ `Klima Ekpa 1207` Блок Квартира
      
      ⚠️ Обязательно указывайте номера блока и квартиры за который оплачиваете
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "HOW_TO_PAY_ELECTRICITY"
    text: |
      *Электричество*
      
      ℹ️ Кондиционер не включен в счет за оплату электричества\.
      
      ℹ️ *Aбонентский номер* выдается при подключении, так же он указан на платежке\.
      
      *Срок оплаты:*
      ℹ️ Счет выставляется в конце месяца
      ⏳ Оплатить нужно в течении 10 дней после выставления счета\.
      
      *Как узнать свой счет за электричество:*
      \- В турецком интернет банке при оплате
      \- В платежке, которая приходит по адресу, кладут в ящик на стене на первом этаже
      \- Онлайн на сайте [CK Akdeniz](https://online.ckakdeniz.com.tr)
      
      *Оплата:*
      
      💳 *Онлайн в турецком интернет банке*
      1\. Fatura \(Bill Payment\) \-\> Elektrik \(Electricity\) \-\> *CK Akdeniz Elektrik*
      2\. Ввести свой *абонентский номер*
      3\. Вы увидите сумму и сможете оплатить
      ⚠️ Если счет еще не выставлен \- приложение выдаст ошибку\.
      
      🪙 *Наличными или картой*
      \- В отделении Turkcell с небольшой комиссией [Ближайший 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Ближайший 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)
      \- В отделении почты PTT, [Ближайшая почта](https://goo.gl/maps/fwskNzeEbtX9hspz6)
      \- В любом офисе CK Akdeniz Elektrik, [Ближайший офис](https://goo.gl/maps/nyumU39FQYJTnFZt9)
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "HOW_TO_PAY_WATER"
    text: |
      *Вода*
      
      ℹ️ *Aбонентский номер* выдается при подключении, так же он указан на платежке\.
      
      *Срок оплаты:*
      ℹ️ Счет выставляется в конце месяца
      ⏳ Оплатить нужно в течении 10 дней после выставления счета\.
      
      *Как узнать свой счет за воду:*
      \- В турецком интернет банке при оплате
      \- В платежке, которая приходит по адресу, кладут в ящик на стене на первом этаже
      \- Онлайн на сайте [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Нажать HIZLI ÖDEME
      
      *Оплата:*
      
      💳 *Онлайн в турецком интернет банке*
      1\. Fatura \(Bill Payment\) \-\> Su \(Water\) \-\> *Antalya Su \(ASAT\)*
      2\. Ввести свой *абонентский номер* \(Добавьте несколько нулей слева от номера\)
      3\. Вы увидите сумму и сможете оплатить
      ⚠️ Если счет еще не выставлен \- приложение выдаст ошибку\.
      
      🪙 *Наличными или картой*
      \- В отделении Turkcell с небольшой комиссией [Ближайший 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Ближайший 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)
      \- В отделении почты PTT, [Ближайшая почта](https://goo.gl/maps/fwskNzeEbtX9hspz6)
      \- В [Головном офисе ASAT](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "HOW_TO_PAY_PHONE_AND_INTERNET"
    text: |
      *📱 Мобильный телефон и Интернет 🌎*
      
      💳 *Онлайн в приложении или на сайте вашего оператора*
      \- Для телефона нужно выбрать пакет на следующий месяц
      \- Можно просто пополнить баланс и позже оплачивать с него пакеты
      \- Для интернета нужно оплатить счет за предыдущий месяц
      
      🪙 *Наличными или картой*
      \- В отделении Turkcell с небольшой комиссией [Ближайший 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Ближайший 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)
      \- В любом офисе вашего оператора связи
    parse_mode: "MarkdownV2"
    disable_web_preview: true

