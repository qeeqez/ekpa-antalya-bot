version: "1.0"
screens:
    - id: PHONE_NUMBERS
      text: "*\U0001F4DE Важные телефоны*"
      parse_mode: MarkdownV2
      inline_keyboard:
        rows:
            - buttons:
                - id: ekpa_management
                  text: "☎️ Управление EKPA"
                  type: callback
                  callback: EKPA_MANAGEMENT_BUTTON
            - buttons:
                - id: emergency
                  text: "🆘 Экстренные службы"
                  type: callback
                  callback: EMERJENCY_BUTTON
                - id: other_phones
                  text: "📲 Другое"
                  type: callback
                  callback: OTHER_PHONES_BUTTON
            - buttons:
                - id: embassy
                  text: "🏛️ Посольства"
                  type: callback
                  callback: EMBASSY_BUTTON
      navigation:
        - callback: EKPA_MANAGEMENT_BUTTON
          target: EKPA_MANAGEMENT
        - callback: EMERJENCY_BUTTON
          target: EMERGENCY
        - callback: EMBASSY_BUTTON
          target: EMBASSY
        - callback: OTHER_PHONES_BUTTON
          target: OTHER_PHONES
    - id: EKPA_MANAGEMENT
      text: |
        *Ekpa:*

        *🧑‍💼Управляющая Компания*
        \+90 \(539\) 6703316
        \+90 \(539\) 6703320

        *👮 Охрана*
        \+90 \(539\) 6703833
      parse_mode: MarkdownV2
    - id: EMERGENCY
