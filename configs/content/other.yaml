version: "1.0"
screens:
    - id: CAR_FINE
      text: "*\\U0001F697 Проверка штрафов*\\n\\nПроверить и оплатить штрафы можно:\\n\\n\\U0001F310 На сайте E\\\\-Devlet:\\n[turkiye\\\\.gov\\\\.tr](https://www\\\\.turkiye\\\\.gov\\\\.tr)\\n\\n\\U0001F4B3 Через банковское приложение\\n\\n\\U0001F3E6 В отделении банка\\n\\nℹ️ Понадобится номер TC или паспорта\\n"
      parse_mode: MarkdownV2
      disable_web_preview: true
    - id: PHONE_UNLOCK
      text: "*\\U0001F4F1 Разблокировка телефона*"
      parse_mode: MarkdownV2
      inline_keyboard:
        rows:
            - buttons:
                - id: phone_unlock_sim
                  text: "\\U0001F4F2 Разблокировка SIM"
                  type: callback
                  callback: PHONE_UNLOCK_SIM_BUTTON
            - buttons:
                - id: phone_unlock_imei
                  text: "\\U0001F4F1 Регистрация IMEI"
                  type: callback
                  callback: PHONE_UNLOCK_IMEI_BUTTON
      navigation:
        - callback: PHONE_UNLOCK_SIM_BUTTON
          target: PHONE_UNLOCK_SIM
        - callback: PHONE_UNLOCK_IMEI_BUTTON
          target: PHONE_UNLOCK_IMEI
    - id: PHONE_UNLOCK_SIM
      text: "*\\U0001F4F2 Разблокировка SIM\\\\-карты*\\n\\nЕсли SIM заблокирована из\\\\-за неправильного PIN:\\n\\n\\U0001F510 Используйте PUK\\\\-код\\n\\n\\U0001F4F1 PUK\\\\-код указан на упаковке SIM\\\\-карты\\n\\nℹ️ Если PUK утерян \\\\- обратитесь к оператору\\n\\nОператоры:\\n\\\\- Turkcell: 444 0 532\\n\\\\- Vodafone: 444 0 542\\n\\\\- Türk Telekom: 444 1 444\\n"
      parse_mode: MarkdownV2
      disable_web_preview: true
    - id: PHONE_UNLOCK_IMEI
      text: "*\\U0001F4F1 Регистрация IMEI*\\n\\nТелефоны, привезенные из\\\\-за границы, должны быть зарегистрированы\\n\\n⏱ Срок: 120 дней с момента первого использования в Турции\\n\\n\\U0001F4B0 Стоимость: ~3000 TL\\n\\n\\U0001F4CB Способы регистрации:\\n"
      parse_mode: MarkdownV2
      disable_web_preview: true
      inline_keyboard:
        rows:
            - buttons:
                - id: phone_unlock_imei_free
                  text: "\\U0001F193 Бесплатный способ"
                  type: callback
                  callback: PHONE_UNLOCK_IMEI_FREE_BUTTON
            - buttons:
                - id: phone_unlock_imei_paid
                  text: "\\U0001F4B3 Платный способ"
                  type: callback
                  callback: PHONE_UNLOCK_IMEI_PAID_BUTTON
            - buttons:
                - id: phone_unlock_imei_reblock
                  text: ⚠️ Повторная блокировка
                  type: callback
                  callback: PHONE_UNLOCK_IMEI_REBLOCK_BUTTON
      navigation:
        - callback: PHONE_UNLOCK_IMEI_FREE_BUTTON
          target: PHONE_UNLOCK_IMEI_FREE
        - callback: PHONE_UNLOCK_IMEI_PAID_BUTTON
          target: PHONE_UNLOCK_IMEI_PAID
        - callback: PHONE_UNLOCK_IMEI_REBLOCK_BUTTON
          target: PHONE_UNLOCK_IMEI_REBLOCK
    - id: PHONE_UNLOCK_IMEI_FREE
      text: "*\\U0001F193 Бесплатная регистрация IMEI*\\n\\nДоступна один раз каждые 3 года\\n\\n\\U0001F4CB Необходимо:\\n\\\\- ВНЖ или гражданство Турции\\n\\\\- Телефон привезен менее 120 дней назад\\n\\n\\U0001F310 Регистрация через:\\n[imei\\\\.gov\\\\.tr](https://imei\\\\.gov\\\\.tr)\\n\\n\\U0001F4C4 Понадобится:\\n\\\\- IMEI телефона \\\\(\\\\*\\\\#06\\\\#\\\\)\\n\\\\- Паспорт\\n\\\\- Номер ВНЖ\\n"
      parse_mode: MarkdownV2
      disable_web_preview: true
    - id: PHONE_UNLOCK_IMEI_PAID
      text: "*\\U0001F4B3 Платная регистрация IMEI*\\n\\n\\U0001F4B0 Стоимость: ~3000 TL\\n\\nНеобходима если:\\n\\\\- Уже использовали бесплатную квоту\\n\\\\- Нет ВНЖ\\n\\\\- Прошло более 120 дней\\n\\n\\U0001F3E6 Оплата:\\n1\\\\. Получите счет на [imei\\\\.gov\\\\.tr](https://imei\\\\.gov\\\\.tr)\\n2\\\\. Оплатите в банке или онлайн\\n3\\\\. Телефон разблокируется автоматически\\n"
      parse_mode: MarkdownV2
      disable_web_preview: true
    - id: PHONE_UNLOCK_IMEI_REBLOCK
      text: "*⚠️ Повторная блокировка*\\n\\nТелефон может быть заблокирован повторно если:\\n\\n❌ Извлечена турецкая SIM\\\\-карта\\n❌ Установлена иностранная SIM\\n❌ Телефон выезжал за границу\\n\\n\\U0001F4A1 Чтобы избежать блокировки:\\n✅ Всегда держите турецкую SIM активной\\n✅ Не используйте роуминг длительное время\\n"
      parse_mode: MarkdownV2
      disable_web_preview: true
