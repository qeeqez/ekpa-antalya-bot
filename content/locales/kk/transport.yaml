- id: BUS
  text: "*\U0001F68EҚоғамдық көлік*\n\n \U0001F4CD Маршрут *Google Maps қолданбасында жақсы жоспарланған\\.\n \U0001F9ED Автобустардың\
    \ ағымдағы орнын *AntalyaKart* қосымшасынан көруге болады\n\n \U0001F4B5 *Жолақы*\n AntalyaKart \\- 9\\,6 TL\n Банк картасы\
    \ \\- 9\\,85 TL\n\n \U0001FA99️ *Трансфер құны*\n AntalyaKart \\- 3 TL\n Банк картасы \\- 9\\,85 TL\n\n ℹ️ *6 жасқа дейінгі\
    \ балалар тегін*\n ⚠️ *Көлікте қолма\\-қол ақша төлеуге тыйым салынады*"
  button_texts:
    bus_concessionary: 🎫 {{button_benefits}}
- id: BUS_CONCESSIONARY
  text: '🧒👴 *Артықшылықты саяхат*


    ℹ️ Жеңілдікпен саяхаттау үшін жеңілдік картасын жасау керек


    💵 *Жолақы*

    Студенттер мен мектеп оқушылары \- 4 TL

    Қарт адамдар, мүгедектер, мұғалімдер \- 8\,4 TL


    🪙️ *Трансфер құны \- 3 TL*


    ⁉️️ *Жеңілдік картасын қалай алуға болады?*

    \- Балаларға, қарттар мен мүгедектерге, мұғалімдерге беріледі

    \- Фотосуреті бар жеке карта

    \- Балаға мектептен оқушы екендігі туралы анықтама керек

    \- Тек негізгі AntalyaKart филиалдарында жасауға болады

    \- [Ең жақын филиал осында](https://goo.gl/maps/UHUeQU8AqJ9D4DSy6), жерасты өткелінде'
- id: ANTALYA_CARD
  text: "*\U0001F4B3 Antalya Kart*\n\n ℹ️ Бұл картамен жол жүру ақысы арзанырақ\n ℹ️ Екі адамға төлеуге болады, бірінші төлемнен\
    \ кейін күту керек\n\n \U0001F4CD *Қайдан сатып алуға болады?*\n \\- Жақын жерде [Soylu Market](https://goo.gl/maps/XLS1rGdPT9dvaziG9)\n\
    \ \\- *Antalya Kart* қосымшасында *Ең жақын нүкте* бөлімінде сату нүктелері қызыл түспен белгіленген\n\n \U0001FA99 *Қалай\
    \ толтыруға болады?*\n \\- Сіз сатып алған жерде қолма\\-қол ақшалай аласыз\n \\- Antalya Kart қосымшасында түрік банк\
    \ картасымен онлайн толтырыңыз\n\n ⁉️ *Мен картаны толтырдым, бірақ ақша шықпады*\n \\- Автобустағы терминалда қызыл толтыру\
    \ түймесін басыңыз\n \\- 5 секунд ұстап тұрыңыз\n\n \U0001F68C *Қолданбадағы маршруттарды қалай көруге болады?*\n \\-\
    \ Google Maps қолданбасынан қолайлы бағытты табыңыз\n \\- Antalya Kart қолданбасында іздеуге маршрут нөмірін енгізіңіз\n\
    \ \\- Бүкіл маршрут пен сұр автобустар қазір жүріп жатқан жерлерде көрсетіледі\n \\- Жалауша \\-\\> маршруттың соңы, Үшбұрыш\
    \ \\-\\> басы\n \\- Бағыт бағытын жасыл түймені басу арқылы өзгертуге болады"
  button_texts:
    antalya_card_android: 🤖 {{button_android}}
    antalya_card_iphone: 📱 {{button_iphone}}
- id: TAXI
  text: '*🚖 Такси*


    ℹ️ Анталияның түкпір\-түкпірінде такси шақыру түймелері ілулі тұр, көлік түнде де келеді


    🤙 *Қоңырау шалуға болады:*

    1\. Кіру алдындағы түйме

    2\. BiTaxi қолданбасы

    3\. Uber қолданбасы


    💵 *Құны: Қону 10TL \+ 14TL/км*


    🪙 *Төлем*

    \- Айнадағы есептегішке сәйкес

    \- Қолданбалардағы құны бірдей есептегіш арқылы есептеледі

    \- Қолма\-қол лирамен немесе картамен төлей аласыз \(барлық таксилерде емес\)

    \- Қолданбада байланыстырылған картамен төлеуге болады'
