- id: HOW_TO_PAY_AIDAT
  text: '*Aidat*


    ℹ️ Kompleksin aylık bakım ücreti\.

    ⚠️Apartman dairesinde yaşamasanız bile ödeme yapmanız gerekmektedir\.


    *Maliyet:*

    ''''''''

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Ayrı mutfak\)

    3\+1\- 1970 TL

    ''''''''

    *Ödeme süresi:*

    ⏳ Her ayın 5’ine kadar


    *Ödeme:*

    🪙 Yönetim Şirketi Ofisinde nakit veya kart


    💳 Türk banka kartından hesaba online transfer:


    🏦`TR24 0013 4000 0203 8787 9000 01`


    *Alıcının adı ve ödeme açıklaması*

    🧑`EKPA 1207 SİTESİ YÖNETİMİ`

    ℹ️`Aidat Ekpa 1207` Blok Daire Ayı


    ⚠️Ödeme yaptığınız blok, daire ve ayın numarasını mutlaka belirtin'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Klima*


    ℹ️ Merkezi klima sistemi elektrik faturasına dahil değildir\.

    ⚠️Türkiye''nin sıcak bir ülke olduğunu ve burada elektriğin pahalı olduğunu unutmayın\.


    *Ödeme süresi:*

    ⏳ Faturanın alındığı tarihten itibaren 7 gün

    ⚠️Ödeme yapılmazsa devre dışı bırakılır\. Uzaktan kumandada bir kilit simgesi ve Merkezi\ görünecektir.


    *Ödeme:*

    🪙 Yönetim Şirketi Ofisinde nakit veya kart


    💳 Türk banka kartından hesaba online transfer:


    🏦`TR24 0013 4000 0203 8787 9000 01`


    *Alıcının adı ve ödeme açıklaması*

    🧑`EKPA 1207 SİTESİ YÖNETİMİ`

    ℹ️`Klima Ekpa 1207` Blok Daire


    ⚠️Ödeme yaptığınız blok ve daire numaralarını mutlaka belirtin'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Elektrik*


    ℹ️Klima elektrik faturasına dahil değildir\.


    ℹ️ *Abone numarası* bağlantı sırasında verilir ve ödeme kartının üzerinde de belirtilir\.


    *Ödeme süresi:*

    ℹ️Fatura ay sonunda kesilir

    ⏳ Ödemenin fatura kesildikten sonraki 10 gün içinde yapılması gerekmektedir\.


    *Elektrik faturanızı nasıl öğrenirsiniz:*

    \- Ödeme yaparken Türk İnternet bankasında

    \- Adrese gelen ödeme makbuzu birinci katta duvardaki bir kutuya konulur

    \- Online olarak [CK Akdeniz](https://online.ckakdeniz.com.tr) web sitesinde


    *Ödeme:*


    💳 *Türk İnternet Bankacılığında Online*

    1\. Fatura \(Fatura Ödeme\) \-\> Elektrik \(Elektrik\) \-\> *CK Akdeniz Elektrik*

    2\. *abone numaranızı* girin

    3\. Tutarı görecek ve ödeyebileceksiniz

    ⚠️Fatura henüz kesilmemişse uygulama hata verecektir.


    🪙 *Nakit veya kart*

    \- Turkcell şubesinde küçük bir komisyonla [En Yakın 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [En Yakın 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- PTT postanesinde, [En yakın postane](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- CK Akdeniz Elektrik''in herhangi bir ofisinde, [En yakın ofis](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Su*


    ℹ️ *Abone numarası* bağlantı sırasında verilir ve ödeme kartının üzerinde de belirtilir\.


    *Ödeme süresi:*

    ℹ️Fatura ay sonunda kesilir

    ⏳ Ödemenin fatura kesildikten sonraki 10 gün içinde yapılması gerekmektedir\.


    *Su faturanızı nasıl öğrenirsiniz:*

    \- Ödeme yaparken Türk İnternet bankasında

    \- Adrese gelen ödeme makbuzu birinci katta duvardaki bir kutuya konulur

    \- Çevrimiçi olarak [ASAT](https://online.asat.gov.tr/webportal/index.php)\ web sitesinde. HIZLI ÖDEME''ye tıklayın


    *Ödeme:*


    💳 *Türk İnternet Bankacılığında Online*

    1\. Fatura \(Fatura Ödeme\) \-\> Su \(Su\) \-\> *Antalya Su \(ASAT\)*

    2\. *Abone numaranızı* girin \(Numaranın soluna birkaç sıfır ekleyin\)

    3\. Tutarı görecek ve ödeyebileceksiniz

    ⚠️Fatura henüz kesilmemişse uygulama hata verecektir.


    🪙 *Nakit veya kart*

    \- Turkcell şubesinde küçük bir komisyonla [En Yakın 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [En Yakın 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- PTT postanesinde, [En yakın postane](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- [ASAT Merkez Ofisinde](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱Cep telefonu ve İnternet 🌎*


    💳 *Online uygulamada veya operatörünüzün web sitesinde*

    \- Telefonunuz için bir sonraki aya ait bir paket seçmeniz gerekiyor

    \- Bakiyenizi kolayca doldurabilir ve daha sonra paketler için ödeme yapabilirsiniz.

    \- İnternet için bir önceki aya ait faturayı ödemeniz gerekmektedir


    🪙 *Nakit veya kart*

    \- Turkcell şubesinde küçük bir komisyonla [En Yakın 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [En Yakın 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Telekom operatörünüzün herhangi bir ofisinde'
- id: HOW_TO_CONNECT
  text: '*🧑‍🔧 Nasıl bağlanılır/yeniden kayıt olunur? ♻️*


    1️⃣ İlk bağlantı süreci yeniden kayıttan farklı değildir

    2️⃣ Yeniden kaydolurken, önceki ödeme yapan kişinin bağlantıyı kesmek için ayrıca seyahat etmesine gerek yoktur'
