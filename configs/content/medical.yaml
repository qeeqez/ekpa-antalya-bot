        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "AID_KIT_BUTTON"
        target: "AID_KIT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "MEDICINE"
    text: |
      *💊 Лекарства*
      
      📝 Рецепты выдаются врачами
      
