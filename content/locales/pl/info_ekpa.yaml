- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Ubezpieczenie od trzęsienia ziemi Dask*


    ℹ️ *Informacja:*

    \- Wymagane otwarcie rachunku za wodę i prąd\.

    \- Przed wyjazdem do Asat lub CK Akdeniz Elektrik *powinieneś już mieć Dask*\.

    \- Nie możesz tego zrobić w Dask Bank\.

    \- Możesz to zrobić w dowolnej firmie ubezpieczeniowej lub w Nkolay, korzystając z poniższego linku\.


    💼 *Zabierz ze sobą:*

    1\. Tapu lub umowa najmu

    2\. Paszport lub Ikamet

    3\. Turecki numer podatkowy \(Wystarczy sam numer\)

    4\. Pełny adres / Powiedz Ekpie


    📍 *Zamów Dask w [Nkolay](https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️prąd*


    💼 *Zabierz ze sobą:*

    1\. *Tapu* lub *umowa najmu*

    2\. *Paszport* lub *Ikamet*

    3\. Turecki *numer podatkowy* \(Wystarczy sam numer\)

    4\. Ubezpieczenie od trzęsień ziemi *Dask*

    5\. *Pieniądze* za depozyt \(Zwracane po rozłączeniu\)


    📍 *Możesz się połączyć tylko w [siedzibie CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    🧑‍💼*Zgłoś do Kodeksu karnego:*

    Numer bloku i mieszkania oraz numer abonenta energii elektrycznej\.


    ℹ️ Światło pojawi się w mieszkaniu w ciągu 1 dnia roboczego\.

    ℹ️ Jeżeli występują problemy z prądem\- powiadom Kodeks Karny\.


    ⚠️ Panel elektryczny znajduje się w szafie\.

    ⚠️Licznik energii elektrycznej znajduje się w piwnicy za zamkniętymi drzwiami\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Woda*


    💼 *Zabierz ze sobą:*

    1\. *Tapu* lub *umowa najmu*

    2\. *Paszport* lub *Ikamet*

    3\. Turecki *numer podatkowy* \(Wystarczy sam numer\)

    4\. Ubezpieczenie od trzęsień ziemi *Dask*

    5\. *Pieniądze* za depozyt \(Zwracane po rozłączeniu\)


    📍 *Podłącz wodę do [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*Zgłoś do Kodeksu karnego:*

    Numer bloku i mieszkania oraz numer abonenta wody\.


    ℹ️ W ciągu 3 dni roboczych w mieszkaniu pojawi się woda\.

    ℹ️ Jeżeli masz problemy z wodą lub ciśnieniem w kranach\- powiadom Kodeks Karny\.


    ⚠️Apartament posiada zawór odcinający dopływ wody\.

    \- Przy 1\+1 zajrzyj pod zlew\.

    \- W 2\+1 jest w duszy\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎 Internet*


    ℹ️ *Aby połączyć się z Internetem potrzebne jest zezwolenie na pobyt \(ikamet\)*


    ℹ️ *Internet domowy w Turcji w ramach umowy*

    \- Umowa zostaje zawarta na rok lub dwa lata

    \- W przypadku wcześniejszego rozwiązania umowy zostanie naliczona kara

    \- Płatność dokonywana jest co miesiąc


    🌐 *Operatorzy Internetu*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Aby się połączyć należy skontaktować się z biurem operatora za pomocą ikamet\. Cena jest taka sama jak na stronie operatora\.

    ⚠️ Biuro może nie znaleźć naszego adresu w systemie, zalecamy kontakt z biurami położonymi najbliżej kompleksu\.


    🏴‍☠️ *Połącz się bez pozwolenia na pobyt*

    \- Aby połączyć się bez pozwolenia na pobyt, należy znaleźć osobę, która sama załatwi sobie Internet\.

    \- Jest to zazwyczaj droższe, wielu „pomocników” pobiera opłatę za taką usługę\.

    \- Pomocnika można znaleźć u pośrednika w handlu nieruchomościami lub w biurach operatorów internetowych\.


    ⚡️ *Metody alternatywne*

    \- Udostępnij Internet ze swojego telefonu

    \- Poproś sąsiadów o pomoc, udostępnij Wi-Fi'
- id: HOW_TO_DISCONNECT
  text: '*⛔️ Jak wyłączyć?*'
  button_texts:
    disconnect_electricity: ⚡️ Prąd
    disconnect_water: 💧 Woda
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️prąd*


    💰 W przypadku rozłączenia zwracana jest kaucja wpłacona przy połączeniu, pomniejszona o saldo do wpłaty


    🌎 *Wyłącz online*

    \- Zaloguj się do Edevlet

    \- Przejdź do strony [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- Lub wpisz wyszukiwanie `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu`

    \- Kliknij *"Nowa aplikacja" \(Yeni Başvuru\)*, wybierz konto i podaj swoje dane

    \- Wpisz numer IBAN, na który zostaną przelane pieniądze

    ⚠️ *Możesz rozłączyć się online tylko wtedy, gdy masz połączenie z Ikamet*


    📍 *Wyłącz prąd offline w [siedzibie CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *Zabierz ze sobą:*

    1\. *Numer abonenta* \(szybciej zostanie znaleziony w systemie\)

    2\. *Paszport* lub *Ikamet*

    3\. *IBAN*, na który zostaną przelane pieniądze


    ℹ️ W ciągu 24 godzin w mieszkaniu zabraknie prądu\.

    ℹ️ Pieniądze zostaną przelane na konto tureckie dopiero po odłączeniu, w ciągu 7\-30 dni\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Woda*


    💰 W przypadku rozłączenia zwracana jest kaucja wpłacona przy połączeniu, pomniejszona o saldo do wpłaty


    🌎 *Wyłącz online*

    \- Zaloguj się do Edevlet

    \- Przejdź do strony [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- Lub wpisz szukaj `ASAT Abonelik Sözleşme Feshi Başvurusu`

    \- Kliknij *"Nowa aplikacja" \(Yeni Başvuru\)*, wybierz konto i podaj swoje dane

    \- Wpisz numer IBAN, na który zostaną przelane pieniądze

    ⚠️ *Możesz rozłączyć się online tylko wtedy, gdy masz połączenie z Ikamet*


    📍 *Włącz wodę offline w [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Zabierz ze sobą:*

    1\. *Numer abonenta* \(szybciej zostanie znaleziony w systemie\)

    2\. *Paszport* lub *Ikamet*

    3\. *IBAN*, na który zostaną przelane pieniądze


    ℹ️ W ciągu 3 dni roboczych woda w mieszkaniu zniknie\.

    ℹ️ Pieniądze zostaną przelane na konto tureckie dopiero po odłączeniu, w ciągu 7\-30 dni\.'
