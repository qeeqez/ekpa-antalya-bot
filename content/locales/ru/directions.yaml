- id: CITY_HALL
  text: '*🏛 Belediye \(Муниципалитет\)*


    ℹ️ В данном заведении можно получить справку *Нумаратаж* \(Numarataj\), необходимую для получения ВНЖ

    ⚡️ На первом этаже можно сделать копии документов за 1 TL


    📍 [Kepez Belediye](https://goo.gl/maps/5WBP63uMR5dCa1HcA) \(3\.5 км\)

    '
- id: POPULATION_OFFICE
  text: '*🧑‍💼 Nufus \(Министерство регистрации населения\)*


    ℹ️ В данном заведении оформляют Тапу, прописывают Турецких граждан, регистрируют новорожденных и решают другие вопросы
    народонаселения\.

    ⚠️ Иностранцы должны прописываться в Goc, а не Nufus\.


    📍 [Kepez Nufus](https://goo.gl/maps/1u4SiTYfYBVbRNFs8) \(3\.5 км\)

    '
- id: MIGRATION_OFFICE
  text: '*👮 Goc Idaresi \(Управление миграции Анталии\)*


    1️⃣ Здесь нужно сделать прописку\.

    2️⃣ Здесь происходит рандеву \(подача на ВНЖ\) и решаются все вопросы связанные с ВНЖ\.

    3️⃣ Сюда могут позвать на отпечатки пальцев тех, кто еще это не сделал\.


    📍 [Goc Idaresi](https://goo.gl/maps/Q46vs5Dj9ipu32cS9) \(8\.1 км\)

    '
