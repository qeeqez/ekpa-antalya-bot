      en:
        description: "Our chats"
      tr:
        description: "Sohbetlerimiz"
      ar:
        description: "محادثاتنا"

screens:
  - id: "MAIN_MENU"
    text: "*Главное меню*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "ekpa_main_chat"
              text: "🏠 Основной чат EKPA"
              type: "url"
              url: "https://t.me/+14s_2-3hZzVmODAy"
        - buttons:
            - id: "our_chats"
              text: "💬 Наши Чаты"
              type: "callback"
              callback: "OUR_CHATS_BUTTON"
        - buttons:
            - id: "directions"
              text: "🏡 В Комплексе и рядом"
              type: "callback"
              callback: "DIRECTIONS_BUTTON"
        - buttons:
            - id: "info_useful"
              text: "⭐️ Информация"
              type: "callback"
              callback: "INFO_USEFUL_BUTTON"
            - id: "info_ekpa"
              text: "🌟 Все о EKPA"
              type: "callback"
              callback: "INFO_EKPA_BUTTON"
        - buttons:
            - id: "address"
              text: "📍 Наш Адрес"
              type: "callback"
              callback: "ADDRESS_BUTTON"
        - buttons:
            - id: "suggest_changes"
              text: "✍️ Предложить изменения"
              type: "url"
              url: "https://t.me/qeeqez"
    locales:
      en:
        text: "*Main menu*"
        button_texts:
          ekpa_main_chat: "🏠 EKPA Main Chat"
          our_chats: "💬 Our Chats"
          directions: "🏡 In and around the complex"
          info_useful: "⭐️ Information"
          info_ekpa: "🌟 All about EKPA"
          address: "📍 Our Address"
          suggest_changes: "✍️ Suggest changes"
      tr:
        text: "*Ana menü*"
        button_texts:
          ekpa_main_chat: "🏠 EKPA Ana Sohbet"
          our_chats: "💬 Sohbetlerimiz"
          directions: "🏡 Sitede ve çevresinde"
          info_useful: "⭐️ Bilgi"
          info_ekpa: "🌟 EKPA hakkında her şey"
          address: "📍 Adresimiz"
          suggest_changes: "✍️ Değişiklik öner"
      ar:
        text: "*القائمة الرئيسية*"
        button_texts:
          ekpa_main_chat: "🏠 الدردشة الرئيسية EKPA"
          our_chats: "💬 محادثاتنا"
          directions: "🏡 في المجمع وما حوله"
          info_useful: "⭐️ معلومات"
          info_ekpa: "🌟 كل شيء عن EKPA"
          address: "📍 عنواننا"
          suggest_changes: "✍️ اقترح تغييرات"
    navigation:
      - callback: "OUR_CHATS_BUTTON"
        target: "OUR_CHATS"
      - callback: "DIRECTIONS_BUTTON"
        target: "DIRECTIONS"
      - callback: "DIRECTIONS_SITE_BUTTON"
        target: "DIRECTIONS_SITE"
      - callback: "INFO_USEFUL_BUTTON"
        target: "INFO_USEFUL"
      - callback: "INFO_EKPA_BUTTON"
