- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Dask жер сілкінісінен сақтандыру*


    ℹ️ *Ақпарат:*

    \- Су мен электр энергиясына есепшот ашу қажет\.

    \- Asat немесе CK Akdeniz Elektrik-ке барар алдында сізде *Dask болуы керек*\.

    \- Сіз мұны Dask банкінде жасай алмайсыз\.

    \- Сіз мұны кез келген сақтандыру компаниясында немесе төмендегі сілтеме арқылы Nkolay-да жасай аласыз\.


    💼 *Өзіңізбен бірге алыңыз:*

    1\. Тапу немесе жалдау шарты

    2\. Паспорт немесе Икамет

    3\. Түркия салық нөмірі \(Санның өзі жеткілікті\)

    4\. Толық мекен-жайы / Экпаға айтыңыз


    📍 *[Нколай] (https://goo.gl/maps/nyumU39FQYJTnFZt9) арқылы даскқа тапсырыс беріңіз*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Электр*


    💼 *Өзіңізбен бірге алыңыз:*

    1\. *Тапу* немесе *жалдау шарты*

    2\. *Төлқұжат* немесе *Икамет*

    3\. Түрік *салық нөмірі* \(Санның өзі жеткілікті\)

    4\. Жер сілкінісінен сақтандыру *Dask*

    5\. *Ақша* депозитке \(ажыратқанда қайтарылады\)


    📍 *Сіз тек [CK Akdeniz Elektrik бас кеңсесінде](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9) қосыла аласыз*


    🧑‍💼*Қылмыстық кодекске хабарлау:*

    Блок және пәтер нөмірі, сондай-ақ электр энергиясының абоненттік нөмірі\.


    ℹ️ Пәтерде жарық 1 жұмыс күні ішінде пайда болады\.

    ℹ️ Электр қуатына қатысты ақаулар болса\- Қылмыстық кодекске хабарлаңыз\.


    ⚠️ Электр панелі шкафта\.

    ⚠️ Электр есептегіш жертөледе жабық есіктің артында орналасқан\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Су*


    💼 *Өзіңізбен бірге алыңыз:*

    1\. *Тапу* немесе *жалдау шарты*

    2\. *Төлқұжат* немесе *Икамет*

    3\. Түрік *салық нөмірі* \(Санның өзі жеткілікті\)

    4\. Жер сілкінісінен сақтандыру *Dask*

    5\. *Ақша* депозитке \(ажыратқанда қайтарылады\)


    📍 *Суды [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6) желісіне қосыңыз*


    🧑‍💼*Қылмыстық кодекске хабарлау:*

    Блок және пәтер нөмірі, сондай-ақ су үшін абоненттік нөмір\.


    ℹ️ 3 жұмыс күні ішінде пәтерде су пайда болады\.

    ℹ️ Су немесе шүмектегі қысым мәселесі туындаса\- Қылмыстық кодекске хабарлаңыз\.


    ⚠️ Пәтерде суды өшіретін клапан бар\.

    \- 1\+1, раковинаның астына қараңыз\.

    \- 2-де\+1 жанда\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎 Интернет*


    ℹ️ *Интернетке қосылу үшін сізге тұруға ықтиярхат қажет \(ikamet\)*


    ℹ️ *Туркиядағы үй интернеті келісімшарт бойынша*

    \- Келісімшарт бір-екі жылға

    \- Келісімшарт мерзімінен бұрын бұзылған жағдайда айыппұл төленеді

    \- Төлем ай сайын жүргізіледі


    🌐 *Интернет операторлары*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Қосылу үшін ikamet\ арқылы оператор кеңсесіне хабарласу қажет\. Бағасы оператордың веб-сайтындағымен бірдей\.

    ⚠️ Кеңсе жүйеде мекенжайымызды таппауы мүмкін, кешенге жақын орналасқан кеңселерге хабарласуды ұсынамыз\.


    🏴‍☠️ *Тұрғылықты тұруға рұқсатсыз қосылу*

    \- Тұруға рұқсатсыз қосылу үшін интернетті өзі реттейтін адамды табу керек\.

    \- Бұл әдетте қымбатырақ, көптеген «көмекшілер» мұндай қызмет үшін ақша алады\.

    \- Көмекшіні риэлторыңыз арқылы немесе интернет-операторлардың кеңселері арқылы табуға болады\.


    ⚡️ *Балама әдістер*

    \- Интернетті телефоннан бөлісіңіз

    \- Көршілеріңізден көмек сұраңыз, Wi-Fi желісін бөлісіңіз'
- id: HOW_TO_DISCONNECT
  text: '*⛔️ Қалай өшіруге болады?*'
  button_texts:
    disconnect_electricity: ⚡️ Электр
    disconnect_water: 💧 Су
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Электр*


    💰 Егер сіз ажыратсаңыз, қосылған кезде төленген депозит төлем балансын алып тастап қайтарылады\.


    🌎 *Онлайнды өшіру*

    \- Edevlet жүйесіне кіріңіз

    \- [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)
    бетіне өтіңіз

    \- Немесе іздеуге `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu` теріңіз

    \- *"Жаңа қолданба" \(Yeni Başvuru\)* түймесін басып, есептік жазбаны таңдаңыз және мәліметтеріңізді толтырыңыз

    \- Ақша аударылатын IBAN кодын толтырыңыз

    ⚠️ *Ikamet-ке қосылған болсаңыз ғана желіден ажыратуға болады*


    📍 *[CK Akdeniz Elektrik бас кеңсесінде](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)* желіден тыс электр қуатын өшіріңіз\.


    💼 *Өзіңізбен бірге алыңыз:*

    1\. *Абонент нөмірі* \(оны жүйеде тезірек табады\)

    2\. *Төлқұжат* немесе *Икамет*

    3\. Ақша аударылатын *IBAN*


    ℹ️ 24 сағат ішінде пәтерде электр жарығы өшеді\.

    ℹ️ Ақша түрік шотына тек ажыратылғаннан кейін, 7\-30 күн ішінде түседі\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Су*


    💰 Егер сіз ажыратсаңыз, қосылған кезде төленген депозит төлем балансын алып тастап қайтарылады\.


    🌎 *Онлайнды өшіру*

    \- Edevlet жүйесіне кіріңіз

    \- [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu) бетіне
    өтіңіз

    \- Немесе іздеуге `ASAT Abonelik Sözleşme Feshi Başvurusu` теріңіз

    \- *"Жаңа қолданба" \(Yeni Başvuru\)* түймесін басып, есептік жазбаны таңдаңыз және мәліметтеріңізді толтырыңыз

    \- Ақша аударылатын IBAN кодын толтырыңыз

    ⚠️ *Ikamet-ке қосылған болсаңыз ғана желіден ажыратуға болады*


    📍 *Офлайн суды [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6) қолданбасында өшіріңіз*


    💼 *Өзіңізбен бірге алыңыз:*

    1\. *Абонент нөмірі* \(оны жүйеде тезірек табады\)

    2\. *Төлқұжат* немесе *Икамет*

    3\. Ақша аударылатын *IBAN*


    ℹ️ 3 жұмыс күні ішінде пәтердегі су жоғалады\.

    ℹ️ Ақша түрік шотына тек ажыратылғаннан кейін, 7\-30 күн ішінде түседі\.'
