version: '1.0'
screens:
- id: INFO_USEFUL
  parse_mode: MarkdownV2
  inline_keyboard:
    rows:
    - buttons:
      - id: important_docs
        type: callback
        callback: IMPORTANT_DOCUMENTS_BUTTON
    - buttons:
      - id: delivery
        type: callback
        callback: DELIVERY_BUTTON
      - id: aid_kit
        type: callback
        callback: AID_KIT_BUTTON
      - id: transport
        type: callback
        callback: TRANSPORT_BUTTON
    - buttons:
      - id: phone_unlock
        type: callback
        callback: PHONE_UNLOCK_BUTTON
    - buttons:
      - id: car_fine
        type: callback
        callback: CAR_FINE_BUTTON
    - buttons:
      - id: phone_numbers
        type: callback
        callback: PHONE_NUMBERS_BUTTON
  navigation:
  - callback: IMPORTANT_DOCUMENTS_BUTTON
    target: IMPORTANT_DOCUMENTS
  - callback: DELIVERY_BUTTON
    target: DELIVERY
  - callback: AID_KIT_BUTTON
    target: AID_KIT
  - callback: TRANSPORT_BUTTON
    target: TRANSPORT
  - callback: PHONE_UNLOCK_BUTTON
    target: PHONE_UNLOCK
  - callback: CAR_FINE_BUTTON
    target: CAR_FINE
  - callback: PHONE_NUMBERS_BUTTON
    target: PHONE_NUMBERS
