version: "1.0"

screens:
  - id: "AID_KIT"
    text: "*🏥 Медицина*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "ambulance"
              text: "🚑 Скорая помощь"
              type: "callback"
              callback: "AMBULANCE_BUTTON"
        - buttons:
            - id: "pharmacies"
              text: "💊 Аптеки"
              type: "callback"
              callback: "PHARMACIES_BUTTON"
        - buttons:
            - id: "hospitals"
              text: "🏥 Больницы"
              type: "callback"
              callback: "HOSPITALS_BUTTON"
        - buttons:
            - id: "polyclinic"
              text: "🏥 Поликлиника"
              type: "callback"
              callback: "POLYCLINIC_BUTTON"
        - buttons:
            - id: "medicine"
              text: "💊 Лекарства"
              type: "callback"
              callback: "MEDICINE_BUTTON"
        - buttons:
            - id: "info_useful"
              text: "⭐️ Полезная информация"
              type: "callback"
              callback: "INFO_USEFUL_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "AMBULANCE_BUTTON"
        target: "AMBULANCE"
      - callback: "PHARMACIES_BUTTON"
        target: "PHARMACIES"
      - callback: "HOSPITALS_BUTTON"
        target: "HOSPITALS"
      - callback: "POLYCLINIC_BUTTON"
        target: "POLYCLINIC"
      - callback: "MEDICINE_BUTTON"
        target: "MEDICINE"
      - callback: "INFO_USEFUL_BUTTON"
        target: "INFO_USEFUL"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "AMBULANCE"
    text: |
      *🚑 Скорая помощь*
      
      📞 Номер: `112`
      
      🏥 Ближайшая больница:
      📍 [Kepez Devlet Hastanesi](https://goo\.gl/maps/b5cnrK2H4apXkqWw9)
      
      ⚠️ При звонке в скорую, сообщите адрес четко
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "aid_kit"
              text: "🏥 Медицина"
              type: "callback"
              callback: "AID_KIT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "AID_KIT_BUTTON"
        target: "AID_KIT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "PHARMACIES"
    text: |
      *🧑‍⚕️ Аптеки \- Eczane*
                  
      ℹ️ В воскресенье обычные аптеки не работают
      
      📍 Множество аптек находится по дороге к больнице:
      📍 [Kepez Devlet Hastanesi](https://goo\.gl/maps/b5cnrK2H4apXkqWw9)
                  
      *🏥 Дежурные аптеки \- Nöbetçi Eczaneler*
      
      \- Работают круглосуточно
      \- Каждый день они разные
      \- Актуальные можно посмотреть на сайте или в приложении
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "pharmacies_site"
              text: "🌐 Сайт"
              type: "url"
              url: "https://www.eczaneler.gen.tr"
        - buttons:
            - id: "pharmacies_android"
              text: "🤖 Android"
              type: "url"
              url: "https://play.google.com/store/apps/details?id=com.eczane"
        - buttons:
            - id: "pharmacies_iphone"
              text: "🍎 iPhone"
              type: "url"
              url: "https://apps.apple.com/app/eczane/id123456"
        - buttons:
            - id: "aid_kit"
              text: "🏥 Медицина"
              type: "callback"
              callback: "AID_KIT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "AID_KIT_BUTTON"
        target: "AID_KIT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "HOSPITALS"
    text: |
      *🏥 Больницы*
      
      📍 [Kepez Devlet Hastanesi](https://goo\.gl/maps/b5cnrK2H4apXkqWw9)
      Государственная больница \(по страховке\)
      
      📍 Частные больницы:
      \- Medical Park
      \- Memorial
      \- Liv Hospital
      
      💡 Проверьте покрытие вашей страховки
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "hospitals_insurance_site"
              text: "🌐 Проверить страховку"
              type: "url"
              url: "https://www.sgk.gov.tr"
        - buttons:
            - id: "aid_kit"
              text: "🏥 Медицина"
              type: "callback"
              callback: "AID_KIT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "AID_KIT_BUTTON"
        target: "AID_KIT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

