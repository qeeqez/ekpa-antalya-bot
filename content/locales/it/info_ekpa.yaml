- id: HOW_TO_PAY_AIDAT
  text: '*Aidat*


    ℹ️ Canone mensile di manutenzione del complesso\.

    ⚠️ Devi pagare anche se non vivi in ​​appartamento\.


    *Costo:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Blocco Appartamento Mese


    ⚠️ Assicurati di indicare i numeri del blocco, dell''appartamento e del mese per il quale stai pagando'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Aria condizionata*


    ℹ️ L''impianto di climatizzazione centralizzato non è compreso nella bolletta elettrica\.

    ⚠️ Tieni presente che la Turchia è un paese caldo e qui l''elettricità è costosa\.


    *Termine di pagamento:*

    ⏳7 giorni dalla data di ricezione della fattura

    ⚠️ Se il pagamento non viene effettuato, verrà disabilitato\. Sul telecomando verranno visualizzati l''icona di un lucchetto
    e Centralizzato\.


    *Pagamento:*

    🪙 Contanti o carta presso l''Ufficio della Società di Gestione


    💳 Trasferimento online da una carta bancaria turca al conto:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Nome del destinatario e descrizione del pagamento*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Appartamento in blocco


    ⚠️ Assicurati di indicare i numeri dell''isolato e dell''appartamento per i quali stai pagando'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Elettricità*


    ℹ️ L''aria condizionata non è inclusa nella bolletta elettrica\.


    ℹ️ *Il numero di abbonamento* viene rilasciato al momento della connessione, è indicato anche sulla carta di pagamento\.


    *Termine di pagamento:*

    ℹ️ La fattura viene emessa alla fine del mese

    ⏳ Il pagamento dovrà essere effettuato entro 10 giorni dall''emissione della fattura\.


    *Come conoscere la bolletta elettrica:*

    \- Nella banca Internet turca al momento del pagamento

    \- La ricevuta di pagamento che arriva all''indirizzo viene riposta in una scatola appesa al muro al primo piano

    \- Online sul sito [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Pagamento:*


    💳 *Online nell''Internet Banking turco*

    1\. Fatura \(Pagamento fatture\) \-\> Elektrik \(Elettricità\) \-\> *CK Akdeniz Elektrik*

    2\. Inserisci il tuo *numero di abbonamento*

    3\. Vedrai l''importo e potrai pagare

    ⚠️ Se la fattura non è stata ancora emessa, l''applicazione visualizzerà un errore.


    🪙 *Contanti o carta*

    \- Nella filiale di Turkcell con una piccola commissione [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest
    2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Presso l''ufficio postale PTT, [Ufficio postale più vicino](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- In qualsiasi ufficio di CK Akdeniz Elektrik, [ufficio più vicino](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Acqua*


    ℹ️ *Il numero di abbonamento* viene rilasciato al momento della connessione, è indicato anche sulla carta di pagamento\.


    *Termine di pagamento:*

    ℹ️ La fattura viene emessa alla fine del mese

    ⏳ Il pagamento dovrà essere effettuato entro 10 giorni dall''emissione della fattura\.


    *Come conoscere la bolletta dell''acqua:*

    \- Nella banca Internet turca al momento del pagamento

    \- La ricevuta di pagamento che arriva all''indirizzo viene riposta in una scatola appesa al muro al primo piano

    \- Online sul sito [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Fare clic su HIZLI ÖDEME


    *Pagamento:*


    💳 *Online nell''Internet Banking turco*

    1\. Fatura \(Pagamento fatture\) \-\> Su \(Acqua\) \-\> *Antalya Su \(ASAT\)*

    2\. Inserisci il tuo *numero di abbonato* \(Aggiungi alcuni zeri a sinistra del numero\)

    3\. Vedrai l''importo e potrai pagare

    ⚠️ Se la fattura non è stata ancora emessa, l''applicazione visualizzerà un errore.


    🪙 *Contanti o carta*

    \- Nella filiale di Turkcell con una piccola commissione [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest
    2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Presso l''ufficio postale PTT, [Ufficio postale più vicino](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- Presso [sede centrale ASAT](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
