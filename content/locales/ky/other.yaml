screens:
- id: CAR_FINE
  text: "*\U0001F697 Чет элдик номурлуу унаага айып пул*\n\n ℹ️ *Айыптарды текшерүү*\n \\- [салык веб-сайтына] өтүңүз(https://ivd.gib.gov.tr/)\n\
    \ \\- Төмөнкү оң баскычты тандаңыз\n \\- *Yabancı Plakalı Araç Ödemeleri \\(Чет элдик унаа төлөмдөрү\\)*\n \\- Машинанын\
    \ номерин киргизиңиз\n\n \U0001F4B3 *Онлайн төлөө*\n \\- Айып пулду текшергенден кийин ошол жерден кылсаң болот\n \\-\
    \ Төлөм Түркиянын кредиттик картасы менен гана жүргүзүлүшү мүмкүн\n \\- Салык кызматы аркылуу төлөмдү тандоодо, экинчи\
    \ өтмөккө өтсөңүз \\(экинчи өтмөк\\)\n \\- Ziraat же Vakif Pay аркылуу төлөө мүмкүн болот\n\n \U0001FA99 *Нак акча менен\
    \ төлөө*\n \\- Салык кеңсесинде [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)"
- id: PHONE_UNLOCK
  text: '*📲 Телефонуңуздун кулпусун ачыңыз*


    ℹ️ *Түркияда 2 түрдүү телефон кулпусу бар*

    1\. SIM карта 90 күндөн кийин бөгөттөлөт \(турист\)

    2\. Телефондун өзү 120 күндөн кийин бөгөттөлөт \(кандайдыр бир түрк SIM картасы салынгандан кийин\)'
  button_texts:
    phone_unlock_sim: 📱 SIM кулпусун ачуу (турист)
    phone_unlock_imei: 📱 Телефонуңуздун кулпусун ачыңыз (IMEI)
- id: PHONE_UNLOCK_SIM
  text: '*📱 SIM картанын кулпусун ачуу \(Турист\)*


    ℹ️ *Кандай бөгөт коюу?*

    \- Эгерде сиздин SIM картаңыз Икамет эмес, паспорт үчүн берилген болсо \(жашоо уруксаты\)

    \- Анда ал туристтик сайт жана 90 күндөн кийин жабылат


    🆓 *Кантип кулпусун ачуу керек*

    \- Байланыш операторунун арызына акаметиңизди киргизиңиз \(эгер сизде бар болсо, номердин өзү жетиштүү, андыктан кагазы
    да иштейт\)

    \- Икамет жок болсо, анда аны башка адамга байлоо мүмкүн эмес


    ⚡️ *Альтернативдик ыкмалар*

    \- Убактылуу чечим катары комплекстин жанынан жергиликтүү адамдын атына чыгарылган SIM картаны сатып алсаңыз болот

    \- Жашоого уруксаты бар адам үчүн симди кайра каттаңыз'
- id: PHONE_UNLOCK_IMEI
  text: '*📱 Телефонуңуздун кулпусун ачуу \(IMEI\)*


    ℹ️ *Кандай бөгөт коюу?*

    \- Алынган телефонго түрк сим-картасы салынган учурдан тартып 120 күндөн кийин ал бөгөттөлөт\.

    \- Түркияда гана бөгөттөлгөн \(башка өлкөлөрдө толугу менен иштөөнү улантууда\)

    \- Бөгөттөлгөн телефондун өзү эмес, IMEI, б.а.\. атайын SIM карта уячасы\.

    \- Эч кандай SIM карталар, чалуулар же SMS иштебейт\. Телефон "Телефон жок" жана "Телефонго уруксат жок"\ дейт.

    \- Телефондун өзү ишин улантууда, анын ичинде WiFi жана интернет аркылуу мессенджерлерде чалуулар.'
  button_texts:
    phone_unlock_imei_free: 🆓 Акысыз вариант
    phone_unlock_imei_paid: 💰 Акы төлөнүүчү вариант (30000 TL)
    phone_unlock_imei_reblock: 🤯 Телефон кайра блоктолсо
- id: PHONE_UNLOCK_IMEI_FREE
  text: '🆓 *Телефондун кулпусун бекер ачуу*

    \- SIM картаны экинчи уячага салыңыз, эгер бар болсо \(айрым телефондордо ESIM кыла аласыз\)

    \- Мындан ары 120 күн санап чыгат

    \- Мөөнөтү бүткөндөн кийин экинчи уяча да бөгөттөлөт


    ❗️ Edevlet аркылуу бир жылга акысыз кулпуну ачуу иштебей калды, бул Ковиддин урматына убактылуу акция болду


    ⚡️ *Альтернативалуу вариант*

    \- Арзан телефон сатып алып, андан WiFi таратыңыз

    \- 4G модемди сатып алып, андан таратыңыз, бирок андан кийин чалууларды кабыл алуу мүмкүн эмес'
- id: PHONE_UNLOCK_IMEI_PAID
  text: "*\U0001F4B0 Расмий акы төлөнүүчү телефондун кулпусун ачуу*\n\nℹ️ 1 Адам ар 3 жылда 1 телефонду каттай алат\\.\n*Талап\
    \ кылынат:* бул адам 365 күндөн кеч эмес чет өлкөдөн келген болушу керек\n\n\U0001F4B0 *2024-жылдагы баасы: 30000 TL \U0001F92F\
    *\n\n\U0001F9E7 *Катталуу процесси:*\n\\- Почта аркылуу келген ikamet номери жана паролду колдонуп Edevletке кириңиз\n\
    \\- [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet) баракчасына өтүңүз \\(же `IMEI Kaydet`\\ деп издеңиз)\n\\\
    - Маалыматыңызды толтуруңуз \\(телефондогу бардык IMEI, паспортуңуз жана өлкөгө кирген күн\\)\n\\- Төлө\n\n\U0001FA99\
    \ *Накталай төлөм*\n\\- Салык кызматына накталай төлөсөңүз болот\n\\- Төлөгөндөн кийин [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet)\
    \ бетиндеги Edevlet аркылуу кулпусун ачуу үчүн арыз беришиңиз керек.\n\n\U0001F4B5 *Онлайн төлөм*\n\\- Төлөм түрк картасы\
    \ менен гана мүмкүн\\. Кредит гана, дебет кабыл алынбайт\n\\- Сиз салык кызматы аркылуу төлөөнү тандай аласыз \\(Vergi\
    \ Dairesi\\)\n     \\- Картаны киргизүүнүн ордуна экинчи өтмөккө өтүңүз\n     \\- ZiraatPay жана VakifPay менен төлөөгө\
    \ болот, мен муну зират аркылуу жасадым\n\n⛔️ *Терсиз жактары*\n\\- Ошол эле Икаметке катталган SIM картаны колдонушуңуз\
    \ керек\n\\- Бул эреже 3 жыл бою күчүндө болот, андан кийин каалаган SIM карталарды колдоно аласыз"
- id: PHONE_UNLOCK_IMEI_REBLOCK
  text: "\U0001F92F *Эгер телефон кайра бөгөттөлсө*\n\nℹ️ Телефон жана андагы сим карта ошол эле Икаметке катталган болушу\
    \ керек\n\n✅ *Эгерде баары жакшы болсо*\n\U0001F4F2 Түшүндүрүү үчүн BTK кызматына 120 номерине чалыңыз \\(Англис операторунун\
    \ тандоосу бар\\)\n\n\U0001F6A8 *Болбосо*\n\\- SIM картаңызды операторуңуздан башка Икаметке өткөрүңүз\n    \\- Учурдагы\
    \ төлөнүүчү топтом жоголду\n    \\- Өткөрүүнүн өзү бекер болбошу мүмкүн\n\\- Жаңы SIM картаны ачыңыз"
