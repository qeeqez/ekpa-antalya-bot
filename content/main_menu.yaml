      *Mahalle:* `Güneş`
      *Caddesi:* `Şehit Astsubay Ömer Halis Demir`
      *Site:* `Ekpa 1207`
      *Block* \(Блок\), *Daire* \(Квартира\), *Kat* \(Этаж\)

