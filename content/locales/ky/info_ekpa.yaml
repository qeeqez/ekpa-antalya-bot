- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Даск жер титирөөдөн камсыздандыруу*


    ℹ️ *Маалымат:*

    \- Суу жана электр энергиясына эсеп ачуу талап кылынат\.

    \- Asat же CK Akdeniz Elektrikке барардан мурун сизде *мурда Dask болушу керек*\.

    \- Сиз муну Dask банкында кыла албайсыз\.

    \- Сиз муну каалаган камсыздандыруу компаниясында же Nkolayда төмөнкү шилтеме аркылуу жасай аласыз\.


    💼 *Өзүңүз менен ала кетиңиз:*

    1\. Тапу же ижара келишими

    2\. Паспорт же Икамет

    3\. Түрк салык номери \(Сандын өзү жетиштүү\)

    4\. Толук адрес / Экпага айт


    📍 *[Нколай]да \(https://goo\.gl/maps/nyumU39FQYJTnFZt9\) буйрутма берүү*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Электр*


    💼 *Өзүңүз менен ала кетиңиз:*

    1\. *Tapu* же *ижара келишими*

    2\. *Паспорт* же *Икамет*

    3\. Түрк *салык номери* \(Сандын өзү жетиштүү\)

    4\. Жер титирөөдөн камсыздандыруу *Dask*

    5\. Аманат үчүн *Акча* \(ажырагандан кийин кайтарылат\)


    📍 *Сиз [CK Akdeniz Elektrik башкы кеңсесинде] гана кошула аласыз \(https://goo\.gl/maps/vSsz3eKUWZ7VYqqy9\)*


    🧑‍💼*Кылмыш кодексине билдирүү:*

    Блоктун жана батирдин номери, ошондой эле электр энергиясына абоненттик номер\.


    ℹ️ Квартирада жарык 1 жумушчу күндүн ичинде пайда болот\.

    ℹ️ Электр жарыгында көйгөйлөр болсо\- Кылмыш\-жаза кодексине кабарлаңыз\.


    ⚠️ Электр панели шкафта\.

    ⚠️ Электр эсептегич подвалда жабык эшиктин артында жайгашкан\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Суу*


    💼 *Өзүңүз менен ала кетиңиз:*

    1\. *Tapu* же *ижара келишими*

    2\. *Паспорт* же *Икамет*

    3\. Түрк *салык номери* \(Сандын өзү жетиштүү\)

    4\. Жер титирөөдөн камсыздандыруу *Dask*

    5\. Аманат үчүн *Акча* \(ажырагандан кийин кайтарылат\)


    📍 *Сууну [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6) тармагына туташтырыңыз*


    🧑‍💼*Кылмыш кодексине билдирүү:*

    Блоктун жана батирдин номери, ошондой эле сууга абоненттик номер\.


    ℹ️ 3 жумушчу күндүн ичинде батирде суу пайда болот\.

    ℹ️ Эгерде сизде суу же крандарда басым пайда болсо\- Кылмыш\-жаза кодексине кабарлаңыз\.


    ⚠️ Квартирада сууну өчүрүүчү клапан бар\.

    \- 1\+1, раковинанын астын караңыз\.

    \- 2\-де\+1 жанда\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎 Интернет*


    ℹ️ *Интернетке туташуу үчүн прописка керек \(ikamet\)*


    ℹ️ *Туркиядагы үй интернети келишим боюнча*

    \- Келишим бир\-эки жылга

    \- Келишим мөөнөтүнөн мурда бузулган учурда айып төлөнөт

    \- Төлөм ай сайын жүргүзүлөт


    🌐 *Интернет операторлору*

    \- [Түрк Телеком](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Туташуу үчүн оператордун кеңсесине ikamet\ менен кайрылышыңыз керек\. Баасы оператордун сайтындагыдай \.

    ⚠️ Офис биздин дарегибизди системадан таппай калышы мүмкүн, комплекске жакын жайгашкан кеңселерге кайрылууну сунуштайбыз\.


    🏴‍☠️ *Жашаганга уруксаты жок туташуу*

    \- Жашоого уруксаты жок туташуу үчүн интернетти өзү уюштура турган адамды табыш керек\.

    \- Бул адатта кымбатыраак, көптөгөн “жардамчылар” мындай кызмат үчүн акча алышат\.

    \- Жардамчыны риэлторуңуз же интернет операторлорунун кеңселери аркылуу тапса болот\.


    ⚡️ *Альтернативдик ыкмалар*

    \- Интернетти телефонуңуздан бөлүшүңүз

    \- Кошуналарыңыздан жардам сураңыз, Wi\-Fi бөлүшүңүз'
