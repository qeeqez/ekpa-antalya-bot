- id: EDEVLET
  text: '*🧧Эдевлет*


    ℹ️ Мамлекеттик кызматтардын көп түрдүүлүгү бар веб-сайт:

    \- Күбөлүктөрдү жана арыздарды алуу

    \- Акысыз дары

    \- Телефонуңуздун кулпусун ачыңыз

    \- Дагы көп


    🌎 [Сайттын шилтемеси](https://www.turkiye.gov.tr)


    ⚡️ *Кантип туташса болот*

    \- Жашоого уруксат алуу \(икамет\)

    \- Түрк телефон номери бар

    \- Почтада \(ПТТ\), ЭДевлет айт

    \- 20 лирага рейске пароль жасашат, смс аркылуу келет


    📍 [Эң жакынкы почта](https://goo.gl/maps/sCWvbXQSn5nhR1U48) \(2\,6 км\)'
  button_texts:
    edevlet_site: 🌐 Вебсайт
    edevlet_android: 🤖Android
    edevlet_iphone: 📱 iPhone
- id: TAX_NUMBER
  text: '*🪪ТИН \(Түркиянын салык номери\)*


    ℹ️ *Эмне үчүн?*

    \- Dask жана коммуналдык кызматтарды өзүңүз үчүн каттоо

    \- Жашоого уруксат

    \- Банк эсебин ачуу


    🌎 *Онлайнга кирүү*

    \- [салык веб-сайтына] өтүңүз(https://ivd.gib.gov.tr/)

    \- Төмөнкү борбордук баскычты тандаңыз

    \- *Yabancılar İçin Potansiyel Vergi Kimlik Numarası*

    \- *Жаран ЭМЕСТЕРДИН ПОЦЕНЦИАЛДЫК САЛЫК НОМЕРИНЕ АРЗАНУ*

    \- Маалыматыңызды толтуруңуз


    💸 *Салык кызматынан алыңыз*

    \- Кээде онлайн система ката жазып, салык кызматына кайрылууга туура келет

    \- Салык кызматы [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)'
- id: ADDRESS_NUMARATAJ
  text: '*🔖 Нумаратаж \(Нумаратаж\)*


    ℹ️ *Сертификат ырастоочу дарек*

    \- Каттоо үчүн талап кылынат

    \- Жашоого уруксат алуу үчүн талап кылынат


    💼 *Өзүңүз менен ала кетиңиз:*

    1\. Паспорт

    2\. Tapu

    3\. Ижара келишими

    4\. Бул документтердин көчүрмөлөрү


    ℹ️ *Кабыл алуу боюнча нускамалар:*

    1\. [Kepez Belediye] (https://goo.gl/maps/Fb68nczEehmjzf4K9) ичинде документтердин көчүрмөсүн жасаңыз

    2\. 2-кабатка чыгып, Нумаратаж белгилери боюнча Д блогунун коридоруна кириңиз

    3\. Билет ал, сага чалышат

    4\. Адамга документтердин бардык көчүрмөлөрүн бер

    5\. Биринчи кабатка биринин артынан бири түшүп, терезеден документтериңди бергиле, мөөр басышат

    6\. Икинжи этажа гайдып, нумаратаж середижилик берерлер

    ⚠️ Эгер араңарда бир нече болсоңор, анда бул күбөлүккө катталууга тийиш болгон ар бир адамдын паспортунун көчүрмөсүн бергиле\.


    📍 Баары [Кепез Беледиеде](https://goo.gl/maps/Fb68nczEehmjzf4K9) \(3\.5 км\) жасалат\.

    ⚡️ Биринчи кабатта документтердин көчүрмөсүн 1 тг'
- id: ADDRESS_REGISTRATION
  text: '*📌 Каттоо*


    ℹ️ *Каттоо жашоого уруксат алгандан кийин 20 күндүн ичинде жүргүзүлүшү керек*

    \- Балдарды ээрчитип жүрүүнүн кереги жок, ар бир адам бойго жеткени максатка ылайык

    \- Каттоосуз жашап турууга уруксат узартылбайт


    ℹ️ Чет элдиктер үчүн онлайн каттоо мындан ары мүмкүн эмес

    ℹ️ Чет элдиктер Nufusга катталууга милдеттүү эмес, бирок өзгөчө учурларда алар сизди ошол жерге каттай алышат


    📌 *Gocке катталуу*


    💼 *Өзүңүз менен ала кетиңиз:*

    1\. Икамет \(жашоо уруксаты\)

    2\. Тапу же ижара келишими

    3\. Numarataj \(Numarataj\)

    4\. Тапу/Келишим жана Нумаратаждын фотокөчүрмөлөрү

    5\. Сиздин атыңызга суу же электр энергиясы үчүн квитанция


    ⚡️ *Маанилүү:*

    \- Квитанция жаңы болушу керек, антпесе баш тартышат

    \- Алар квартира ээсинин кым-лык жана тапасынын көчүрмөсүн талап кылышы мүмкүн


    📍 *Ал жакка кантип жетсе болот:*

    \- [Goc Idaresi]ге кел (https://goo.gl/maps/Q46vs5Dj9ipu32cS9)

    \- Кире бериште *Адрес* деп икаметти көрсөт, киргизишет

    \- Имаратта *Адрес* деп айтыңыз, жолугушуу үчүн терезелердин сол жагындагы бөлмөгө чалууну күтүңүз'
