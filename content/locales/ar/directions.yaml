    2️⃣ هنا يتم اللقاء \(طلب الحصول على تصريح الإقامة\) ويتم حل كافة المسائل المتعلقة بتصريح الإقامة\.

    3️⃣ أولئك الذين لم يفعلوا ذلك بعد قد يتم استدعاؤهم هنا لأخذ بصمات أصابعهم.


