name: Build Bot

on:
  push:


jobs:
  build:
    name: Build Bot
    runs-on: ubuntu-latest

    steps:

      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: ⬇️ Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⬇️ Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: 🛠️ Build
        run: ./gradlew bootJar

      - name: 🚀 Cache jar
        uses: actions/cache@v3
        with:
          path: build/libs/
          key: ekpa-bot-jar-${{ github.run_number }}

  publish:
    name: Publish docker image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: 🧰 Checkout
        uses: actions/checkout@v3

      - name: 🐳️ Login to Scaleway Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.CONTAINER_REGISTRY_NAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_SECRET }}

      - name: ⬇️ Download jar
        uses: actions/cache@v3
        with:
          path: build/libs/
          key: ekpa-bot-jar-${{ github.run_number }}

      - name: 🐳️ Build and push 🚀
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY_URL }}/${{ secrets.CONTAINER_REGISTRY_NAME }}/ekpa-bot:latest
