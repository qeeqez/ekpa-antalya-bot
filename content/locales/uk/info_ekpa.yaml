- id: HOW_TO_PAY_AIDAT
  text: '*Айдат*


    ℹ️ Щомісячна плата за обслуговування комплексу\.

    ⚠️ Ви повинні платити, навіть якщо ви не проживаєте в квартирі\.


    *Вартість:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Блок Квартира Місяць


    ⚠️ Обов''язково вказуйте номери блоку, квартири та місяць за який ви платите'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Кондиціонер*


    ℹ️ Центральна система кондиціонування не входить у рахунок за електроенергію\.

    ⚠️ Майте на увазі, що Туреччина \- жарка країна, і електроенергія тут дорога\.


    *Термін оплати:*

    ⏳ 7 днів з моменту отримання рахунку

    ⚠️ Якщо платіж не буде здійснено, він буде відключений\. На пульті дистанційного керування з’явиться значок замка та Centralized\.


    *Оплата:*

    🪙 Готівкою або карткою в офісі керуючої компанії


    💳 Онлайн переказ з картки турецького банку на рахунок:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Ім’я одержувача та опис платежу*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Квартира в блоці


    ⚠️ Обов''язково вказуйте номери блоків та квартир, за які ви платите'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Електрика*


    ℹ️ Кондиціонер не входить у рахунок за електроенергію\.


    ℹ️ *Абонентський номер* видається при підключенні, також вказується на платіжній картці\.


    *Термін оплати:*

    ℹ️ Рахунок виставляється в кінці місяця

    ⏳ Оплату необхідно здійснити протягом 10 днів після виставлення рахунку\.


    *Як дізнатися свій рахунок за електроенергію:*

    \- В турецькому інтернет\-банку при оплаті

    \- Платіжна квитанція, яка приходить на адресу, кладеться в ящик на стіні на першому поверсі

    \- Онлайн на веб\-сайті [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Оплата:*


    💳 *Онлайн турецьким Інтернет\-банкінгом*

    1\. Fatura \(Оплата рахунків\) \-\> Elektrik \(Електрика\) \-\> *CK Akdeniz Elektrik*

    2\. Введіть свій *номер абонента*

    3\. Ви побачите суму і зможете оплатити

    ⚠️ Якщо рахунок ще не виставлено, програма видасть помилку\.


    🪙 *Готівкою або карткою*

    \- У відділенні Turkcell з невеликою комісією [Найближчий 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Найближчий 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- У поштовому відділенні PTT, [Найближче поштове відділення](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- У будь\-якому офісі CK Akdeniz Elektrik, [Найближчий офіс](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Вода*


    ℹ️ *Абонентський номер* видається при підключенні, також вказується на платіжній картці\.


    *Термін оплати:*

    ℹ️ Рахунок виставляється в кінці місяця

    ⏳ Оплату необхідно здійснити протягом 10 днів після виставлення рахунку\.


    *Як дізнатися свій рахунок за воду:*

    \- В турецькому інтернет\-банку при оплаті

    \- Платіжна квитанція, яка приходить на адресу, кладеться в ящик на стіні на першому поверсі

    \- Онлайн на веб\-сайті [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Натисніть HIZLI ÖDEME


    *Оплата:*


    💳 *Онлайн турецьким Інтернет\-банкінгом*

    1\. Fatura \(Оплата рахунків\) \-\> Su \(Вода\) \-\> *Antalya Su \(ASAT\)*

    2\. Введіть свій *номер абонента* \(Додайте кілька нулів зліва від номера\)

    3\. Ви побачите суму і зможете оплатити

    ⚠️ Якщо рахунок ще не виставлено, програма видасть помилку\.


    🪙 *Готівкою або карткою*

    \- У відділенні Turkcell з невеликою комісією [Найближчий 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Найближчий 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- У поштовому відділенні PTT, [Найближче поштове відділення](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- У [головному офісі ASAT](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱 Мобільний телефон та Інтернет 🌎*


    💳 *Онлайн в додатку або на сайті вашого оператора*

    \- Для вашого телефону потрібно вибрати пакет на наступний місяць

    \- Ви можете просто поповнити свій баланс і згодом оплачувати з нього пакети

    \- За Інтернет потрібно сплатити рахунок за попередній місяць


    🪙 *Готівкою або карткою*

    \- У відділенні Turkcell з невеликою комісією [Найближчий 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Найближчий 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- У будь\-якому офісі вашого оператора зв''язку'
