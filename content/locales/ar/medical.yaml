- id: MEDICINE
  text: '*💊 الأدوية التركية*


    *بيروكسيد الهيدروجين:*

    أوكسيجينلي سو


    *ألم في الحلق:*

    تانتوم فيردي \- رذاذ

    ستربسلز\- مصاصات


    *السعال:*

    رطب: أسيتيل سيستئين 600 ملغ \- مرة واحدة يومياً في الصباح \(في حالة التهاب المعدة \- بعد الوجبات أو بعد الأوميبرازول\)

    الجاف: يوجد الكثير من شراب السعال الجاف العشبي \(مثل فيتوسبان\)


    *سيلان الأنف:*

    طقم شطف الجيوب الأنفية \-شطف الأنف بماء البحر \(نوع الدولفين\)

    ناسوفيني \- بخاخ مضيق للأوعية \(زيلوميتازولين\)

    ريسونيل 0\.05% \- لعلاج التهاب الأنف التحسسي مع الاستخدام طويل الأمد لمضيقات الأوعية\. يزيل التورم في الأنف، ويقلل من
    تدفق \(Nasonex Analog\)، جرعتين في كل فتحة أنف مرتين يومياً لمدة أسبوعين، ثم جرعة واحدة مرتين يومياً لمدة أسبوعين، ثم
    \. جرعة واحدة مرة واحدة يومياً لمدة أسبوعين\.


    *للألم:*

    نيم 100 مجم \(نيميسوليد\)\- نيس

    بروفين 400 ملغ \(ايبوبروفين\) \- ايبوبروفين

    بانادول \- باراسيتامول

    بروفينيد جل \- فاستوم جل

    أرتريل \- جل مخدر لفرك الجلد في منطقة المفصل

    Tylohot \- ثيرافلو


    *للبطن:*

    بوسكوبان \- مضاد للتشنج لمغص البطن \(نوشبا\)

    ريفلور \- للإسهال طويل الأمد \(على سبيل المثال، عند تناول المضادات الحيوية\)

    لينكس \- هناك أيضا

    Enterosgel \(Enterosgel\) \- مادة ماصة على شكل مواد هلامية

    أوكابون \- الفحم المحلي

    أوميبرازول \- أوميبرازول


    *للإمساك:*

    دوفالاك \(دوفالاك\)


    *الغثيان:*

    ميتباميد \(نوع موتيليوم\)


    *الحساسية:*

    إيريوس \(إيريوس\)

    سيترين \(سيترين\)

    فينيستيل جل \- لحساسية الجلد والعضات ضد الحكة


    *الهربس:*

    زوفيراكس \(كريم نفس الموجود في روسيا\)

    بيبانثين \- بيبانتن \(الحروق والشقوق\)


    *العيون:*

    VİSINE \(Vizin\) \- من دون وصفة طبية، للحكة، وجفاف العيون


    *الآذان:*

    أوتيباكس \- نقط مع الليدوكائين تخفف الألم وتخفف الالتهاب بدون وصفة طبية'
