- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️الكهرباء*


    💰 في حالة قطع الاتصال، يتم إرجاع العربون الذي تم دفعه عند الاتصال مطروحًا منه الرصيد الذي تم دفعه


    🌎 *تعطيل الاتصال بالإنترنت*

    \- تسجيل الدخول إلى Edevlet

    \- انتقل إلى صفحة [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- أو اكتب في البحث `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu`

    \- انقر على *"تطبيق جديد" \(Yeni Başvuru\)*، ثم اختر حسابًا واملأ بياناتك

    \- قم بتعبئة رقم IBAN الذي سيتم تحويل الأموال إليه

    ⚠️ *لا يمكنك قطع الاتصال بالإنترنت إلا إذا كنت متصلاً بـ Ikamet*


    📍 *قم بإيقاف تشغيل الكهرباء في [المكتب الرئيسي لشركة CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *خذ معك:*

    1\. *رقم المشترك* \(سيتم العثور عليه بشكل أسرع في النظام\)

    2\. *جواز السفر* أو *الإقامات*

    3\. *رقم الحساب المصرفي الدولي* الذي سيتم تحويل الأموال إليه


    ℹ️خلال 24 ساعة ستنقطع الكهرباء عن الشقة\.

    ℹ️ سيتم إضافة الأموال إلى الحساب التركي فقط بعد قطع الاتصال، خلال 7\-30 يومًا\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧ماء*


    💰 في حالة قطع الاتصال، يتم إرجاع العربون الذي تم دفعه عند الاتصال مطروحًا منه الرصيد الذي تم دفعه


    🌎 *تعطيل الاتصال بالإنترنت*

    \- تسجيل الدخول إلى Edevlet

    \- انتقل إلى صفحة [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- أو اكتب في البحث `ASAT Abonelik Sözleşme Feshi Başvurusu`

    \- انقر على *"تطبيق جديد" \(Yeni Başvuru\)*، ثم اختر حسابًا واملأ بياناتك

    \- قم بتعبئة رقم IBAN الذي سيتم تحويل الأموال إليه

    ⚠️ *لا يمكنك قطع الاتصال بالإنترنت إلا إذا كنت متصلاً بـ Ikamet*


    📍 *تحويل المياه دون اتصال في [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *خذ معك:*

    1\. *رقم المشترك* \(سيتم العثور عليه بشكل أسرع في النظام\)

    2\. *جواز السفر* أو *الإقامات*

    3\. *رقم الحساب المصرفي الدولي* الذي سيتم تحويل الأموال إليه


    ℹ️ خلال 3 أيام عمل ستختفي المياه في الشقة\.

    ℹ️ سيتم إضافة الأموال إلى الحساب التركي فقط بعد قطع الاتصال، خلال 7\-30 يومًا\.'
