version: "1.0"

screens:
  - id: "TRANSPORT"
    text: "*🚌 Транспорт*"
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "bus"
              text: "🚌 Автобус"
              type: "callback"
              callback: "BUS_BUTTON"
        - buttons:
            - id: "antalya_card"
              text: "💳 Antalya Kart"
              type: "callback"
              callback: "ANTALYA_CARD_BUTTON"
        - buttons:
            - id: "taxi"
              text: "🚕 Такси"
              type: "callback"
              callback: "TAXI_BUTTON"
        - buttons:
            - id: "kick_scooter"
              text: "🛴 Самокаты"
              type: "callback"
              callback: "KICK_SCOOTER_BUTTON"
        - buttons:
            - id: "info_useful"
              text: "⭐️ Полезная информация"
              type: "callback"
              callback: "INFO_USEFUL_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "BUS_BUTTON"
        target: "BUS"
      - callback: "ANTALYA_CARD_BUTTON"
        target: "ANTALYA_CARD"
      - callback: "TAXI_BUTTON"
        target: "TAXI"
      - callback: "KICK_SCOOTER_BUTTON"
        target: "KICK_SCOOTER"
      - callback: "INFO_USEFUL_BUTTON"
        target: "INFO_USEFUL"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "BUS"
    text: |
      *🚌 Автобусы*
      
      Номера автобусов от EKPA:
      
      🚌 *KC06* \- в центр города
      🚌 *KC07* \- в ТЦ
      🚌 *KC08* \- в аэропорт
      
      💰 Стоимость: 15 TL
      
      📱 Расписание в приложении Antalya Kart
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "bus_concessionary"
              text: "🎫 Льготы"
              type: "callback"
              callback: "BUS_CONCESSIONARY_BUTTON"
        - buttons:
            - id: "transport"
              text: "🚌 Транспорт"
              type: "callback"
              callback: "TRANSPORT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "BUS_CONCESSIONARY_BUTTON"
        target: "BUS_CONCESSIONARY"
      - callback: "TRANSPORT_BUTTON"
        target: "TRANSPORT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "BUS_CONCESSIONARY"
    text: |
      *🎫 Льготы на проезд*
      
      Льготный проезд для:
      \- Студентов
      \- Пенсионеров
      \- Инвалидов
      
      📋 Оформление через офис UKOME
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "bus"
              text: "🚌 Автобус"
              type: "callback"
              callback: "BUS_BUTTON"
        - buttons:
            - id: "transport"
              text: "🚌 Транспорт"
              type: "callback"
              callback: "TRANSPORT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "BUS_BUTTON"
        target: "BUS"
      - callback: "TRANSPORT_BUTTON"
        target: "TRANSPORT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "ANTALYA_CARD"
    text: |
      *💳 Antalya Kart*
      
      Транспортная карта для оплаты проезда
      
      🏪 Где купить:
      \- Киоски
      \- Магазины
      \- Автостанции
      
      💰 Стоимость карты: 20 TL
      
      📱 Приложения:
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "antalya_card_android"
              text: "🤖 Android"
              type: "url"
              url: "https://play.google.com/store/apps/details?id=com.antalyakart"
        - buttons:
            - id: "antalya_card_iphone"
              text: "🍎 iPhone"
              type: "url"
              url: "https://apps.apple.com/app/antalya-kart/id123456"
        - buttons:
            - id: "transport"
              text: "🚌 Транспорт"
              type: "callback"
              callback: "TRANSPORT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "TRANSPORT_BUTTON"
        target: "TRANSPORT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "TAXI"
    text: |
      *🚕 Такси*
      
      📱 Приложения для вызова:
      \- BiTaksi
      \- Uber
      \- Martı Taksi
      
      💰 Примерная стоимость:
      До аэропорта: ~200 TL
      До центра: ~100 TL
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "transport"
              text: "🚌 Транспорт"
              type: "callback"
              callback: "TRANSPORT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "TRANSPORT_BUTTON"
        target: "TRANSPORT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "KICK_SCOOTER"
    text: |
      *🛴 Электросамокаты*
      
      Доступные сервисы:
      \- Martı
      \- Hop
      \- Palm
      
      💰 Стоимость: от 10 TL за поездку
      
      📱 Скачайте приложение и зарегистрируйтесь
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "transport"
              text: "🚌 Транспорт"
              type: "callback"
              callback: "TRANSPORT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "TRANSPORT_BUTTON"
        target: "TRANSPORT"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"
