- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Strom*


    💰 Wenn Sie die Verbindung trennen, wird die bei der Verbindung gezahlte Anzahlung abzüglich des zu zahlenden Restbetrags
    zurückerstattet


    🌎 *Online deaktivieren*

    \- Melden Sie sich bei Edevlet an

    \- Gehen Sie zur Seite [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- Oder geben Sie als Suchbegriff `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu` ein.

    \- Klicken Sie auf *"Neue Bewerbung" \(Yeni Başvuru\)*, wählen Sie ein Konto aus und geben Sie Ihre Daten ein

    \- Geben Sie die IBAN ein, an die das Geld überwiesen werden soll

    ⚠️ *Sie können die Verbindung online nur trennen, wenn Sie mit Ikamet verbunden sind*


    📍 *Schalten Sie den Strom offline am [Hauptsitz von CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)* ab


    💼 *Mitnehmen:*

    1\. *Teilnehmernummer* \(wird schneller im System gefunden\)

    2\. *Reisepass* oder *Ikamet*

    3\. *IBAN*, auf die das Geld überwiesen wird


    ℹ️ Innerhalb von 24 Stunden wird die Wohnung Strom verlieren.

    ℹ️ Das Geld wird dem türkischen Konto erst nach der Trennung innerhalb von 7–30 Tagen gutgeschrieben.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Wasser*


    💰 Wenn Sie die Verbindung trennen, wird die bei der Verbindung gezahlte Anzahlung abzüglich des zu zahlenden Restbetrags
    zurückerstattet


    🌎 *Online deaktivieren*

    \- Melden Sie sich bei Edevlet an

    \- Gehen Sie zur Seite [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- Oder geben Sie „Suche“ `ASAT Abonelik Sözleşme Feshi Başvurusu` ein.

    \- Klicken Sie auf *"Neue Bewerbung" \(Yeni Başvuru\)*, wählen Sie ein Konto aus und geben Sie Ihre Daten ein

    \- Geben Sie die IBAN ein, an die das Geld überwiesen werden soll

    ⚠️ *Sie können die Verbindung online nur trennen, wenn Sie mit Ikamet verbunden sind*


    📍 *Offline-Wasser in [ASAT] umwandeln(https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Mitnehmen:*

    1\. *Teilnehmernummer* \(wird schneller im System gefunden\)

    2\. *Reisepass* oder *Ikamet*

    3\. *IBAN*, auf die das Geld überwiesen wird


    ℹ️ Innerhalb von 3 Werktagen wird das Wasser in der Wohnung verschwinden.

    ℹ️ Das Geld wird dem türkischen Konto erst nach der Trennung innerhalb von 7–30 Tagen gutgeschrieben.'
