version: "1.0"

screens:
  - id: "DELIVERY"
    text:  "*🛵📦 Онлайн доставка*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "food_delivery"
              text: "🍔 Еда"
              type: "callback"
              callback: "FOOD_DELIVERY_BUTTON"
        - buttons:
            - id: "products_delivery"
              text: "🍎 Продукты"
              type: "callback"
              callback: "PRODUCTS_DELIVERY_BUTTON"
        - buttons:
            - id: "goods_delivery"
              text: "📦 Товары"
              type: "callback"
              callback: "GOODS_DELIVERY_BUTTON"
    navigation:
      - callback: "FOOD_DELIVERY_BUTTON"
        target: "FOOD_DELIVERY"
      - callback: "PRODUCTS_DELIVERY_BUTTON"
        target: "PRODUCTS_DELIVERY"
      - callback: "GOODS_DELIVERY_BUTTON"
        target: "GOODS_DELIVERY"

  - id: "FOOD_DELIVERY"
    text: |
      *Доставка Еды*
      
      ❗️Используйте встроенный в chrome переводчик
      💵 \- возможна оплата наличкой
      🪪 \- только с внж
      
      🍔 [Yemeksepeti](https://www.yemeksepeti.com/) 💵
      🍔 [TiklaGelsin](https://www.tiklagelsin.com)
      🍔 [Getir](https://getir.com/)
      🍕 [Dominos](https://www.dominos.com.tr) 💵
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "PRODUCTS_DELIVERY"
    text: |
      *Доставка Продуктов*
      
      ❗️ Используйте встроенный в chrome переводчик
      💵 Возможна оплата наличкой
      
      🍌 [Migros](https://www.migros.com.tr)
      🍌 [Tahtakale](https://tahtakalespot.com)
      🍌 [Carrefour](https://www.carrefoursa.com)
      🧻 [Sok](https://www.sokmarket.com.tr)
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "GOODS_DELIVERY"
    text: |
      *Доставка Товаров*
      
