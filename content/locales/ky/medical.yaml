- id: HOSPITALS
  text: '*🏥Ооруканалар\- Hastane*


    🛡️ *Камсыздандыруу боюнча*


    1️⃣️ Камсыздандырууга кайрылуу үчүн алгач ал кайсы ооруканалар менен иштээрин билип алышыңыз керек

    2️⃣ Камсыздандыруу көбүнчө дарылоонун бардык суммасын камтыбайт, бирок бул сиздин полисиңизге жана камсыздандыруу компаниясына
    жараша болот\.


    ⁉️ *Сиздин камсыздандырууңуз кайсы ооруканалар менен иштээрин кантип билсе болот:*

    1\. [imecedestek] веб-сайтына кириңиз (https://imecedestek.com/ContractedOrganizations)

    2\. Камсыздандыруу компаниясынын аталышын жана камсыздандыруунун түрүн көрсөтүңүз

    3\. Келишимдүү уюмдарды көргүңүз келген аймакты тандаңыз

    4\. Мекеменин түрүн тандаңыз

    5\. *Ара / Издөө* баскычын басыңыз


    ⭐️ Ушундай жол менен сиз камсыздандыруусу бар ооруканалардын жана башка медициналык мекемелердин тизмесин аласыз\.


    ❤️‍🩹 *Камсыздандыруусуз*


    \- Сиз камсыздандыруу тизмесинен эмес, ооруканаларга жана жеке клиникаларга барсаңыз болот\.

    \- Бул учурда сиздин камсыздандырууңуз да дарылоонун бир аз бөлүгүн камтышы мүмкүн\. \(Бул тууралуу анын сыпаттамасынан
    жана камсыздандыруу шарттарынан окуңуз\)

    \- Эгерде сизде камсыздандыруу жок болсо, анда өтө чоң сумманы даярдоого даяр болуңуз\.


    📍 *Hastane*\ түрк сөзүн колдонуп картадан ооруканаларды издеңиз\.'
  button_texts:
    hospitals_insurance_site: 🌎 {{button_hospital_search}}
- id: POLYCLINIC
  text: '*🧑‍⚕️ бекер дары*


    💫 Түркияда сиз *негизги медициналык жардамды бекер ала аласыз*

    \- Ал үчүн жашоого уруксат алгандан кийин үй-бүлөлүк дарыгерге дайындалыш керек\.


    🆓️ *Эмне берет:*

    \- Үй-бүлөлүк дарыгериңизден жалпы текшерүүдөн өтсөңүз болот

    \- Негизги тесттерден өтүңүз

    \- Дары-дармектерге рецепт алыңыз

    \- Өзүңүзгө жана балдарыңызга эмдөө алыңыз

    \- Ооруканаларда адистерден сунуштарды алуу

    \- Бардык анализдердин жана экспертизалардын тарыхы e\-Nabız\ тиркемесинде көрсөтүлөт\.

    \- Жана бардык ооруканалардан, анын ичинде жеке ооруканалардан\.


    💼 *Сизге эмне керек:*

    \- Турк телефон номери

    \- д\-Девлет \(почта бөлүмүндө жасалган\)

    \- Сиздин дарегиңиз боюнча каттоо


    🌎 *Кантип тиркелет:*

    1\. [enabiz вебсайтында] катталуу(https://enabiz.gov.tr/)

    2\. Функцияны тандоо *Үй-бүлөлүк дарыгериңизди алмаштыруу*

    3\. Шаарды, районду танда

    4\. Жеткиликтүү үй-бүлөлүк клиникалардын жана адистердин тизмеси ачылат\.

    \- Кызыл менен белгиленген дарыгерди тандоо мүмкүн эмес

    \- Жашыл түс менен белгиленген дарыгерлер көбүрөөк эркин

    \- Врач алмашуусу 5тен 21ге чейин ошол эле куну болот\. 22-ден 4-ке чейин арыздар 5\ каралат\.


    ⚡️*Кошумча:*

    \- [MHRS веб-сайтында] (https://www.mhrs.gov.tr/) каттоодон өтүңүз \(дарыгерге жазылуу үчүн веб-сайт\)


    ⭐ Эми сиз e\-Nabız\ веб-сайты жана тиркемеси аркылуу *Дарыгерге жазыла аласыз / Кабыл алуу / Randevu*'
