  text: '*🧑‍⚕️ Аптеки \- Eczane*


    ℹ️ Звичайні аптеки не працюють у неділю


    📍 Багато аптек розташовані по дорозі до лікарні:

    📍 [Кепез Девлет Хастанесі](https://goo.gl/maps/b5cnrK2H4apXkqWw9)


