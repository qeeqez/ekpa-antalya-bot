version: "1.0"

commands:
  - command: "/start"
    description: "Главное меню"
    screen_id: "MAIN_MENU"
    is_pinned: true
    locales:
      en:
        description: "Main menu"
      tr:
        description: "Ana menü"
      ar:
        description: "القائمة الرئيسية"
  - command: "/menu"
    description: "Главное меню"
    screen_id: "MAIN_MENU"
    locales:
      en:
        description: "Main menu"
      tr:
        description: "Ana menü"
      ar:
        description: "القائمة الرئيسية"
  - command: "/botlink"
    description: "Ссылка на Бота"
    screen_id: "BOT_LINK"
