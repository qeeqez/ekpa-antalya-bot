- id: BUS
  text: "*\U0001F68EКоомдук транспорт*\n\n \U0001F4CD Маршрут *Google Карталарда* эң жакшы пландаштырылган\n \U0001F9ED Автобустардын\
    \ учурдагы жайгашкан жерин *AntalyaKart* тиркемесинде көрүүгө болот\n\n \U0001F4B5 *Тариф*\n AntalyaKart \\- 9\\.6 TL\n\
    \ Банк картасы \\- 9\\,85 TL\n\n \U0001FA99️ *Трансфер баасы*\n AntalyaKart \\- 3 TL\n Банк картасы \\- 9\\,85 TL\n\n\
    \ ℹ️ *6 жашка чейинки балдар бекер*\n ⚠️ *Транспортто накталай төлөмгө тыюу салынат*"
  button_texts:
    bus_concessionary: 🎫 {{button_benefits}}
- id: BUS_CONCESSIONARY
  text: '🧒👴 *Артыкчылыктуу саякат*


    ℹ️ Арзандатылган саякат үчүн сиз арзандатуу картасын жасашыңыз керек


    💵 *Тариф*

    Студенттер жана мектеп окуучулары \- 4 TL

    Карылар, Майыптар, Мугалимдер \- 8\,4 TL


    🪙️ *Трансфер баасы \- 3 TL*


    ⁉️️ *Арзандатуу картасын кантип алса болот?*

    \- Балдарга, кары-картаңдарга жана майыптарга, мугалимдерге берилет

    \- Сүрөт менен жекелештирилген карта

    \- Балага мектептен окуучу деген справка керек

    \- АнталияКарттын негизги филиалдарында гана жасалышы мүмкүн

    \- [Эң жакынкы филиал бул жерде](https://goo.gl/maps/UHUeQU8AqJ9D4DSy6), жер астындагы өтмөктө'
- id: ANTALYA_CARD
  text: "*\U0001F4B3 Antalya Kart*\n\n ℹ️ Бул карта менен жол кире арзаныраак\n ℹ️ Эки адамга төлөй аласыз, биринчи төлөмдөн\
    \ кийин күтүшүңүз керек\n\n \U0001F4CD *Кайдан сатып алса болот?*\n \\- Жакынкы жерде [Сойлу базарында](https://goo.gl/maps/XLS1rGdPT9dvaziG9)\n\
    \ \\- *Antalya Kart* тиркемесинде *Эң жакын чекит* бөлүмүндө сатуу пункттары кызыл менен белгиленген\n\n \U0001FA99 *Кантип\
    \ толуктоо керек?*\n \\- Сатып алган жерден накталай акча менен толуктасаңыз болот\n \\- Antalya Kart тиркемесинде түрк\
    \ банк картасы менен онлайн толуктоо\n\n ⁉️ *Мен картаны толтурдум, бирок акча көрүнгөн жок*\n \\- Автобустун терминалында\
    \ толуктоо кызыл баскычын басыңыз\n \\- 5 секунд кармап туруңуз\n\n \U0001F68C *Тиркемеде маршруттарды кантип көрүүгө\
    \ болот?*\n \\- Google Карталардан ылайыктуу маршрутту табыңыз\n \\- Antalya Kart тиркемесинде издөөгө маршруттун номерин\
    \ киргизиңиз\n \\- Бүт маршрут жана боз автобустар азыр бара жаткан жерлерде көрсөтүлөт\n \\- Желек \\-\\> маршруттун\
    \ аягы, Үч бурчтук \\-\\> башталышы\n \\- Маршруттун багытын жашыл баскычты басуу менен өзгөртүүгө болот"
  button_texts:
    antalya_card_android: 🤖 {{button_android}}
    antalya_card_iphone: 📱 {{button_iphone}}
- id: TAXI
  text: '*🚖 Такси*


    ℹ️ Антальяда такси чакыруу кнопкалары илинип турат, унаа түн бир оокумда да келет


    🤙 *Чалсаңыз болот:*

    1\. Кирүү алдында баскыч

    2\. BiTaxi тиркемеси

    3\. Uber колдонмосу


    💵 *Баасы: Конуу 10TL \+ 14TL/км*


    🪙 *Төлөм*

    \- Күзгүдөгү эсептегич боюнча

    \- Тиркемелердеги нарк ошол эле эсептегичтин жардамы менен эсептелет

    \- Сиз накталай лира менен же карта менен төлөй аласыз \(баардык таксилерде эмес\)

    \- Тиркемеде шилтемеленген карта менен төлөөгө болот'
