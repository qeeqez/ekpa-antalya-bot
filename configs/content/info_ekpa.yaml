  - id: "HOW_TO_CONNECT_DASK"
    text: |
      *🛡️ Страховка от землетрясений Dask*
      
      ℹ️ *Информация:*
      \- Требуется для открытия счета на воду и электричество\.
      \- Перед походом в Asat или CK Akdeniz Elektrik у вас *уже должен быть Dask*\.
      \- В Банке Dask сделать нельзя\.
      \- Сделать можно в любой страховой или в Nkolay по ссылке ниже\.
      
      💼 *Взять с собой:*
      1\. Тапу или договор аренды
      2\. Паспорт или Икамет
      3\. Турецкий налоговый номер \(Достаточно самого номера\)
      4\. Полный адрес / Сказать Ekpa
      
      📍 *Оформить Dask в [Nkolay](https://goo.gl/maps/nyumU39FQYJTnFZt9)*
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "HOW_TO_CONNECT_ELECTRICITY"
    text: |
      *⚡️Электричество*
      
      💼 *Взять с собой:*
      1\. *Тапу* или *договор аренды*
      2\. *Паспорт* или *Икамет*
      3\. Турецкий *налоговый номер* \(Достаточно самого номера\)
      4\. Страховку от землетрясения *Dask*
      5\. *Деньги* для залога \(Возвращаются при отключении\)
      
      📍 *Подключить можно только в [головном офисе CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*
      
      🧑‍💼*Сообщить в УК:*
      Блок и номер квартиры, а так же абонентский номер на электричество\.
      
      ℹ️ В течении 1 рабочего дня в квартире появится свет\.
      ℹ️ При проблемах с электричеством \- сообщите в УК\.
      
      ⚠️ Щиток на электричество находится в шкафу\.
      ⚠️ Электрический счетчик находится в подвале за закрытой дверью\.
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "HOW_TO_CONNECT_WATER"
    text: |
      *💧 Вода*
      
      💼 *Взять с собой:*
      1\. *Тапу* или *договор аренды*
      2\. *Паспорт* или *Икамет*
      3\. Турецкий *налоговый номер* \(Достаточно самого номера\)
      4\. Страховку от землетрясения *Dask*
      5\. *Деньги* для залога \(Возвращаются при отключении\)
      
      📍 *Подключить воду в [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*
      
      🧑‍💼*Сообщить в УК:*
      Блок и номер квартиры, а так же абонентский номер на воду\.
      
      ℹ️ В течении 3 рабочих дней в квартире появится вода\.
      ℹ️ При проблемах с водой или напором в кранах \- сообщите в УК\.
      
      ⚠️ В квартире есть вентиль для перекрытия воды\.
      \- В 1\+1 ищите под раковиной\.
      \- В 2\+1 находится в душе\.
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "HOW_TO_CONNECT_INTERNET"
    text: |
      *🌎 Интернет*
      
      ℹ️ *Для подключения Интернета вам нужен ВНЖ \(ikamet\)*
      
      ℹ️ *Домашний интернет в Турции по контракту*
      \- Контракт заключается на год или два года
      \- При досрочном расторжении контракта выплачивается неустойка
      \- Оплата при этом производится помесячно
      
      🌐 *Операторы интернета*
      \- [Turk Telekom](https://turktelekom.com.tr/)
      \- [Turkcell Superonline](https://www.superonline.net/)
      \- [Turksat Kablo](https://www.fiberkablonet.com/)
      
      ℹ️ Для подключения нужно обратиться с икаметом в офис оператора\. Цена как на сайте оператора\.
      ⚠️ В офисе могут не найти наш адрес в системе, рекомендуем обращаться в ближайшие к комплексу офисы\.
      
      🏴‍☠️ *Подключение без ВНЖ*
      \- Для подключения без ВНЖ вам нужно найти человека, который оформит интернет на себя\.
      \- Обычно это дороже, многие "помогаторы" берут деньги за такую услугу\.
      \- Помогатора можно найти через своего риэлтора или через офисы операторов интернета\.
      
      ⚡️ *Альтернативные способы*
      \- Раздавать интернет с телефона
      \- Обратиться к соседям за помощью, поделиться вайфаем
    parse_mode: "MarkdownV2"
    disable_web_preview: true

