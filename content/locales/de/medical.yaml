- id: AMBULANCE
  text: '*🚑 Krankenwagen*


    ☎️ `112`


    ℹ️ *Rufen Sie nur als letzten Ausweg einen Krankenwagen\.*

    In der Türkei kann das Rufen eines Krankenwagens einen hübschen Cent kosten\.

    Wenn Sie einen Krankenwagen rufen, beispielsweise auf Englisch, müssen Sie zu einer englischsprachigen Telefonzentrale
    wechseln\.


    😷️ *Hotline für Ausländer*


    ☎️ `+90 850 288 38 38`


    ℹ️ *In der Hotline werden alle Sprachen gesprochen*

    Sie helfen bei allen medizinischen Fragen, auch beim Rufen eines Krankenwagens\.'
- id: PHARMACIES
  text: '*🧑‍⚕️ Apotheken \- Eczane*


    ℹ️ Reguläre Apotheken sind sonntags geschlossen


    📍Viele Apotheken liegen an der Straße zum Krankenhaus:

    📍 [Kepez Devlet Hastanesi](https://goo.gl/maps/b5cnrK2H4apXkqWw9)


    *🏥 Apotheken im Dienst \- Nöbetçi Eczaneler*


    \- Sie arbeiten rund um die Uhr

    \- Jeden Tag sind sie anders

    \- Aktuelle können auf der Website oder in der Anwendung eingesehen werden'
