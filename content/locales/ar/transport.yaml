- id: BUS
  text: "*\U0001F68Eالمواصلات العامة*\n\n \U0001F4CD من الأفضل تخطيط المسار في *خرائط Google*\n \U0001F9ED يمكن الاطلاع على\
    \ الموقع الحالي للحافلات في تطبيق *AntalyaKart*\n\n \U0001F4B5 *الأجرة*\n أنطاليا كارت \\- 9\\.6 ليرة تركية\n البطاقة\
    \ المصرفية \\- 9\\.85 ليرة تركية\n\n \U0001FA99️ *تكلفة النقل*\n أنطاليا كارت \\- 3 ليرة تركية\n البطاقة المصرفية \\-\
    \ 9\\.85 ليرة تركية\n\n ℹ️ *الأطفال أقل من 6 سنوات مجاناً*\n ⚠️ *يمنع الدفع نقدًا في وسائل النقل*"
  button_texts:
    bus_concessionary: 🎫 الفوائد
- id: BUS_CONCESSIONARY
  text: '🧒👴 *السفر التفضيلي*


    ℹ️ بالنسبة للسفر بسعر مخفض، يجب عليك إنشاء بطاقة خصم


    💵 *الأجرة*

    الطلاب وأطفال المدارس \- 4 ليرة تركية

    كبار السن والمعاقين والمعلمين \- 8\.4 ليرة تركية


    🪙️ *تكلفة النقل \- 3 ليرة تركية*


    ⁉️ *كيف تحصل على بطاقة الخصم؟*

    \- يصدر للأطفال وكبار السن والمعاقين والمعلمين

    \- بطاقة شخصية تحمل صورة

    \- يحتاج الطفل إلى شهادة من المدرسة تفيد أنه طالب

    \- يمكن القيام بذلك فقط في فروع أنطاليا كارت الرئيسية

    \- [أقرب فرع هنا](https://goo.gl/maps/UHUeQU8AqJ9D4DSy6)، في الممر تحت الأرض'
- id: ANTALYA_CARD
  text: "*\U0001F4B3أنطاليا كارت*\n\n ℹ️ الأجرة أرخص مع هذه البطاقة\n ℹ️ يمكنك الدفع لشخصين، عليك الانتظار بعد الدفعة الأولى\n\
    \n \U0001F4CD *أين أشتري؟*\n \\- في أقرب [سوق صويلو](https://goo.gl/maps/XLS1rGdPT9dvaziG9)\n \\- في تطبيق *Antalya Kart*،\
    \ في قسم *أقرب نقطة*، نقاط البيع محددة باللون الأحمر\n\n \U0001FA99 *كيفية التعبئة؟*\n \\- يمكنك تعبئة رصيدك نقداً في\
    \ نفس المكان الذي اشتريت منه\n \\- قم بالتعبئة عبر الإنترنت باستخدام بطاقة بنكية تركية في تطبيق Antalya Kart\n\n ⁉️ *لقد\
    \ قمت بتعبئة البطاقة ولكن لم يظهر المبلغ*\n \\- في محطة الحافلة، اضغط على زر تعبئة الرصيد الأحمر\n \\- استمر لمدة 5 ثواني\n\
    \n \U0001F68C *كيفية عرض المسارات في التطبيق؟*\n \\- ابحث عن الطريق المناسب في خرائط جوجل\n \\- في تطبيق أنطاليا كارت،\
    \ أدخل رقم الطريق في البحث\n \\- سيتم عرض المسار بالكامل والحافلات الرمادية في الأماكن التي يسافرون بها حاليًا\n \\- العلم\
    \ \\-\\> نهاية المسار، المثلث \\-\\> البداية\n \\- يمكن تغيير اتجاه المسار بالضغط على الزر الأخضر"
  button_texts:
    antalya_card_android: 🤖Android
    antalya_card_iphone: 📱 ايفون
- id: TAXI
  text: '*🚖تاكسي*


    ℹ️ أزرار استدعاء سيارة الأجرة معلقة في جميع أنحاء أنطاليا، وتصل السيارة حتى في وقت متأخر من الليل


    🤙 *يمكنك الاتصال:*

    1\. زر قبل الدخول

    2\. تطبيق بي تاكسي

    3\. تطبيق اوبر


    💵 *التكلفة: هبوط 10 ليرة تركية \+ 14 ليرة تركية/كم*


    🪙 *الدفع*

    \- حسب العداد الموجود في المرآة

    \- يتم حساب التكلفة في التطبيقات باستخدام نفس العداد

    \- بإمكانك الدفع نقداً بالليرة أو بالبطاقة \(ليس في جميع سيارات الأجرة\)

    \- في التطبيق من الممكن الدفع ببطاقة مرتبطة'
- id: KICK_SCOOTER
  text: '*🛴سكوترات*


    ℹ️ *خدمات تأجير السكوتر في أنطاليا:*

    \- *BinBin* \(قم بالقيادة بالقرب من مجمعنا\)

    \- *مارتي*

    \- *قفز*

    \- *شعاع*

    \- *قفز*

    \- *جيز*

    \- *تورنت*


    ℹ️ خدمة تأجير الدراجات *أنتبيس* تعمل على طول الساحل'
