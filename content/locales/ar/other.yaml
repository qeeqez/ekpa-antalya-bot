version: '1.0'
screens:
- id: CAR_FINE
  text: "*\U0001F697غرامة السيارة التي تحمل لوحات أجنبية*\n\n ℹ️ *التحقق من الغرامات*\n \\- انتقل إلى [موقع الضرائب](https://ivd.gib.gov.tr/)\n\
    \ \\- اختر الزر الأيمن السفلي\n \\- *Yabancı Plakalı Araç Ödemeleri \\(مدفوعات المركبات الأجنبية\\)*\n \\- أدخل رقم السيارة\n\
    \n \U0001F4B3 *الدفع عبر الإنترنت*\n \\- يمكنك القيام بذلك هناك، بعد التحقق من الغرامة\n \\- لا يمكن الدفع إلا عن طريق\
    \ بطاقة الائتمان التركية\n \\- عند اختيار الدفع عن طريق مكتب الضرائب، إذا قمت بالتحويل إلى علامة التبويب الثانية \\(علامة\
    \ التبويب الثانية\\)\n \\- سيكون من الممكن الدفع عن طريق Ziraat أو Vakif Pay\n\n \U0001FA99 *الدفع نقداً*\n \\- في مكتب\
    \ الضرائب [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)"
- id: PHONE_UNLOCK
  text: '*📲 فتح هاتفك*


    ℹ️ *يوجد قفلين مختلفين للهاتف في تركيا*

    1\. يتم حظر بطاقة SIM بعد 90 يومًا \(سائح\)

    2\. يتم حظر الهاتف نفسه بعد 120 يومًا \(بعد إدخال أي بطاقة SIM تركية\)'
  button_texts:
    phone_unlock_sim: 📱 فتح شريحة SIM (سياحية)
    phone_unlock_imei: 📱 فتح هاتفك (IMEI)
- id: PHONE_UNLOCK_SIM
  text: '*📱 فتح شريحة الاتصال \(السياحية\)*


    ℹ️ *ما نوع الحجب؟*

    \- إذا تم إصدار بطاقة SIM الخاصة بك لجواز سفر، وليس إقامة \(تصريح إقامة\)

    \- إذن هو موقع سياحي وسيتم حجبه خلال 90 يوما


    🆓 *كيفية الفتح*

    \- في تطبيق مشغل الاتصالات، أدخل ikamet الخاص بك \(إذا كان لديك واحد، فإن الرقم نفسه يكفي، لذلك سيعمل الرقم الورقي أيضًا\)

    \- إذا لم يكن هناك ikamet، فلن يكون من الممكن ربطه بشخص آخر


    ⚡️ *طرق بديلة*

    \- كحل مؤقت، يمكنك شراء بطاقة SIM صادرة باسم أحد السكان المحليين القريبين من المجمع

    \- إعادة تسجيل شريحة الاتصال لشخص لديه تصريح إقامة'
- id: PHONE_UNLOCK_IMEI
  text: '*📱 فتح هاتفك \(IMEI\)*


    ℹ️ *ما نوع الحجب؟*

    \- بعد مرور 120 يوماً من لحظة إدخال بطاقة SIM التركية في الهاتف الذي تم إحضاره، يتم حظرها\.

    \- محظور فقط في تركيا \(يستمر العمل بشكل كامل في بلدان أخرى\)

    \- ليس الهاتف نفسه هو الذي تم حظره، بل رقم IMEI، أي\. فتحة بطاقة SIM محددة\.

    \- لن تعمل بطاقات SIM أو المكالمات أو الرسائل القصيرة\. يقول الهاتف "لا توجد شبكة" و"الهاتف غير مسموح به"\.

    \- يستمر الهاتف نفسه في العمل، بما في ذلك شبكة WiFi والمكالمات عبر برامج المراسلة الفورية عبر الإنترنت\.'
  button_texts:
    phone_unlock_imei_free: 🆓 خيار مجاني
    phone_unlock_imei_paid: 💰 خيار مدفوع (30000 ليرة تركية)
    phone_unlock_imei_reblock: 🤯 إذا تم حظر الهاتف مرة أخرى
- id: PHONE_UNLOCK_IMEI_FREE
  text: '🆓 *فتح قفل الهاتف مجانًا*

    \- أدخل بطاقة SIM في الفتحة الثانية، إذا كانت متوفرة \(في بعض الهواتف، يمكنك إجراء ESIM\)

    \- من الآن فصاعدا، سيتم العد التنازلي لـ 120 يوما

    \- بعد انتهاء الموعد النهائي، سيتم أيضًا حظر الفتحة الثانية


    ❗️ فتح مجاني لمدة عام من خلال Edevlet لم يعد يعمل، لقد كان عرضًا مؤقتًا على شرف فيروس كوفيد


    ⚡️ *الخيار البديل*

    \- شراء هاتف رخيص الثمن وتوزيع الواي فاي منه

    \- شراء مودم 4G والتوزيع منه ولكن بعد ذلك مستحيل استقبال المكالمات'
- id: PHONE_UNLOCK_IMEI_PAID
  text: "*\U0001F4B0 فتح الهاتف الرسمي المدفوع*\n\nℹ️ 1 يمكن للشخص تسجيل هاتف واحد كل 3 سنوات\\.\n*المطلوب:* يجب أن يكون هذا\
    \ الشخص قد وصل من الخارج في موعد لا يتجاوز 365 يومًا\n\n\U0001F4B0 *السعر عام 2024 : 30000 ليرة تركية \U0001F92F*\n\n\U0001F9E7\
    \ *عملية التسجيل:*\n\\- قم بتسجيل الدخول إلى Edevlet باستخدام رقم ikamet وكلمة المرور المستلمة عبر البريد\n\\- انتقل إلى\
    \ صفحة [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet) \\(أو ابحث عن `IMEI Kaydet`\\)\n\\- املأ بياناتك \\(جميع\
    \ IMEI الموجود في الهاتف وجواز السفر وتاريخ دخول الدولة\\)\n\\- الدفع\n\n\U0001FA99 *الدفع نقدا*\n\\- يمكنك الدفع نقداً\
    \ في مكتب الضرائب\n\\- بعد الدفع، يجب عليك تقديم طلب لفتح القفل بنفسك عبر Edevlet على صفحة [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet)\n\
    \n\U0001F4B5 *الدفع عبر الإنترنت*\n\\- الدفع ممكن فقط بالبطاقة التركية\\. الائتمان فقط، لا يقبل الخصم\n\\- يمكنك اختيار\
    \ الدفع عن طريق مكتب الضرائب \\(Vergi Dairesi\\)\n     \\- بدلاً من إدخال البطاقة، قم بالتبديل إلى علامة التبويب الثانية\n\
    \     \\- سيكون من الممكن الدفع عن طريق ZiraatPay و VakifPay، لقد فعلت ذلك من خلال zirat\n\n⛔️ *السلبيات*\n\\- يجب عليك\
    \ استخدام بطاقة SIM مسجلة في نفس Ikamet\n\\- هذه القاعدة صالحة لمدة 3 سنوات، وبعدها يمكنك استخدام أي شريحة اتصال"
- id: PHONE_UNLOCK_IMEI_REBLOCK
  text: "\U0001F92F *إذا تم حظر الهاتف مرة أخرى*\n\nℹ️ يجب أن يكون الهاتف وبطاقة SIM الموجودة به مسجلين في نفس Ikamet\n\n\
    ✅ *إذا كان كل شيء على ما يرام*\n\U0001F4F2 اتصل بخدمة BTK على الرقم 120 للتوضيح \\(يوجد اختيار للمشغل باللغة الإنجليزية\\\
    )\n\n\U0001F6A8 *غير ذلك*\n\\- انقل بطاقة SIM الخاصة بك إلى Ikamet آخر من المشغل الخاص بك\n    \\- تم فقدان الباقة المدفوعة\
    \ الحالية\n    \\- قد لا يكون النقل نفسه مجانياً\n\\- فتح بطاقة SIM جديدة"
