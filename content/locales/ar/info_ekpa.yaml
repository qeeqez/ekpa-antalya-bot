- id: HOW_TO_CONNECT_DASK
  text: '*🛡️تأمين داسك ضد الزلازل*


    ℹ️ *معلومات:*

    \- يشترط فتح حساب للماء والكهرباء\.

    \- قبل الذهاب إلى Asat أو CK Akdeniz Elektrik *يجب أن يكون لديك Dask*\.

    \- لا يمكنك فعل ذلك في داسك بانك\.

    \- يمكنك القيام بذلك لدى أي شركة تأمين أو لدى نكولاي باستخدام الرابط أدناه\.


    💼 *خذ معك:*

    1\. الطابو أو عقد الإيجار

    2\. جواز السفر أو الإقامة

    3\. الرقم الضريبي التركي \(الرقم نفسه يكفي\)

    4\. العنوان الكامل / تل إيكبا


    📍 *اطلب داسك في [نكولاي](https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️الكهرباء*


    💼 *خذ معك:*

    1\. *الطابو* أو *عقد الإيجار*

    2\. *جواز السفر* أو *الإقامات*

    3\. تركي *الرقم الضريبي* \(الرقم نفسه يكفي\)

    4\. التأمين ضد الزلازل *Dask*

    5\. *المال* للإيداع \(يتم إرجاعه عند انقطاع الاتصال\)


    📍 *يمكنك الاتصال فقط في [المكتب الرئيسي لشركة CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    🧑‍💼*بلاغ إلى القانون الجنائي:*

    رقم المبنى والشقة وكذلك رقم المشترك في الكهرباء\.


    ℹ️ سيظهر الضوء في الشقة خلال يوم عمل واحد\.

    ℹ️ في حالة وجود مشاكل بالكهرباء\- إبلاغ قانون العقوبات\.


    ⚠️ اللوحة الكهربائية موجودة في الخزانة\.

    ⚠️ عداد الكهرباء موجود في القبو خلف باب مغلق\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧ماء*


    💼 *خذ معك:*

    1\. *الطابو* أو *عقد الإيجار*

    2\. *جواز السفر* أو *الإقامات*

    3\. تركي *الرقم الضريبي* \(الرقم نفسه يكفي\)

    4\. التأمين ضد الزلازل *Dask*

    5\. *المال* للإيداع \(يتم إرجاعه عند انقطاع الاتصال\)


    📍 *توصيل المياه إلى [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*بلاغ إلى القانون الجنائي:*

    رقم المبنى والشقة وكذلك رقم المشترك بالمياه\.


    ℹ️ خلال 3 أيام عمل ستظهر المياه في الشقة\.

    ℹ️ إذا كان لديك مشاكل في الماء أو الضغط في الصنابير\- أبلغ قانون العقوبات\.


    ⚠️الشقة يوجد بها صمام لقطع المياه\.

    \- عند 1\+1، انظر تحت الحوض\.

    \- في 2\+1 هو في الروح\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎الإنترنت*


    ℹ️ *للاتصال بالإنترنت تحتاج إلى تصريح إقامة \(ikamet\)*


    ℹ️ *الإنترنت المنزلي في تركيا بموجب عقد*

    \- العقد لمدة سنة أو سنتين

    \- في حالة الإنهاء المبكر للعقد يتم دفع غرامة

    \- يتم الدفع شهرياً


    🌐 *مشغلي الإنترنت*

    \- [ترك تيليكوم](https://turktelekom.com.tr/)

    \- [توركسيل سوبرونلاين](https://www.superonline.net/)

    \- [تركسات كابلو](https://www.fiberkablonet.com/)


    ℹ️ للتواصل يجب عليك الاتصال بمكتب المشغل مع ikamet\. السعر هو نفسه الموجود على موقع المشغل\.

    ⚠️ قد لا يجد المكتب عنواننا في النظام، ننصح بالتواصل مع المكاتب الأقرب للمجمع\.


    🏴‍☠️ *تواصل بدون تصريح إقامة*

    \- للاتصال بدون تصريح إقامة، عليك العثور على شخص يقوم بترتيب الإنترنت لنفسه\.

    \- عادة ما يكون هذا أكثر تكلفة، حيث يتقاضى العديد من "المساعدين" أموالاً مقابل هذه الخدمة\.

    \- يمكن العثور على مساعد من خلال سمسار عقاراتك أو من خلال مكاتب مشغلي الإنترنت\.


    ⚡️ *طرق بديلة*

    \- مشاركة الإنترنت من هاتفك

    \- اطلب المساعدة من جيرانك، وشارك شبكة Wi\-Fi'
