- id: AMBULANCE
  text: '*🚑 Ambulans*


    ☎️ `112`


    ℹ️ *Wezwij karetkę tylko w ostateczności\.*

    W Turcji wezwanie karetki może kosztować całkiem grosza.

    Dzwoniąc po karetkę, mów po angielsku, musisz przełączyć się na angielskiego operatora\.


    😷️ *Infolinia dla obcokrajowców*


    ☎️ `+90 850 288 38 38`


    ℹ️ *Na infolinii mówi się wszystkimi językami*

    Pomagają we wszystkich kwestiach medycznych, łącznie z wezwaniem karetki.'
- id: PHARMACIES
  text: '*🧑‍⚕️ Apteki \- Eczane*


    ℹ️ W niedzielę zwykłe apteki są nieczynne


    📍Wiele aptek znajduje się przy drodze do szpitala:

    📍 [Kepez Devlet Hastanesi](https://goo.gl/maps/b5cnrK2H4apXkqWw9)


    *🏥 Apteki dyżurne \- Nöbetçi Eczaneler*


    \- Pracują przez całą dobę

    \- Każdego dnia są inni

    \- Aktualne można obejrzeć na stronie internetowej lub w aplikacji'
  button_texts:
    pharmacies_site: 🌎 {{button_pharmacies_site}}
    pharmacies_android: 🤖 {{button_android}}
