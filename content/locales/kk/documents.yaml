- id: EDEVLET
  text: '*🧧Едевлет*


    ℹ️ Мемлекеттік қызметтердің алуан түрі бар веб-сайт:

    \- Сертификаттар мен анықтамаларды алу

    \- Тегін дәрі

    \- Телефон құлпын ашыңыз

    \- Тағы да


    🌎 [Сайт сілтемесі](https://www.turkiye.gov.tr)


    ⚡️ *Қалай қосылуға болады*

    \- Тұруға рұқсат алу \(икамет\)

    \- Түрік телефон нөмірі бар

    \- Поштада \(ПТТ\) ЕДевлет деңіз

    \- 20 лираға рейске пароль жасайды, смс арқылы келеді


    📍 [Ең жақын пошта бөлімшесі](https://goo.gl/maps/sCWvbXQSn5nhR1U48) \(2\,6 км\)'
  button_texts:
    edevlet_site: 🌐 Веб-сайт
    edevlet_android: 🤖Android
    edevlet_iphone: 📱 iPhone
- id: TAX_NUMBER
  text: '*🪪ТИН \(Түрік салық нөмірі\)*


    ℹ️ *Бұл не үшін?*

    \- Dask және утилиталарды өзіңіз үшін тіркеу

    \- тұруға рұқсат

    \- Банк шотын ашу


    🌎 *Желіге қосылу*

    \- [салық веб-сайтына] (https://ivd.gib.gov.tr/) өтіңіз

    \- Орталық төменгі түймені таңдаңыз

    \- *Yabancılar İçin Potansiyel Vergi Kimlik Numarası*

    \- *АЗАМАТТЫҚ ЕМЕС ӘЛЕУМЕТТІК САЛЫҚ НӨМІРІНЕ ӨТІНІШ*

    \- Мәліметтеріңізді толтырыңыз


    💸 *Оны салық басқармасынан алыңыз*

    \- Кейде онлайн жүйе қате жазады және салық басқармасына бару керек

    \- Салық кеңсесі [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)'
- id: ADDRESS_NUMARATAJ
  text: '*🔖 Нумаратаж \(Нумаратай\)*


    ℹ️ *Адресті растайтын анықтама*

    \- Тіркелу үшін қажет

    \- Тұруға рұқсат алу үшін қажет


    💼 *Өзіңізбен бірге алыңыз:*

    1\. Паспорт

    2\. Тапу

    3\. Жалдау шарты

    4\. Осы құжаттардың көшірмелері


    ℹ️ *Қабылдау нұсқаулары:*

    1\. [Kepez Belediye](https://goo.gl/maps/Fb68nczEehmjzf4K9) бөлімінде құжаттардың көшірмелерін жасаңыз

    2\. 2-қабатқа шығып, Нумаратаж белгілерін орындаңыз және D блогының дәлізіне кіріңіз

    3\. Билет алыңыз, олар сізге қоңырау шалады

    4\. Адамға құжаттардың барлық көшірмелерін беріңіз

    5\. Бірінші қабатқа бір-бірден түсіңіз, құжаттарыңызды терезеден беріңіз, олар сізге мөр басады

    6\. Екінші қабатқа оралсақ, Нұмаратаж сертификатын береді

    ⚠️ Араларыңызда бірнеше адам болса, осы куәлікке тіркелуі тиіс барлық адамдардың төлқұжаттарының көшірмелерін беріңіз\.


    📍 Барлығы [Кепез Беледие](https://goo.gl/maps/Fb68nczEehmjzf4K9) \(3\,5 км\) орындалған\.

    ⚡️ Бірінші қабатта 1 тг-ға құжаттардың көшірмелерін жасауға болады'
- id: ADDRESS_REGISTRATION
  text: '*📌 Тіркелу*


    ℹ️ *Тіркелу тұруға рұқсат алғаннан кейін 20 күн ішінде жасалуы керек*

    \- Балаларды өзіңізбен бірге алып жүрудің қажеті жоқ, барлығына ересек болғаны жөн

    \- Тіркеусіз тұруға рұқсат ұзартылмайды


    ℹ️ Шетелдіктер үшін онлайн тіркелу енді мүмкін емес

    ℹ️ Шетелдіктер Nufus компаниясына тіркелуге міндетті емес, бірақ ерекше жағдайларда олар сізді сонда тіркеуі мүмкін


    📌 *Goc сайтында тіркелу*


    💼 *Өзіңізбен бірге алыңыз:*

    1\. Икамет \(тұруға рұқсат\)

    2\. Тапу немесе жалдау шарты

    3\. Нумаратаж \(Нумаратай\)

    4\. Тапу/Шарт пен Нумаратаждың фотокөшірмелері

    5\. Сіздің атыңызға су немесе электр қуатының түбіртегі


    ⚡️ *Маңызды:*

    \- Түбіртек жаңа болуы керек, әйтпесе олар бас тартады

    \- Олар пәтер иесінің қымтығы мен тапасының көшірмесін сұрай алады


    📍 *Ол жерге қалай жетуге болады:*

    \- [Goc Idaresi]-ге келіңіз(https://goo.gl/maps/Q46vs5Dj9ipu32cS9)

    \- Кіре берісте *Адрес* деп икамет көрсетіңіз, кіргізеді

    \- Ғимаратта *Адрес* деп айтыңыз, кездесу үшін терезенің сол жағындағы бөлмеге қоңырауды күтіңіз\.'
