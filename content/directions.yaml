version: '1.0'
screens:
- id: DIRECTIONS
  parse_mode: MarkdownV2
  inline_keyboard:
    rows:
    - buttons:
      - id: markets
        type: callback
        callback: MARKETS_BUTTON
      - id: shops
        type: callback
        callback: SHOPS_BUTTON
      - id: shopping_centers
        type: callback
        callback: SHOPPING_CENTERS_BUTTON
    - buttons:
      - id: print_photo
        type: callback
        callback: PRINT_AND_PHOTO_BUTTON
    - buttons:
      - id: barber
        type: callback
        callback: BARBER_BUTTON
    - buttons:
      - id: residence_fitness_spa
        type: callback
        callback: RESIDENCE_FITNESS_SPA_BUTTON
    - buttons:
      - id: tax_office
        type: callback
        callback: TAX_OFFICE_BUTTON
      - id: post_office
        type: callback
        callback: POST_OFFICE_BUTTON
    - buttons:
      - id: city_hall
        type: callback
        callback: CITY_HALL_BUTTON
      - id: population_office
        type: callback
        callback: POPULATION_OFFICE_BUTTON
      - id: migration_office
        type: callback
        callback: MIGRATION_OFFICE_BUTTON
  navigation:
  - callback: MARKETS_BUTTON
    target: MARKETS
  - callback: SHOPS_BUTTON
    target: SHOPS
  - callback: SHOPPING_CENTERS_BUTTON
    target: SHOPPING_CENTERS
  - callback: PRINT_AND_PHOTO_BUTTON
    target: PRINT_AND_PHOTO
  - callback: BARBER_BUTTON
    target: BARBER
  - callback: RESIDENCE_FITNESS_SPA_BUTTON
    target: RESIDENCE_FITNESS_SPA
  - callback: TAX_OFFICE_BUTTON
    target: TAX_OFFICE
  - callback: POST_OFFICE_BUTTON
    target: POST_OFFICE
  - callback: CITY_HALL_BUTTON
    target: CITY_HALL
  - callback: POPULATION_OFFICE_BUTTON
    target: POPULATION_OFFICE
  - callback: MIGRATION_OFFICE_BUTTON
    target: MIGRATION_OFFICE
- id: MARKETS
  parse_mode: MarkdownV2
  disable_web_preview: true
  inline_keyboard:
    rows:
    - buttons:
      - id: all_markets
        type: callback
        callback: ALL_MARKETS_BUTTON
  navigation:
  - callback: ALL_MARKETS_BUTTON
    target: ALL_MARKETS
- id: ALL_MARKETS
  parse_mode: MarkdownV2
  disable_web_preview: true
  inline_keyboard:
    rows:
    - buttons:
      - id: markets
        type: callback
        callback: MARKETS_BUTTON
  navigation:
  - callback: MARKETS_BUTTON
    target: MARKETS
- id: SHOPS
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: SHOPPING_CENTERS
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: PRINT_AND_PHOTO
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: BARBER
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: TAX_OFFICE
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: POST_OFFICE
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: CITY_HALL
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: POPULATION_OFFICE
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: MIGRATION_OFFICE
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: RESIDENCE_FITNESS_SPA
