screens:
- id: CAR_FINE
  text: "*\U0001F697 Штраф на Автомобиль на Иностранных номерах*\n\n ℹ️ *Проверить штрафы*\n \\- Зайти на [сайт налоговой](https://ivd.gib.gov.tr/)\n\
    \ \\- Выбрать правую нижнюю кнопку\n \\- *Yabancı Plakalı Araç Ödemeleri \\(Foreign Vehicle Payments\\)*\n \\- Ввести\
    \ номер авто\n\n \U0001F4B3 *Оплатить онлайн*\n \\- Можно там же, после проверки штрафа\n \\- Оплатить можно только Турецкой\
    \ Кредитной картой\n \\- При выборе оплаты через налоговую, если переключиться на вторую вкладку \\(второй таб\\)\n \\\
    - Появится возможность оплатить через Ziraat или Vakif Pay\n\n \U0001FA99 *Оплатить наличными*\n \\- В отделении налоговой\
    \ [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)\n"
- id: PHONE_UNLOCK
  text: '*📲 Разблокировка телефона*


    ℹ️  *Существует 2 разные блокировки телефона в Турции*

    1\. Блокируется СИМ карта через 90 дней \(туристическая\)

    2\. Блокируется сам телефон через 120 дней \(после момента как вставили любую Турецкую сим карту\)

    '
  button_texts:
    phone_unlock_sim: 📱 Разблокировка СИМ (Туристической)
    phone_unlock_imei: 📱 Разблокировка телефона (IMEI)
- id: PHONE_UNLOCK_SIM
  text: '*📱 Разблокировка СИМ \(Туристической\)*


    ℹ️ *Что за блокировка?*

    \- Если ваша Сим карта была оформлена на паспорт, а не икамет \(ВНЖ\)

    \- То она является туристической и будет заблокирована через 90 дней


    🆓 *Как разблокировать*

    \- В приложении оператора связи ввести свой икамет \(если он есть, достаточно самого номера, потому бумажный тоже подойдет\)

    \- Если икамета нет, то привязать на другого человека не получится


    ⚡️ *Альтернативные способы*

    \- Как временное решение, можно недалеко от комплекса купить Сим карту оформленную на местного

    \- Переоформить Сим на человека с ВНЖ

    '
- id: PHONE_UNLOCK_IMEI
  text: '*📱 Разблокировка телефона \(IMEI\)*


    ℹ️ *Что за блокировка?*

    \- Через 120 дней с момента, как в привезенный телефон была вставлена Турецкая сим карта, он блокируется\.

    \- Блокируется только на территории Турции \(в других странах продолжает полноценно работать\)

    \- Блокируется не сам телефон, а IMEI, т\.е\. конкретный слот сим карты\.

    \- Не будут работать никакие сим карты, звонки и смс\. Телефон пишет “Нет Сети” и “Phone not allowed”\.

    \- Сам телефон продолжает работу, в том числе WiFi и звонки в мессенджерах через интернет\.

    '
  button_texts:
    phone_unlock_imei_free: 🆓 Бесплатный вариант
    phone_unlock_imei_paid: 💰 Платный вариант (30000 TL)
    phone_unlock_imei_reblock: 🤯 Если телефон повторно заблокировали
- id: PHONE_UNLOCK_IMEI_FREE
  text: '🆓 *Бесплатная разблокировка телефона*

    \- Вставить симку во второй слот, если он есть \(на некоторых телефонах можно сделать ESIM\)

    \- С этого момента пойдет отсчет 120 дней

    \- По истечении срока второй слот тоже заблокируется


    ❗️ Бесплатная разблокировка на год через Edevlet больше не работает, это была временная акция в честь Covid


    ⚡️ *Альтернативный вариант*

    \- Купить дешевый телефон и с него раздавать WiFi

    \- Купить 4G Модем и с него раздавать, но тогда невозможно принимать звонки

    '
- id: PHONE_UNLOCK_IMEI_PAID
  text: "*\U0001F4B0 Оффициальная платная разблокировка телефона*\n\nℹ️ 1 Человек может зарегистрировать 1 телефон раз в 3\
    \ года\\.\n*Обязательно:* этот человек должен был приехать из\\-за границы не позже 365 дней назад\n\n\U0001F4B0 *Стоимость\
    \ в 2024: 30000 TL \U0001F92F*\n\n\U0001F9E7 *Процесс регистрации:*\n\\- Зайти в Edevlet по номеру ikamet и паролю, полученному\
    \ на почте\n\\- Перейти на страницу [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet) \\(или найти в поиске `IMEI\
    \ Kaydet`\\)\n\\- Заполнить свои данные \\(все IMEI в телефоне, свой паспорт и дату въезда в страну\\)\n\\- Оплатить\n\
    \n\U0001FA99 *Оплата наличными*\n\\- Оплатить можно наличными в налоговой\n\\- После оплаты нужно самому подать заявку\
    \ на разблокировку через Edevlet на странице [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet)\n\n\U0001F4B5 *Оплата\
    \ онлайн*\n\\- Оплата возможна только Турецкой картой\\. Только Кредитной, дебетовая не принимается\n\\- Можно выбрать\
    \ оплату через налоговую \\(Vergi Dairesi\\)\n     \\- Вместо ввода карты переключиться на вторую вкладку\n     \\- Будет\
    \ возможность оплатить ZiraatPay и VakifPay, у меня получилось через зират\n\n⛔️ *Минусы*\n\\- Сим карту обязательно использовать,\
    \ зарегистрированную на этот же Ikamet\n\\- Это правило действует 3 года, потом можно использовать любые сим карты\n"
- id: PHONE_UNLOCK_IMEI_REBLOCK
  text: "\U0001F92F *Если телефон повторно заблокировали*\n\nℹ️ Телефон и сим карта в нем должны быть зарегистрированы на\
    \ один и тот же Ikamet\n\n✅ *Если все хорошо*\n\U0001F4F2 Звонить в службу BTK по номеру 120 для уточнения \\(есть выбор\
    \ английского оператора\\)\n\n\U0001F6A8 *В ином случае*\n\\- Сделать перенос сим на другой Ikamet у своего оператора\n\
    \    \\- Теряется текущий оплаченный пакет\n    \\- Сам перенос может быть не бесплатен\n\\- Открыть новую сим карту\n"
