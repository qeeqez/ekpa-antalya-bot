name: Docker Publish

on:
  workflow_call:
    inputs:
      services:
        required: true
        type: string
        description: 'JSON array of services, e.g. ["bot"]'
    secrets:
      CONTAINER_REGISTRY_URL:
        required: true
      CONTAINER_REGISTRY_NAME:
        required: true
      CONTAINER_REGISTRY_SECRET:
        required: true

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        service: ${{ fromJson(inputs.services) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          pattern: service-build-${{ matrix.service }}-*
          path: .
          merge-multiple: true

      - name: 🛠️ Make service executables
        run: |
          chmod +x ./build/${{ matrix.service }}-amd64
          chmod +x ./build/${{ matrix.service }}-arm64

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: 🐳️ Login to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_URL }}
          username: nologin
          password: ${{ secrets.CONTAINER_REGISTRY_SECRET }}

      - name: 🏷️ Set Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.CONTAINER_REGISTRY_URL }}/${{ secrets.CONTAINER_REGISTRY_NAME }}/rixl-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: 🐳️ Build and Push Multi-Arch Image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}