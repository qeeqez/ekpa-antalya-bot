- id: MEDICINE
  text: '*💊 Түрік дәрілері*


    *Сутегі асқын тотығы:*

    Оксиженли Су


    *Тамақ ауруы:*

    Tantum Verde \- спрей

    Strepsils\- лолипоптар


    *Жөтел:*

    Ылғалды: ацетилцистеин 600 мг \- тәулігіне 1 рет таңертең \(гастрит \- тамақтан кейін немесе омепразолдан кейін\)

    Құрғақ: шөптен жасалған құрғақ жөтел сироптары көп \(мысалы, Фитоспан\)


    *Мұрыннан ағу:*

    Синусты шаюға арналған жинақ \- мұрынды теңіз суымен шаю \(Дельфин түрі\)

    Насовин \- вазоконстрикторлы спрей \(ксилометазолин\)

    Ризонел, 0,05% \- аллергиялық ринитке, қан тамырларын тарылтатын заттарды ұзақ уақыт қолданғанда\. Мұрындағы ісінуді кетіреді,
    \(Назонекс аналогы\) ағуын азайтады, 2 дозадан әр танау жолына күніне 2 рет 2 апта бойы, содан кейін 1 дозадан күніне
    2 рет 2 апта, содан кейін \. 1 доза күніне 1 рет 2 апта ішінде\.


    *Ауру үшін:*

    Нимес 100 мг \(Нимесулид\) \- нисе

    Бруфен 400 мг \(Ибупрофен\) \- ибупрофен

    Панадол \- парацетамол

    Профенид гелі \- Fastum гелі

    Artril \- буын аймағындағы теріге ысқылауға арналған анестетикалық гель

    Tylohot \- theraflu


    *Іш үшін:*

    Buscopan \- құрсақ коликіне қарсы спазмолитикалық \(noshpa\)

    Рефлор \- ұзақ мерзімді диареяға \(мысалы, антибиотиктерді қабылдағанда\)

    Linex \ \- сонда да

    Enterosgel \(Enterosgel\) \- гель түріндегі сорбент

    Эукабон – жергілікті көмір

    Омепразол \- омепразол


    *Іш қату үшін:*

    Дуфалак \(Дуфалак\)


    *Жүрек айнуы:*

    Метпамид \(Motilium түрі\)


    *Аллергия:*

    Аэриус \(Эриус\)

    Цетрин \(Цетрин\)

    Фенистил гелі \- тері аллергиясы мен қышымаға қарсы


    *Ұшық:*

    Zovirax \(крем, Ресейдегідей\)

    Бепантен \- Бепантен \(күйіп кетеді, жарылады\)


    *Көздер:*

    VİSİNE \(Vizin\) \- рецептсіз, қышынуға, құрғақ көзге


    *Құлақтар:*

    Otipax \- лидокаинмен тамшылатады, ауырсынуды басады, қабынуды азайтады, рецептсіз'
