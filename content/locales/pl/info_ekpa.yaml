- id: HOW_TO_PAY_AIDAT
  text: '*Aidat*


    ℹ️ Miesięczna opłata za utrzymanie kompleksu\.

    ⚠️ Musisz zapłacić, nawet jeśli nie mieszkasz w mieszkaniu\.


    *Koszt:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Blok Miesiąc


    ⚠️Pamiętaj o podaniu numerów bloku, mieszkania i miesiąca za który płacisz'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Klimatyzacja*


    ℹ️ Centralna klimatyzacja nie jest wliczona w rachunek za prąd\.

    ⚠️ Należy pamiętać, że Turcja jest gorącym krajem, a prąd jest tutaj drogi\.


    *Termin płatności:*

    ⏳ 7 dni od daty otrzymania faktury

    ⚠️ Jeśli płatność nie zostanie dokonana, zostanie wyłączona\. Na pilocie zdalnego sterowania pojawi się ikona kłódki oraz
    opcja Scentralizowane\.


    *Płatność:*

    🪙 Gotówką lub kartą w Biurze Spółki Zarządzającej


    💳 Przelew online z tureckiej karty bankowej na konto:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Nazwa odbiorcy i opis płatności*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Mieszkanie blokowe


    ⚠️Pamiętaj o wskazaniu numerów bloków i mieszkań, za które płacisz'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*prąd*


    ℹ️ Klimatyzacja nie jest wliczona w rachunek za prąd\.


    ℹ️ *Numer Abonenta* nadawany jest przy połączeniu, jest on także wskazany na karcie płatniczej\.


    *Termin płatności:*

    ℹ️ Faktura wystawiana jest na koniec miesiąca

    ⏳ Płatności należy dokonać w ciągu 10 dni od wystawienia faktury\.


    *Jak sprawdzić swój rachunek za prąd:*

    \- W tureckim banku internetowym podczas płatności

    \- Dowód wpłaty, który dociera pod wskazany adres, umieszczany jest w skrzynce na ścianie na pierwszym piętrze

    \- Online na stronie [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Płatność:*


    💳 *Online w tureckiej bankowości internetowej*

    1\. Fatura \(Płatność rachunków\) \-\> Elektrik \(Prąd elektryczny\) \-\> *CK Akdeniz Elektrik*

    2\. Wpisz swój *numer abonenta*

    3\. Zobaczysz kwotę i będziesz mógł zapłacić

    ⚠️ Jeżeli faktura nie została jeszcze wystawiona, aplikacja wyświetli błąd\.


    🪙 *Gotówka lub karta*

    \- W oddziale Turkcell z niewielką prowizją [Najbliżej 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Najbliżej 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Na poczcie PTT, [Najbliższa poczta](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- W dowolnym biurze CK Akdeniz Elektrik, [Najbliższe biuro](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Woda*


    ℹ️ *Numer Abonenta* nadawany jest przy połączeniu, jest on także wskazany na karcie płatniczej\.


    *Termin płatności:*

    ℹ️ Faktura wystawiana jest na koniec miesiąca

    ⏳ Płatności należy dokonać w ciągu 10 dni od wystawienia faktury\.


    *Jak sprawdzić swój rachunek za wodę:*

    \- W tureckim banku internetowym podczas płatności

    \- Dowód wpłaty, który dociera pod wskazany adres, umieszczany jest w skrzynce na ścianie na pierwszym piętrze

    \- Online na stronie [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Kliknij HIZLI ÖDEME


    *Płatność:*


    💳 *Online w tureckiej bankowości internetowej*

    1\. Fatura \(Płatność rachunków\) \-\> Su \(Woda\) \-\> *Antalya Su \(ASAT\)*

    2\. Wpisz swój *numer abonenta* \(Dodaj kilka zer po lewej stronie numeru\)

    3\. Zobaczysz kwotę i będziesz mógł zapłacić

    ⚠️ Jeżeli faktura nie została jeszcze wystawiona, aplikacja wyświetli błąd\.


    🪙 *Gotówka lub karta*

    \- W oddziale Turkcell z niewielką prowizją [Najbliżej 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Najbliżej 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Na poczcie PTT, [Najbliższa poczta](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- W [siedzibie głównej ASAT](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱 Telefon komórkowy i Internet 🌎*


    💳 *Online w aplikacji lub na stronie Twojego operatora*

    \- Dla swojego telefonu musisz wybrać pakiet na kolejny miesiąc

    \- Możesz po prostu doładować swoje saldo i później opłacić z niego pakiety

    \- Za Internet należy opłacić rachunek za poprzedni miesiąc


    🪙 *Gotówka lub karta*

    \- W oddziale Turkcell z niewielką prowizją [Najbliżej 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Najbliżej 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- W dowolnym biurze Twojego operatora telekomunikacyjnego'
