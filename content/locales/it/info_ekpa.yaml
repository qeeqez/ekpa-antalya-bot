- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Assicurazione Terremoto Dask*


    ℹ️ *Informazioni:*

    \- Necessario per aprire un conto per acqua ed elettricità\.

    \- Prima di andare ad Asat o CK Akdeniz Elektrik *dovresti già avere Dask*\.

    \- Non puoi farlo in Dask Bank\.

    \- Puoi farlo presso qualsiasi compagnia assicurativa o presso Nkolay utilizzando il link sottostante\.


    💼 *Porta con te:*

    1\. Tapu o contratto di locazione

    2\. Passaporto o Ikamet

    3\. Codice fiscale turco \(Il numero stesso è sufficiente\)

    4\. Indirizzo completo / Dillo a Ekpa


    📍 *Ordina Dask a [Nkolay](https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Elettricità*


    💼 *Porta con te:*

    1\. *Tapu* o *contratto di locazione*

    2\. *Passaporto* o *Ikamet*

    3\. Turco *codice fiscale* \(Il numero stesso è sufficiente\)

    4\. Assicurazione terremoto *Dask*

    5\. *Denaro* per il deposito \(Restituito dopo la disconnessione\)


    📍 *Puoi connetterti solo alla [sede centrale di CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    🧑‍💼*Rapporto al codice penale:*

    Numero dell''edificio e dell''appartamento, nonché numero dell''abbonato per l''elettricità\.


    ℹ️ La luce apparirà nell''appartamento entro 1 giorno lavorativo\.

    ℹ️ Se ci sono problemi con l''elettricità\- avvisare il Codice Penale\.


    ⚠️ Il quadro elettrico è nel ripostiglio\.

    ⚠️ Il contatore elettrico si trova nel seminterrato dietro una porta chiusa\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Acqua*


    💼 *Porta con te:*

    1\. *Tapu* o *contratto di locazione*

    2\. *Passaporto* o *Ikamet*

    3\. Turco *codice fiscale* \(Il numero stesso è sufficiente\)

    4\. Assicurazione terremoto *Dask*

    5\. *Denaro* per il deposito \(Restituito dopo la disconnessione\)


    📍 *Collega l''acqua a [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*Rapporto al codice penale:*

    Numero dell''edificio e dell''appartamento, nonché numero dell''abbonato per l''acqua\.


    ℹ️ Entro 3 giorni lavorativi apparirà acqua nell''appartamento\.

    ℹ️ Se hai problemi con l''acqua o la pressione nei rubinetti\- avvisa il Codice Penale\.


    ⚠️ L''appartamento è dotato di valvola per chiudere l''acqua\.

    \- A 1\+1 guarda sotto il lavandino\.

    \- Nel 2\+1 è nell''anima\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎Internet*


    ℹ️ *Per connettersi a Internet è necessario il permesso di soggiorno \(ikamet\)*


    ℹ️ *Internet domestico in Turchia sotto contratto*

    \- Il contratto dura uno o due anni

    \- In caso di risoluzione anticipata del contratto viene pagata una penale

    \- Il pagamento viene effettuato mensilmente


    🌐 *Operatori Internet*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Per connettersi è necessario contattare l''ufficio dell''operatore con un ikamet\. Il prezzo è lo stesso che sul sito
    dell''operatore\.

    ⚠️ L''ufficio potrebbe non trovare il nostro indirizzo nel sistema, consigliamo di contattare gli uffici più vicini al
    complesso\.


    🏴‍☠️ *Collegarsi senza permesso di soggiorno*

    \- Per connettersi senza permesso di soggiorno, è necessario trovare una persona che si occupi di Internet\.

    \- Questo di solito è più costoso, molti "aiutanti" richiedono denaro per tale servizio\.

    \- Puoi trovare un aiuto tramite il tuo agente immobiliare o tramite gli uffici degli operatori Internet\.


    ⚡️ *Metodi alternativi*

    \- Condividi Internet dal tuo telefono

    \- Chiedi aiuto ai tuoi vicini, condividi il Wi-Fi'
- id: HOW_TO_DISCONNECT
  text: '*⛔️Come disabilitarlo?*'
  button_texts:
    disconnect_electricity: ⚡️ Elettricità
    disconnect_water: 💧 Acqua
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Elettricità*


    💰 In caso di disconnessione viene restituito l''acconto versato al momento della connessione meno il saldo del pagamento


    🌎 *Disabilita online*

    \- Accedi a Edevlet

    \- Vai alla pagina [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- Oppure digita la ricerca `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu`

    \- Fai clic su *"Nuova applicazione" \(Yeni Başvuru\)*, seleziona un account e inserisci i tuoi dati

    \- Inserisci l''IBAN su cui verrà trasferito il denaro

    ⚠️ *Puoi disconnetterti online solo se sei connesso a Ikamet*


    📍 *Spegni l''elettricità offline presso [la sede centrale di CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *Porta con te:*

    1\. *Numero abbonato* \(verrà trovato più velocemente nel sistema\)

    2\. *Passaporto* o *Ikamet*

    3\. *IBAN* su cui verrà trasferito il denaro


    ℹ️ Entro 24 ore l''appartamento perderà elettricità\.

    ℹ️ Il denaro verrà accreditato sul conto turco solo dopo la disconnessione, entro 7\-30 giorni\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Acqua*


    💰 In caso di disconnessione viene restituito l''acconto versato al momento della connessione meno il saldo del pagamento


    🌎 *Disabilita online*

    \- Accedi a Edevlet

    \- Vai alla pagina [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- Oppure digita cerca `ASAT Abonelik Sözleşme Feshi Başvurusu`

    \- Fai clic su *"Nuova applicazione" \(Yeni Başvuru\)*, seleziona un account e inserisci i tuoi dati

    \- Inserisci l''IBAN su cui verrà trasferito il denaro

    ⚠️ *Puoi disconnetterti online solo se sei connesso a Ikamet*


    📍 *Disattiva l''acqua in [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Porta con te:*

    1\. *Numero abbonato* \(verrà trovato più velocemente nel sistema\)

    2\. *Passaporto* o *Ikamet*

    3\. *IBAN* su cui verrà trasferito il denaro


    ℹ️ Entro 3 giorni lavorativi l''acqua nell''appartamento scomparirà\.

    ℹ️ Il denaro verrà accreditato sul conto turco solo dopo la disconnessione, entro 7\-30 giorni\.'
