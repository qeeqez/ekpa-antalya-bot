- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Электр*


    💰 Эгер сиз ажыратсаңыз, туташуу учурунда төлөнгөн депозит, төлөм балансын алып салганда кайтарылат\.


    🌎 *Онлайнды өчүрүү*

    \- Edevletке кириңиз

    \- Баракка өтүңүз [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- Же издөөгө `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu` териңиз

    \- *"Жаңы колдонмону" басыңыз \(Yeni Başvuru\)*, аккаунтту тандап, чоо\-жайыңызды толтуруңуз

    \- Акча которула турган IBANды толтуруңуз

    ⚠️ *Икаметке туташкан болсоңуз гана онлайн өчүрө аласыз*


    📍 *[CK Akdeniz Elektrik башкы кеңсесинде](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)* электр энергиясын оффлайн режиминде
    өчүрүңүз


    💼 *Өзүңүз менен ала кетиңиз:*

    1\. *Абоненттин номери* \(ал системада тезирээк табылат\)

    2\. *Паспорт* же *Икамет*

    3\. Акча которула турган *IBAN*


    ℹ️ 24 сааттын ичинде батирде электр жарыгы өчөт\.

    ℹ️ Акча Түркиянын эсебине 7\-30 күндүн ичинде өчүрүлгөндөн кийин гана түшөт\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Суу*


    💰 Эгер сиз ажыратсаңыз, туташуу учурунда төлөнгөн депозит, төлөм балансын алып салганда кайтарылат\.


    🌎 *Онлайнды өчүрүү*

    \- Edevletке кириңиз

    \- [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu) баракчасына
    өтүңүз

    \- Же издөөгө `ASAT Abonelik Sözleşme Feshi Başvurusu` териңиз

    \- *"Жаңы колдонмону" басыңыз \(Yeni Başvuru\)*, аккаунтту тандап, чоо\-жайыңызды толтуруңуз

    \- Акча которула турган IBANды толтуруңуз

    ⚠️ *Икаметке туташкан болсоңуз гана онлайн өчүрө аласыз*


    📍 *Оффлайн сууну [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6) ичинде өчүрүңүз*


    💼 *Өзүңүз менен ала кетиңиз:*

    1\. *Абоненттин номери* \(ал системада тезирээк табылат\)

    2\. *Паспорт* же *Икамет*

    3\. Акча которула турган *IBAN*


    ℹ️ 3 жумушчу күндүн ичинде батирдеги суу жок болот\.

    ℹ️ Акча Түркиянын эсебине 7\-30 күндүн ичинде өчүрүлгөндөн кийин гана түшөт\.'
