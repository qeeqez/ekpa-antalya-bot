- id: HOW_TO_PAY_AIDAT
  text: '*Aidat*


    ℹ️ Cuota de mantenimiento mensual del complejo\.

    ⚠️ Debes pagar, incluso si no vives en un departamento\.


    *Costo:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Bloque Apartamento Mes


    ⚠️ Asegúrate de indicar los números del bloque, apartamento y mes por el que estás pagando'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Aire acondicionado*


    ℹ️ El sistema de aire acondicionado central no está incluido en la factura de luz\.

    ⚠️ Tenga en cuenta que Türkiye es un país cálido y la electricidad aquí es cara\.


    *Término de pago:*

    ⏳ 7 días desde la fecha de recepción de la factura

    ⚠️ Si no se realiza el pago, quedará deshabilitado\. Aparecerá un icono de candado y Centralizado\ en el control remoto\.


    *Pago:*

    🪙 Efectivo o tarjeta en la Oficina de la Sociedad Gestora


    💳 Transferencia en línea desde una tarjeta bancaria turca a la cuenta:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Nombre del destinatario y descripción del pago*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Apartamento en bloque


    ⚠️ Asegúrate de indicar el número de bloque y apartamento por el que estás pagando'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Electricidad*


    ℹ️ El aire acondicionado no está incluido en la factura de la luz\.


    ℹ️ *El número de suscriptor* se emite al momento de la conexión, también se indica en la tarjeta de pago\.


    *Término de pago:*

    ℹ️ La factura se emite a final de mes\.

    ⏳ El pago debe realizarse dentro de los 10 días posteriores a la emisión de la factura\.


    *Cómo saber tu factura de luz:*

    \- En el banco turco de Internet al pagar

    \- El comprobante de pago que llega a la dirección se coloca en una caja en la pared del primer piso\.

    \- En línea en el sitio web [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Pago:*


    💳 *En línea en la banca por Internet turca*

    1\. Fatura \(Pago de facturas\) \-\> Elektrik \(Electricidad\) \-\> *CK Akdeniz Elektrik*

    2\. Ingresa tu *número de suscriptor*

    3\. Verás el importe y podrás pagar\.

    ⚠️ Si aún no se ha emitido la factura, la aplicación mostrará un error\.


    🪙 *Efectivo o tarjeta*

    \- En la sucursal de Turkcell con una pequeña comisión [1 más cercano](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [2 más
    cercano](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- En la oficina de correos de PTT, [oficina de correos más cercana](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- En cualquier oficina de CK Akdeniz Elektrik, [oficina más cercana](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Agua*


    ℹ️ *El número de suscriptor* se emite al momento de la conexión, también se indica en la tarjeta de pago\.


    *Término de pago:*

    ℹ️ La factura se emite a final de mes\.

    ⏳ El pago debe realizarse dentro de los 10 días posteriores a la emisión de la factura\.


    *Cómo saber tu factura de agua:*

    \- En el banco turco de Internet al pagar

    \- El comprobante de pago que llega a la dirección se coloca en una caja en la pared del primer piso\.

    \- En línea en el sitio web [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Haga clic en HIZLI ÖDEME


    *Pago:*


    💳 *En línea en la banca por Internet turca*

    1\. Fatura \(Pago de facturas\) \-\> Su \(Agua\) \-\> *Antalya Su \(ASAT\)*

    2\. Ingrese su *número de suscriptor* \(Agregue algunos ceros a la izquierda del número\)

    3\. Verás el importe y podrás pagar\.

    ⚠️ Si aún no se ha emitido la factura, la aplicación mostrará un error\.


    🪙 *Efectivo o tarjeta*

    \- En la sucursal de Turkcell con una pequeña comisión [1 más cercano](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [2 más
    cercano](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- En la oficina de correos de PTT, [oficina de correos más cercana](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- En [Oficina central de ASAT](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱Teléfono móvil e Internet 🌎*


    💳 *En línea en la aplicación o en el sitio web de tu operador*

    \- Para tu teléfono necesitas seleccionar un paquete para el próximo mes

    \- Puedes simplemente recargar tu saldo y luego pagar los paquetes desde él

    \- Para Internet debes pagar la factura del mes anterior\.


    🪙 *Efectivo o tarjeta*

    \- En la sucursal de Turkcell con una pequeña comisión [1 más cercano](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [2 más
    cercano](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- En cualquier oficina de su operador de telecomunicaciones'
