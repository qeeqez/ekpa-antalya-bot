version: "1.0"

screens:
  - id: "INFO_EKPA"
    text: "*🏘 Инфо по EKPA*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "management_office"
              text: "🏢 Офис управления"
              type: "callback"
              callback: "MANAGEMENT_OFFICE_ALL_ABOUT_BUTTON"
        - buttons:
            - id: "how_to_pay"
              text: "💳 Как оплачивать"
              type: "callback"
              callback: "HOW_TO_PAY_BUTTON"
        - buttons:
            - id: "how_to_connect"
              text: "🔌 Как подключить"
              type: "callback"
              callback: "HOW_TO_CONNECT_BUTTON"
        - buttons:
            - id: "how_to_disconnect"
              text: "🔌 Как отключить"
              type: "callback"
              callback: "HOW_TO_DISCONNECT_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "MANAGEMENT_OFFICE_ALL_ABOUT_BUTTON"
        target: "MANAGEMENT_OFFICE_ALL"
      - callback: "HOW_TO_PAY_BUTTON"
        target: "HOW_TO_PAY"
