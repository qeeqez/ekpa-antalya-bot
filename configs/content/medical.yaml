      text: "*\U0001F9D1‍⚕️ Аптеки \\- Eczane*\n            \nℹ️ В воскресенье обычные аптеки не работают\n\n\U0001F4CD Множество аптек находится по дороге к больнице:\n\U0001F4CD [Kepez Devlet Hastanesi](https://goo\\.gl/maps/b5cnrK2H4apXkqWw9)\n            \n*\U0001F3E5 Дежурные аптеки \\- Nöbetçi Eczaneler*\n\n\\- Работают круглосуточно\n\\- Каждый день они разные\n\\- Актуальные можно посмотреть на сайте или в приложении\n"
      parse_mode: MarkdownV2
      inline_keyboard:
        rows:
            - buttons:
                - id: pharmacies_site
                  text: "\U0001F310 Сайт"
                  type: url
                  url: https://www.eczaneler.gen.tr
            - buttons:
