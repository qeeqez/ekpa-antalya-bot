- id: CITY_HALL
  text: '*🏛 Belediye \(Municipality\)*


    ℹ️ In this establishment you can get a certificate *Numarataj* \(Numarataj\), necessary for obtaining a residence permit

    ⚡️ On the ground floor you can make copies of documents for 1 TL


    📍 [Kepez Belediye](https://goo.gl/maps/5WBP63uMR5dCa1HcA) \(3\.5 km\)'
- id: POPULATION_OFFICE
  text: '*🧑‍💼 Nufus \(Ministry of Population Registration\)*


    ℹ️ In this institution, Tapa is issued, Turkish citizens are registered, newborns are registered and other population
    issues are resolved\.

    ⚠️ Foreigners must register with Goc, not Nufus\.


    📍 [Kepez Nufus](https://goo.gl/maps/1u4SiTYfYBVbRNFs8) \(3\.5 km\)'
- id: MIGRATION_OFFICE
  text: '*👮 Goc Idaresi \(Antalya Migration Department\)*


    1️⃣ Here you need to register\.

    2️⃣ Here the rendezvous \(application for a residence permit\) takes place and all issues related to the residence permit\
    are resolved.

    3️⃣ Those who have not done so yet may be called here for fingerprinting.


    📍 [Goc Idaresi](https://goo.gl/maps/Q46vs5Dj9ipu32cS9) \(8\.1 km\)'
