- id: CAR_FINE
  text: "*\U0001F697 Шетелдік нөмірлі көлікке айыппұл*\n\n ℹ️ *Айыппұлдарды тексеру*\n \\- [салық веб-сайтына] (https://ivd.gib.gov.tr/)\
    \ өтіңіз\n \\- Төменгі оң жақ түймені таңдаңыз\n \\- *Yabancı Plakalı Araç Ödemeleri \\(Шетелдік көлік төлемдері\\)*\n\
    \ \\- Көлік нөмірін енгізіңіз\n\n \U0001F4B3 *Онлайн төлеу*\n \\- Айыппұлды тексеріп болған соң сол жерде жасауға болады\n\
    \ \\- Төлемді тек түрік несие картасы арқылы жасауға болады\n \\- Салық қызметі арқылы төлемді таңдаған кезде, егер сіз\
    \ екінші қойындыға ауыссаңыз \\(екінші қойынды\\)\n \\- Ziraat немесе Vakif Pay арқылы төлеуге болады\n\n \U0001FA99 *Қолма-қол\
    \ ақшамен төлеу*\n \\- Салық кеңсесінде [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)"
- id: PHONE_UNLOCK
  text: '*📲 Телефон құлпын ашыңыз*


    ℹ️ *Түркияда 2 түрлі телефон құлпы бар*

    1\. SIM картасы 90 күннен кейін блокталады \(турист\)

    2\. Телефонның өзі 120 күннен кейін блокталады \(кез келген түрік SIM картасы салынғаннан кейін\)'
  button_texts:
    phone_unlock_sim: 📱 SIM картасының құлпын ашу (турист)
    phone_unlock_imei: 📱 Телефон құлпын ашыңыз (IMEI)
- id: PHONE_UNLOCK_SIM
  text: '*📱 \(Турист\) SIM құлпын ашыңыз*


    ℹ️ *Қандай блоктау?*

    \- Егер сіздің SIM картаңыз Икамет емес, төлқұжат үшін берілген болса \(тұруға ықтиярхат\)

    \- Сонда бұл туристік сайт және 90 күннен кейін бұғатталады


    🆓 *Құлыпты қалай ашуға болады*

    \- Байланыс операторының өтінішінде акаметіңізді енгізіңіз \(бар болса, нөмірдің өзі жеткілікті, сондықтан қағазы да жұмыс
    істейді\)

    \- Икамет болмаса, оны басқа адамға байлау мүмкін емес


    ⚡️ *Балама әдістер*

    \- Уақытша шешім ретінде кешеннің жанынан жергілікті адамның атына берілген SIM картасын сатып алуға болады

    \- Тұруға ықтиярхаты бар адам үшін SIM картасын қайта тіркеңіз'
- id: PHONE_UNLOCK_IMEI
  text: '*📱 Телефон құлпын ашыңыз \(IMEI\)*


    ℹ️ *Қандай блоктау?*

    \- Әкелінген телефонға түрік SIM картасы салынған сәттен бастап 120 күннен кейін ол блокталады\.

    \- Тек Түркияда бұғатталған \(басқа елдерде толығымен жұмысын жалғастыруда\)

    \- Бұғатталған телефонның өзі емес, IMEI, яғни\. арнайы SIM картасының ұясы\.

    \- Ешқандай SIM карталары, қоңыраулар немесе SMS жұмыс істемейді\. Телефонда «Желі жоқ» және «Телефонға рұқсат жоқ»\ дейді\.

    \- Телефонның өзі жұмысын жалғастыруда, соның ішінде WiFi және интернет арқылы мессенджерлердегі қоңыраулар\.'
  button_texts:
    phone_unlock_imei_free: 🆓 Тегін опция
    phone_unlock_imei_paid: 💰 Ақылы опция (30000 TL)
    phone_unlock_imei_reblock: 🤯 Телефон қайтадан бұғатталған болса
- id: PHONE_UNLOCK_IMEI_FREE
  text: '🆓 *Телефон құлпын тегін ашу*

    \- SIM картасын екінші ұяға салыңыз, бар болса \(кейбір телефондарда ESIM жасай аласыз\)

    \- Бұдан былай 120 күн кері саналады

    \- Мерзім аяқталғаннан кейін екінші ұяшық та бұғатталады


    ❗️ Edevlet арқылы бір жыл бойы құлыпты тегін ашу бұдан былай жұмыс істемейді, бұл Ковид құрметіне арналған уақытша акция
    болды\.


    ⚡️ *Балама нұсқа*

    \- Арзан телефон сатып алып, одан WiFi таратыңыз

    \- 4G модемін сатып алып, одан таратыңыз, бірақ содан кейін қоңырауларды қабылдау мүмкін емес'
- id: PHONE_UNLOCK_IMEI_PAID
  text: "*\U0001F4B0 Ресми ақылы телефон құлпын ашу*\n\nℹ️ 1 адам 3 жыл сайын 1 телефонды тіркей алады\\.\n*Міндетті:* бұл\
    \ адам 365 күннен кешіктірмей шетелден келген болуы керек\n\n\U0001F4B0 *2024 жылғы бағасы: 30000 TL \U0001F92F*\n\n\U0001F9E7\
    \ *Тіркелу процесі:*\n\\- Пошта арқылы алынған ikamet нөмірі мен құпия сөзді пайдаланып Edevlet жүйесіне кіріңіз\n\\-\
    \ [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet) бетіне өтіңіз \\(немесе `IMEI Kaydet`\\ деп іздеңіз)\n\\-\
    \ Мәліметтеріңізді толтырыңыз \\(телефондағы барлық IMEI, төлқұжатыңыз және елге кіру күні\\)\n\\- Төлеу\n\n\U0001FA99\
    \ *Төлем қолма-қол ақшамен*\n\\- Салық кеңсесінде қолма-қол төлеуге болады\n\\- Төлегеннен кейін [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet)\
    \ бетіндегі Edevlet арқылы құлпын ашуға өтініш беруіңіз керек\\.\n\n\U0001F4B5 *Онлайн төлем*\n\\- Төлем тек түрік картасымен\
    \ мүмкін\\. Тек несие, дебет қабылданбайды\n\\- Салық кеңсесі арқылы төлеуді таңдай аласыз \\(Vergi Dairesi\\)\n     \\\
    - Картаны енгізудің орнына екінші қойындыға ауысыңыз\n     \\- ZiraatPay және VakifPay арқылы төлеуге болады, мен оны\
    \ zirat арқылы жасадым\\.\n\n⛔️ *Жағымсыз жақтары*\n\\- Сол Ikamet-те тіркелген SIM картасын пайдалану керек\n\\- Бұл\
    \ ереже 3 жыл бойы жарамды, содан кейін кез келген SIM карталарын пайдалануға болады"
- id: PHONE_UNLOCK_IMEI_REBLOCK
  text: "\U0001F92F *Телефон қайтадан бұғатталған болса*\n\nℹ️ Телефон мен ондағы сим карта сол Икаметке тіркелген болуы керек\n\
    \n✅ *Егер бәрі жақсы болса*\n\U0001F4F2 Түсіндіру үшін BTK қызметіне 120 нөміріне қоңырау шалыңыз \\(ағылшын операторының\
    \ таңдауы бар\\)\n\n\U0001F6A8 *Әйтпесе*\n\\- SIM картасын операторыңыздан басқа Икаметке ауыстырыңыз\n    \\- Ағымдағы\
    \ ақылы пакет жоғалды\n    \\- Тасымалдаудың өзі тегін болмауы мүмкін\n\\- Жаңа SIM картасын ашыңыз"
