version: '1.0'
screens:
- id: CAR_FINE
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: PHONE_UNLOCK
  parse_mode: MarkdownV2
  inline_keyboard:
    rows:
    - buttons:
      - id: phone_unlock_sim
        type: callback
        callback: PHONE_UNLOCK_SIM_BUTTON
    - buttons:
      - id: phone_unlock_imei
        type: callback
        callback: PHONE_UNLOCK_IMEI_BUTTON
  navigation:
  - callback: PHONE_UNLOCK_SIM_BUTTON
    target: PHONE_UNLOCK_SIM
  - callback: PHONE_UNLOCK_IMEI_BUTTON
    target: PHONE_UNLOCK_IMEI
- id: PHONE_UNLOCK_SIM
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: PHONE_UNLOCK_IMEI
  parse_mode: MarkdownV2
  disable_web_preview: true
  inline_keyboard:
    rows:
    - buttons:
      - id: phone_unlock_imei_free
        type: callback
        callback: PHONE_UNLOCK_IMEI_FREE_BUTTON
    - buttons:
      - id: phone_unlock_imei_paid
        type: callback
        callback: PHONE_UNLOCK_IMEI_PAID_BUTTON
    - buttons:
      - id: phone_unlock_imei_reblock
        type: callback
        callback: PHONE_UNLOCK_IMEI_REBLOCK_BUTTON
  navigation:
  - callback: PHONE_UNLOCK_IMEI_FREE_BUTTON
    target: PHONE_UNLOCK_IMEI_FREE
  - callback: PHONE_UNLOCK_IMEI_PAID_BUTTON
    target: PHONE_UNLOCK_IMEI_PAID
  - callback: PHONE_UNLOCK_IMEI_REBLOCK_BUTTON
    target: PHONE_UNLOCK_IMEI_REBLOCK
- id: PHONE_UNLOCK_IMEI_FREE
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: PHONE_UNLOCK_IMEI_PAID
  parse_mode: MarkdownV2
  disable_web_preview: true
- id: PHONE_UNLOCK_IMEI_REBLOCK
  parse_mode: MarkdownV2
  disable_web_preview: true
