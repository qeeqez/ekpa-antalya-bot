version: "1.0"

screens:
  - id: "IMPORTANT_DOCUMENTS"
    text: "*📄 Важные документы*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "check_application_status"
              text: "🔍 Проверить статус заявления"
              type: "callback"
              callback: "CHECK_APPLICATION_STATUS_BUTTON"
        - buttons:
            - id: "get_id_number"
              text: "🆔 Получить ID номер"
              type: "callback"
              callback: "GET_ID_NUMBER_BUTTON"
        - buttons:
            - id: "tax_number"
              text: "💼 Налоговый номер"
              type: "callback"
              callback: "TAX_NUMBER_BUTTON"
            - id: "edevlet"
              text: "🏛 E-Devlet"
              type: "callback"
              callback: "EDEVLET_BUTTON"
        - buttons:
            - id: "address_numarataj"
              text: "🏠 Адрес (Numarataj)"
              type: "callback"
              callback: "ADDRESS_NUMARATAJ_BUTTON"
            - id: "address_registration"
              text: "📝 Регистрация адреса"
              type: "callback"
              callback: "ADDRESS_REGISTRATION_BUTTON"
    navigation:
      - callback: "CHECK_APPLICATION_STATUS_BUTTON"
        target: "CHECK_APPLICATION_STATUS"
      - callback: "GET_ID_NUMBER_BUTTON"
        target: "GET_ID_NUMBER"
      - callback: "TAX_NUMBER_BUTTON"
        target: "TAX_NUMBER"
      - callback: "EDEVLET_BUTTON"
        target: "EDEVLET"
      - callback: "ADDRESS_NUMARATAJ_BUTTON"
        target: "ADDRESS_NUMARATAJ"
      - callback: "ADDRESS_REGISTRATION_BUTTON"
        target: "ADDRESS_REGISTRATION"

  - id: "CHECK_APPLICATION_STATUS"
    text: |
      *🔍 Проверить статус заявления*
      
      Проверка статуса заявлений на ВНЖ, гражданство и другие документы
      
      🌐 Через сайт E\-Devlet:
      [turkiye\.gov\.tr](https://www\.turkiye\.gov\.tr)
      
      📱 Или через мобильное приложение
      
      ℹ️ Понадобится номер заявления
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "GET_ID_NUMBER"
    text: |
      *🆔 Получить ID номер \- TC Kimlik*
      
      TC Kimlik \- турецкий идентификационный номер
      
      📋 Выдается при:
      \- Получении ВНЖ
      \- Получении гражданства
      
      🏢 Где получить:
      Nüfus Müdürlüğü \(ЗАГС\)
      
      📄 Документы:
      \- Паспорт
      \- ВНЖ или документ о гражданстве
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "EDEVLET"
    text: |
      *🏛 E\\-Devlet \\- Портал госуслуг*
      
      Через E\\-Devlet можно:
      \\\\- Оплачивать штрафы
      \\\\- Проверять документы
      \\\\- Записываться к врачу
      \\\\- Получать справки
      
      🔐 Вход по паролю или через банк
      
      📱 Доступно через приложение:
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "edevlet_site"
              text: "🌐 Сайт"
              type: "url"
              url: "https://www.turkiye.gov.tr"
        - buttons:
            - id: "edevlet_android"
              text: "🤖 Android"
              type: "url"
              url: "https://play.google.com/store/apps/details?id=tr.gov.turkiye"
            - id: "edevlet_iphone"
              text: "🍎 iPhone"
              type: "url"
              url: "https://apps.apple.com/app/e-devlet/id123456"

  - id: "TAX_NUMBER"
    text: |
      *💼 Налоговый номер \- Vergi Numarası*
      
      📋 Необходим для:
      \- Открытия банковского счета
      \- Покупки недвижимости
      \- Оформления страховки
      
      🏢 Где получить:
      Налоговая служба \(Vergi Dairesi\)
      
      📄 Документы:
      \- Паспорт
      \- Заявление
      
      ⏱ Оформление: 10\-15 минут
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "ADDRESS_NUMARATAJ"
    text: |
      *🏠 Адрес \- Numarataj*
      
      Numarataj \- официальный документ с адресом квартиры
      
      📋 Необходим для:
      \- Регистрации адреса
      \- Подключения коммунальных услуг
      \- Оформления документов
      
      🏢 Где получить:
      Муниципалитет \(Belediye\)
      
      📄 Документы:
      \- Паспорт
      \- Tapu
    parse_mode: "MarkdownV2"
    disable_web_preview: true

  - id: "ADDRESS_REGISTRATION"
    text: |
      *📝 Регистрация адреса \- İkametgah*
      
      İkametgah \- справка о регистрации по адресу
      
      📋 Необходима для:
      \- ВНЖ
      \- Работы
      \- Учебы
      
      🏢 Где получить:
      Nüfus Müdürlüğü \(ЗАГС\)
      
      📄 Документы:
      \- Паспорт
      \- Numarataj
      \- Tapu или договор аренды
      
      ⏱ Срок действия: 3 месяца
    parse_mode: "MarkdownV2"
    disable_web_preview: true
