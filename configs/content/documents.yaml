version: "1.0"

screens:
  - id: "IMPORTANT_DOCUMENTS"
    text: "*📄 Важные документы*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "edevlet"
              text: "🏛 E-Devlet"
              type: "callback"
              callback: "EDEVLET_BUTTON"
        - buttons:
            - id: "tax_number"
              text: "💼 Налоговый номер"
              type: "callback"
              callback: "TAX_NUMBER_BUTTON"
        - buttons:
            - id: "address_numarataj"
              text: "🏠 Адрес \(Numarataj\)"
              type: "callback"
              callback: "ADDRESS_NUMARATAJ_BUTTON"
        - buttons:
            - id: "address_registration"
              text: "📝 Регистрация адреса"
              type: "callback"
              callback: "ADDRESS_REGISTRATION_BUTTON"
        - buttons:
            - id: "info_useful"
              text: "⭐️ Полезная информация"
              type: "callback"
              callback: "INFO_USEFUL_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "EDEVLET_BUTTON"
        target: "EDEVLET"
      - callback: "TAX_NUMBER_BUTTON"
        target: "TAX_NUMBER"
      - callback: "ADDRESS_NUMARATAJ_BUTTON"
        target: "ADDRESS_NUMARATAJ"
      - callback: "ADDRESS_REGISTRATION_BUTTON"
        target: "ADDRESS_REGISTRATION"
      - callback: "INFO_USEFUL_BUTTON"
        target: "INFO_USEFUL"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "EDEVLET"
    text: |
      *🏛 E\-Devlet \- Портал госуслуг*
      
      Через E\-Devlet можно:
      \- Оплачивать штрафы
      \- Проверять документы
      \- Записываться к врачу
      \- Получать справки
      
      🔐 Вход по паролю или через банк
      
      📱 Доступно через приложение:
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "edevlet_site"
              text: "🌐 Сайт"
              type: "url"
              url: "https://www.turkiye.gov.tr"
        - buttons:
            - id: "edevlet_android"
              text: "🤖 Android"
              type: "url"
              url: "https://play.google.com/store/apps/details?id=tr.gov.turkiye"
        - buttons:
            - id: "edevlet_iphone"
              text: "🍎 iPhone"
              type: "url"
              url: "https://apps.apple.com/app/e-devlet/id123456"
        - buttons:
            - id: "important_docs"
              text: "📄 Важные документы"
              type: "callback"
              callback: "IMPORTANT_DOCUMENTS_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "IMPORTANT_DOCUMENTS_BUTTON"
        target: "IMPORTANT_DOCUMENTS"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "TAX_NUMBER"
    text: |
      *💼 Налоговый номер \- Vergi Numarası*
      
      📋 Необходим для:
      \- Открытия банковского счета
      \- Покупки недвижимости
      \- Оформления страховки
      
      🏢 Где получить:
      Налоговая служба \(Vergi Dairesi\)
      
      📄 Документы:
      \- Паспорт
      \- Заявление
      
      ⏱ Оформление: 10\-15 минут
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "important_docs"
              text: "📄 Важные документы"
              type: "callback"
              callback: "IMPORTANT_DOCUMENTS_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "IMPORTANT_DOCUMENTS_BUTTON"
        target: "IMPORTANT_DOCUMENTS"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "ADDRESS_NUMARATAJ"
    text: |
      *🏠 Адрес \- Numarataj*
      
      Numarataj \- официальный документ с адресом квартиры
      
      📋 Необходим для:
      \- Регистрации адреса
      \- Подключения коммунальных услуг
      \- Оформления документов
      
      🏢 Где получить:
      Муниципалитет \(Belediye\)
      
      📄 Документы:
      \- Паспорт
      \- Tapu
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "important_docs"
              text: "📄 Важные документы"
              type: "callback"
              callback: "IMPORTANT_DOCUMENTS_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "IMPORTANT_DOCUMENTS_BUTTON"
        target: "IMPORTANT_DOCUMENTS"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"

  - id: "ADDRESS_REGISTRATION"
    text: |
      *📝 Регистрация адреса \- İkametgah*
      
      İkametgah \- справка о регистрации по адресу
      
      📋 Необходима для:
      \- ВНЖ
      \- Работы
      \- Учебы
      
      🏢 Где получить:
      Nüfus Müdürlüğü \(ЗАГС\)
      
      📄 Документы:
      \- Паспорт
      \- Numarataj
      \- Tapu или договор аренды
      
      ⏱ Срок действия: 3 месяца
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "important_docs"
              text: "📄 Важные документы"
              type: "callback"
              callback: "IMPORTANT_DOCUMENTS_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "IMPORTANT_DOCUMENTS_BUTTON"
        target: "IMPORTANT_DOCUMENTS"
      - callback: "MAIN_MENU_BUTTON"
        target: "MAIN_MENU"
