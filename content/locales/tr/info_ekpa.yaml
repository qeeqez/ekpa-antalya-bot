- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Dask Deprem Sigortası*


    ℹ️ *Bilgi:*

    \- Su ve elektrik hesabı açmak için gereklidir\.

    \- Asat veya CK Akdeniz Elektrik''e gitmeden önce *zaten Dask''a sahip olmalısınız*\.

    \- Dask Bank''ta yapamazsınız\.

    \- Bunu aşağıdaki bağlantıyı kullanarak herhangi bir sigorta şirketinden veya Nkolay''dan yapabilirsiniz\.


    💼 *Yanınızda götürün:*

    1\. Tapu veya kira sözleşmesi

    2\. Pasaport veya İkamet

    3\. Türk Vergi Numarası \(Numaranın kendisi yeterlidir\)

    4\. Açık adres / Ekpa''ya söyle


    📍 *[Nkolay''da] Dask siparişi verin(https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Elektrik*


    💼 *Yanınızda götürün:*

    1\. *Tapu* veya *kira sözleşmesi*

    2\. *Pasaport* veya *İkamet*

    3\. Türkçe *vergi numarası* \(Numaranın kendisi yeterlidir\)

    4\. Deprem sigortası *Dask*

    5\. *Depozito için para* (Bağlantı kesildiğinde iade edilir\)


    📍 *Yalnızca [CK Akdeniz Elektrik merkez ofisinden](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9) bağlanabilirsiniz*


    🧑‍💼*Ceza Kanunu''na bildirin:*

    Blok ve daire numarası ile elektrik abone numarası\.


    ℹ️ Dairede 1 iş günü içinde ışık görünecektir\.

    ℹ️ Elektrikle ilgili sorun varsa\- Ceza Kanunu''na bildirin\.


    ⚠️Elektrik panosu dolapta\.

    ⚠️ Elektrik sayacı bodrum katında kapalı bir kapının arkasında bulunmaktadır\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Su*


    💼 *Yanınızda götürün:*

    1\. *Tapu* veya *kira sözleşmesi*

    2\. *Pasaport* veya *İkamet*

    3\. Türkçe *vergi numarası* \(Numaranın kendisi yeterlidir\)

    4\. Deprem sigortası *Dask*

    5\. *Depozito için para* (Bağlantı kesildiğinde iade edilir\)


    📍 *[ASAT]''a su bağlayın(https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*Ceza Kanunu''na bildirin:*

    Blok ve daire numarası ile su abone numarası\.


    ℹ️ 3 iş günü içerisinde daireye su gelecektir\.

    ℹ️ Musluklarda su veya basınç sorunu varsa\- Ceza Kanunu''na bildirin\.


    ⚠️ Dairede suyu kesecek vana bulunmaktadır\.

    \- 1\+1''de lavabonun altına bakın\.

    \- 2\+1''de ruh vardır\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎İnternet*


    ℹ️ *İnternete bağlanmak için oturma iznine ihtiyacınız var \(ikamet\)*


    ℹ️ *Türkiye''de ev interneti sözleşmeli*

    \- Sözleşme bir veya iki yıllıktır

    \-Sözleşmenin erken feshedilmesi durumunda ceza ödenir

    \- Ödeme aylık olarak yapılır


    🌐 *İnternet operatörleri*

    \- [Türk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Türksat Kablo](https://www.fiberkablonet.com/)


    ℹ️Bağlanmak için ikamet\ ile operatör ofisine başvurmanız gerekir. Fiyat, operatörün web sitesindeki fiyatla aynıdır\.

    ⚠️ Ofis adresimizi sistemde bulamayabilir, siteye en yakın ofislerle iletişime geçmenizi öneririz\.


    🏴‍☠️ *Oturma izni olmadan bağlanın*

    \- Oturma izni olmadan bağlanmak için interneti kendisine ayarlayacak kişiyi bulmanız gerekir.

    \- Bu genellikle daha pahalıdır; birçok “yardımcı” böyle bir hizmet için para talep eder\.

    \- Emlakçınız veya İnternet operatörlerinin ofisleri aracılığıyla bir yardımcı bulabilirsiniz\.


    ⚡️ *Alternatif yöntemler*

    \- İnternet''i telefonunuzdan paylaşın

    \- Komşularınızdan yardım isteyin, Wi-Fi paylaşın'
- id: HOW_TO_DISCONNECT
  text: '*⛔️ Nasıl devre dışı bırakılır?*'
  button_texts:
    disconnect_electricity: ⚡️ Elektrik
    disconnect_water: 💧 Su
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Elektrik*


    💰 Bağlantıyı keserseniz, bağlantı sırasında ödenen depozito, ödeme bakiyesi düşülerek iade edilir


    🌎 *Çevrimiçi devre dışı bırak*

    \- Edevlet''e Giriş Yapın

    \- [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)
    sayfasına gidin

    \- Veya arama kısmına `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu` yazın

    \- *"Yeni Başvuru" \(Yeni Başvuru\)*''ya tıklayın, bir hesap seçin ve bilgilerinizi girin

    \- Paranın aktarılacağı IBAN''ı girin

    ⚠️ *Çevrimiçi bağlantıyı yalnızca İkamet''e bağlıysanız kesebilirsiniz*


    📍 *[CK Akdeniz Elektrik merkez ofisinde] elektriği çevrimdışı olarak kapatın(https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *Yanınızda götürün:*

    1\. *Abone numarası* \(sistemde daha hızlı bulunacaktır\)

    2\. *Pasaport* veya *İkamet*

    3\. Paranın aktarılacağı *IBAN*


    ℹ️ 24 saat içinde dairenin elektriği kesilecektir\.

    ℹ️Para ancak bağlantı kesildikten sonra 7\-30 gün\ içinde Türk hesabına aktarılacaktır.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Su*


    💰 Bağlantıyı keserseniz, bağlantı sırasında ödenen depozito, ödeme bakiyesi düşülerek iade edilir


    🌎 *Çevrimiçi devre dışı bırak*

    \- Edevlet''e Giriş Yapın

    \- [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu) sayfasına
    gidin

    \- Veya arama kısmına `ASAT Abonelik Sözleşmesi Feshi Başvurusu` yazın.

    \- *"Yeni Başvuru" \(Yeni Başvuru\)*''ya tıklayın, bir hesap seçin ve bilgilerinizi girin

    \- Paranın aktarılacağı IBAN''ı girin

    ⚠️ *Çevrimiçi bağlantıyı yalnızca İkamet''e bağlıysanız kesebilirsiniz*


    📍 *[ASAT]''ta suyu çevrimdışına alın(https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Yanınızda götürün:*

    1\. *Abone numarası* \(sistemde daha hızlı bulunacaktır\)

    2\. *Pasaport* veya *İkamet*

    3\. Paranın aktarılacağı *IBAN*


    ℹ️ 3 iş günü içerisinde dairedeki su kaybolacaktır\.

    ℹ️Para ancak bağlantı kesildikten sonra 7\-30 gün\ içinde Türk hesabına aktarılacaktır.'
