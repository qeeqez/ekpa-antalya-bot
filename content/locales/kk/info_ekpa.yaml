- id: HOW_TO_PAY_AIDAT
  text: '*Айдат*


    ℹ️ Кешеннің ай сайынғы техникалық қызмет көрсету ақысы\.

    ⚠️ Пәтерде тұрмасаңыз да төлеуіңіз керек\.


    *Құны:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Блок Пәтер Ай


    ⚠️ Төлейтін блоктың, пәтердің және айдың нөмірлерін міндетті түрде көрсетіңіз'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Кондиционер*


    ℹ️ Орталық ауаны баптау жүйесі электр қуатының төлеміне кірмейді\.

    ⚠️ Есіңізде болсын, Түркия ыстық ел, ал мұнда электр энергиясы қымбат\.


    *Төлем мерзімі:*

    ⏳ Шот-фактураны алған күннен бастап 7 күн

    ⚠️ Төлем жасалмаса, ол өшіріледі\. Қашықтан басқару пультінде құлыптау белгішесі және Орталықтандырылған\ пайда болады\.


    *Төлем:*

    🪙 Басқарушы компания кеңсесінде қолма-қол ақша немесе карта


    💳 Түрік банк картасынан шотқа онлайн аудару:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Алушының аты және төлем сипаттамасы*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Блокты пәтер


    ⚠️ Төлеп жатқан блок және пәтер нөмірлерін міндетті түрде көрсетіңіз'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Электр*


    ℹ️ Кондиционер электр қуатына кірмейді\.


    ℹ️ *Абоненттік нөмір* қосылған кезде беріледі, төлем картасында да көрсетіледі\.


    *Төлем мерзімі:*

    ℹ️ Шот-фактура айдың соңында беріледі

    ⏳ Төлем шот-фактура берілгеннен кейін 10 күн ішінде жасалуы тиіс\.


    *Электр шотыңызды қалай білуге болады:*

    \- Төлеу кезінде түрік интернет банкінде

    \- Мекенжайға келген төлем қағазы бірінші қабаттағы қабырғадағы жәшікке салынған

    \- [CK Akdeniz] веб-сайтында онлайн (https://online.ckakdeniz.com.tr)


    *Төлем:*


    💳 *Түрік интернет-банкингінде онлайн*

    1\. Fatura \(Vill Payment\) \-\> Elektrik \(Электр энергиясы\) \-\> *CK Akdeniz Elektrik*

    2\. *жазылу нөміріңізді* енгізіңіз

    3\. Сіз соманы көресіз және төлей аласыз

    ⚠️ Егер шот-фактура әлі жазылмаған болса, қолданба қатені көрсетеді\.


    🪙 *Қолма-қол ақша немесе карта*

    \- Turkcell филиалында шағын комиссиямен [Ең жақын 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Ең жақын 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- PTT пошта бөлімшесінде, [Ең жақын пошта бөлімшесі](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- CK Akdeniz Elektrik кез келген кеңсесінде, [Жақын кеңсе](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Су*


    ℹ️ *Абоненттік нөмір* қосылған кезде беріледі, төлем картасында да көрсетіледі\.


    *Төлем мерзімі:*

    ℹ️ Шот-фактура айдың соңында беріледі

    ⏳ Төлем шот-фактура берілгеннен кейін 10 күн ішінде жасалуы тиіс\.


    *Су шотыңызды қалай білуге болады:*

    \- Төлеу кезінде түрік интернет банкінде

    \- Мекенжайға келген төлем қағазы бірінші қабаттағы қабырғадағы жәшікке салынған

    \- [ASAT](https://online.asat.gov.tr/webportal/index.php)\ веб-сайтында онлайн\. HIZLI ÖDEME түймесін басыңыз


    *Төлем:*


    💳 *Түрік интернет-банкингінде онлайн*

    1\. Fatura \(Vill Payment\) \-\> Су \(Су\) \-\> *Анталия Су \(ASAT\)*

    2\. *жазылу нөміріңізді* енгізіңіз \(Санның сол жағына бірнеше нөл қосыңыз\)

    3\. Сіз соманы көресіз және төлей аласыз

    ⚠️ Егер шот-фактура әлі жазылмаған болса, қолданба қатені көрсетеді\.


    🪙 *Қолма-қол ақша немесе карта*

    \- Turkcell филиалында шағын комиссиямен [Ең жақын 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Ең жақын 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- PTT пошта бөлімшесінде, [Ең жақын пошта бөлімшесі](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- [ASAT бас кеңсесінде](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱 Ұялы телефон және интернет 🌎*


    💳 *Онлайн өтінімде немесе оператордың веб-сайтында*

    \- Телефоныңыз үшін келесі айға арналған пакетті таңдауыңыз керек

    \- Сіз жай ғана теңгерімді толтырып, одан кейін пакеттерді төлей аласыз

    \- Интернет үшін өткен айдың шотын төлеу керек


    🪙 *Қолма-қол ақша немесе карта*

    \- Turkcell филиалында шағын комиссиямен [Ең жақын 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Ең жақын 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Байланыс операторының кез келген кеңсесінде'
