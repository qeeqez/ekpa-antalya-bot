version: '1.0'
screens:
- id: AID_KIT
  parse_mode: MarkdownV2
  inline_keyboard:
    rows:
    - buttons:
      - id: ambulance
        type: callback
        callback: AMBULANCE_BUTTON
    - buttons:
      - id: hospitals
        type: callback
        callback: HOSPITALS_BUTTON
      - id: pharmacies
        type: callback
        callback: PHARMACIES_BUTTON
    - buttons:
      - id: medicine
        type: callback
        callback: MEDICINE_BUTTON
    - buttons:
      - id: polyclinic
        type: callback
        callback: POLYCLINIC_BUTTON
  navigation:
  - callback: AMBULANCE_BUTTON
    target: AMBULANCE
  - callback: HOSPITALS_BUTTON
    target: HOSPITALS
  - callback: PHARMACIES_BUTTON
    target: PHARMACIES
  - callback: MEDICINE_BUTTON
    target: MEDICINE
  - callback: POLYCLINIC_BUTTON
    target: POLYCLINIC
- id: AMBULANCE
  parse_mode: MarkdownV2
- id: PHARMACIES
  parse_mode: MarkdownV2
  disable_web_preview: true
  inline_keyboard:
    rows:
    - buttons:
      - id: pharmacies_site
        type: url
        url: https://www.antalyaeo.org.tr/tr/nobetci-eczaneler
    - buttons:
      - id: pharmacies_android
        type: url
        url: https://play.google.com/store/apps/details?id=com.adcinteractive.eczane
      - id: pharmacies_iphone
        type: url
        url: https://apps.apple.com/tr/app/n%C3%B6bet%C3%A7i-eczane-pharmacies/id1315296205
- id: HOSPITALS
  parse_mode: MarkdownV2
  disable_web_preview: true
  inline_keyboard:
    rows:
    - buttons:
      - id: hospitals_insurance_site
        type: url
        url: https://imecedestek.com/ContractedOrganizations
- id: POLYCLINIC
  parse_mode: MarkdownV2
  disable_web_preview: true
  inline_keyboard:
    rows:
    - buttons:
      - id: polyclinic_site
        type: url
        url: https://enabiz.gov.tr/
    - buttons:
      - id: polyclinic_android
        type: url
        url: https://play.google.com/store/apps/details?id=tr.gov.saglik.enabiz
      - id: polyclinic_iphone
        type: url
        url: https://apps.apple.com/tr/app/e-nab%C4%B1z/id980446169
- id: MEDICINE
  parse_mode: MarkdownV2
  disable_web_preview: true
