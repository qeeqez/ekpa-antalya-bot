version: '1.0'
screens:
- id: TRANSPORT
  text: '*🚌 Транспорт*'
  button_texts:
    bus: 🚌 Автобус
    antalya_card: 🪪 Antalya Kart
    taxi: 🚕 Такси
    kick_scooter: 🛴 Самокаты
- id: BUS
  text: "*\U0001F68E Общественный транспорт*\n\n \U0001F4CD Маршрут лучше всего планировать в *Google Maps*\n \U0001F9ED Текущее\
    \ местоположение автобусов можно посмотреть в приложении *AntalyaKart*\n\n \U0001F4B5 *Стоимость проезда*\n AntalyaKart\
    \ \\- 9\\.6 TL\n Банковская карта \\- 9\\.85 TL\n\n \U0001FA99️ *Стоимость пересадки*\n AntalyaKart \\- 3 TL\n Банковская\
    \ карта \\- 9\\.85 TL\n\n ℹ️ *Детям до 6 лет бесплатно*\n ⚠️ *Оплата наличными в транспорте запрещена*\n"
  button_texts:
    bus_concessionary: 🎫 Льготы
- id: BUS_CONCESSIONARY
  text: '🧒👴 *Льготный проезд*


    ℹ️ Для льготного проезда нужно сделать льготную карту


    💵 *Стоимость проезда*

    Студенты и школьники \- 4 TL

    Пожилые, Инвалиды, Учителя \- 8\.4 TL


    🪙️ *Стоимость пересадки \- 3 TL*


    ⁉️️ *Как получить льготную карту?*

    \- Выдается детям, пожилым и инвалидам, учителям

    \- Карта именная с фото

    \- Ребенку нужна справка со школы, о том что он ученик

    \- Сделать можно только в главных отделениях AntalyaKart

    \- [Ближайшее отделение здесь](https://goo.gl/maps/UHUeQU8AqJ9D4DSy6), в подземном переходе

    '
- id: ANTALYA_CARD
  text: "*\U0001F4B3 Antalya Kart*\n\n ℹ️ Стоимость проезда с этой картой дешевле\n ℹ️ Можно производить оплату за двоих,\
    \ нужно подождать после первого платежа\n\n \U0001F4CD *Где купить?*\n \\- В ближайшем [Soylu Market](https://goo.gl/maps/XLS1rGdPT9dvaziG9)\n\
    \ \\- В приложении *Antalya Kart* в разделе *Ближайшая точка* красным отмечены места продажи\n\n \U0001FA99 *Как пополнить?*\n\
    \ \\- Пополнить можно наличными там же, где и купить\n \\- Пополнить онлайн картой турецкого банка в приложении Antalya\
    \ Kart\n\n ⁉️ *Пополнил карту, а деньги не появились*\n \\- На терминале в автобусе нажать справа вверху красную кнопку\
    \ пополнения\n \\- Подержать 5 секунд\n\n \U0001F68C *Как смотреть маршруты в приложении?*\n \\- Найти подходящий маршрут\
    \ в Google Maps\n \\- В приложении Antalya Kart вбить в поиск номер маршрута\n \\- Отобразится весь маршрут и серые автобусы\
    \ в местах где они сейчас едут\n \\- Флажок \\-\\> конец маршрута, Треугольник \\-\\> начало\n \\- Направление маршрута\
    \ можно поменять нажав зеленую кнопку\n"
  button_texts:
    antalya_card_android: 🤖 Android
    antalya_card_iphone: 📱 iPhone
- id: TAXI
  text: '*🚖 Такси*


    ℹ️ Кнопки для вызова такси висят по всей Анталии, машина приезжает даже глубокой ночью


    🤙 *Вызвать можно:*

    1\. Кнопкой перед въездом

    2\. Приложение BiTaksi

    3\. Приложение Uber


    💵 *Стоимость: Посадка 10TL \+ 14TL/км*


    🪙 *Оплата*

    \- По счетчику в зеркале

    \- Стоимость в приложениях высчитывается по этому же счетчику

    \- Оплатить можно наличными лирами или картой \(не во всех такси\)

    \- В приложении возможно оплатить привязанной картой

    '
- id: KICK_SCOOTER
  text: '*🛴 Самокаты*


    ℹ️ *Службы проката самокатов в Анталии:*

    \- *BinBin* \(ездят у нашего комплекса\)

    \- *Marti*

    \- *Hop*

    \- *Beam*

    \- *Hop*

    \- *Gez*

    \- *Tornet*


    ℹ️ Вдоль берега работает служба проката велосипедов *Antbis*

    '
