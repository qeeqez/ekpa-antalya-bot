    ⚡️ En la planta baja puedes hacer copias de documentos por 1 TL


    📍 [Kepez Belediye](https://goo.gl/maps/5WBP63uMR5dCa1HcA) \(3\.5 km\)'
- id: POPULATION_OFFICE
  text: '*🧑‍💼 Nufus \(Ministerio de Registro de Población\)*


    ℹ️ En esta institución se expide la Tapa, se registran los ciudadanos turcos, se registran los recién nacidos y se resuelven
    otros problemas de población\.

    ⚠️ Los extranjeros deben registrarse en Goc, no en Nufus\.


    📍 [Kepez Nufus](https://goo.gl/maps/1u4SiTYfYBVbRNFs8) \(3\.5 km\)'
- id: MIGRATION_OFFICE
  text: '*👮 Goc Idaresi \(Departamento de Migración de Antalya\)*


    1️⃣ Aquí debes registrarte\.

    2️⃣ Aquí tiene lugar la cita \(solicitud de permiso de residencia\) y se resuelven todas las cuestiones relacionadas con
    el permiso de residencia\.

    3️⃣ Aquellos que aún no lo hayan hecho pueden ser llamados aquí para tomar las huellas dactilares\.


    📍 [Goc Idaresi](https://goo.gl/maps/Q46vs5Dj9ipu32cS9) \(8\.1 km\)'
