- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Dask Erdbebenversicherung*


    ℹ️ *Informationen:*

    \- Erforderlich, um ein Konto für Wasser und Strom zu eröffnen\.

    \- Bevor Sie zu Asat oder CK Akdeniz Elektrik gehen, *sollten Sie bereits Dask haben*\.

    \- Das ist in Dask Bank nicht möglich\.

    \- Sie können dies bei jeder Versicherungsgesellschaft oder bei Nkolay über den untenstehenden Link tun.


    💼 *Mitnehmen:*

    1\. Tapu oder Mietvertrag

    2\. Reisepass oder Ikamet

    3\. Türkische Steuernummer \(Die Nummer selbst reicht aus\)

    4\. Vollständige Adresse / Tell Ekpa


    📍 *Dask in [Nkolay] bestellen(https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Strom*


    💼 *Mitnehmen:*

    1\. *Tapu* oder *Mietvertrag*

    2\. *Reisepass* oder *Ikamet*

    3\. Türkische *Steuernummer* \(Die Nummer selbst reicht aus\)

    4\. Erdbebenversicherung *Dask*

    5\. *Geld* für die Kaution \(Rückerstattung bei Trennung der Verbindung\)


    📍 *Sie können sich nur am [Hauptsitz von CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)* anmelden


    🧑‍💼*Anzeige beim Strafgesetzbuch:*

    Block- und Wohnungsnummer, sowie Teilnehmernummer für Strom.


    ℹ️ Innerhalb eines Werktages wird in der Wohnung Licht erscheinen.

    ℹ️ Bei Problemen mit der Elektrizität melden Sie das Strafgesetzbuch.


    ⚠️ Die Schalttafel befindet sich im Schrank.

    ⚠️Der Stromzähler befindet sich im Keller hinter einer verschlossenen Tür.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Wasser*


    💼 *Mitnehmen:*

    1\. *Tapu* oder *Mietvertrag*

    2\. *Reisepass* oder *Ikamet*

    3\. Türkische *Steuernummer* \(Die Nummer selbst reicht aus\)

    4\. Erdbebenversicherung *Dask*

    5\. *Geld* für die Kaution \(Rückerstattung bei Trennung der Verbindung\)


    📍 *Wasser an [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)* anschließen


    🧑‍💼*Anzeige beim Strafgesetzbuch:*

    Block- und Wohnungsnummer, sowie Teilnehmernummer für Wasser.


    ℹ️ Innerhalb von 3 Werktagen wird Wasser in der Wohnung erscheinen.

    ℹ️ Wenn Sie Probleme mit Wasser oder Druck in den Wasserhähnen haben, benachrichtigen Sie das Strafgesetzbuch.


    ⚠️ Die Wohnung verfügt über ein Ventil zum Absperren des Wassers.

    \- Schauen Sie bei 1\+1 unter die Spüle\.

    \- In 2\+1 ist in der Seele\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎 Internet*


    ℹ️ *Um sich mit dem Internet zu verbinden, benötigen Sie eine Aufenthaltserlaubnis \(ikamet\)*


    ℹ️ *Heim-Internet in der Türkei unter Vertrag*

    \- Der Vertrag hat eine Laufzeit von ein oder zwei Jahren

    \- Im Falle einer vorzeitigen Vertragsauflösung wird eine Vertragsstrafe gezahlt

    \- Die Zahlung erfolgt monatlich


    🌐 *Internetbetreiber*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Um eine Verbindung herzustellen, müssen Sie sich mit einem Ikamet an das Büro des Betreibers wenden. Der Preis ist
    derselbe wie auf der Website des Betreibers.

    ⚠️ Möglicherweise findet das Büro unsere Adresse nicht im System. Wir empfehlen Ihnen, sich an die Büros in der Nähe des
    Komplexes zu wenden.


    🏴‍☠️ *Anschließen ohne Aufenthaltserlaubnis*

    \- Um eine Verbindung ohne Aufenthaltserlaubnis herzustellen, müssen Sie eine Person finden, die sich um das Internet
    kümmert\.

    \- Das ist meist teurer, viele „Helfer“ verlangen Geld für einen solchen Service\.

    \- Ein Helfer kann über Ihren Immobilienmakler oder über die Büros von Internetbetreibern gefunden werden.


    ⚡️ *Alternative Methoden*

    \- Teilen Sie das Internet von Ihrem Telefon aus

    \- Bitten Sie Ihre Nachbarn um Hilfe, teilen Sie WLAN mit anderen'
