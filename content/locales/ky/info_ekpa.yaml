  text: '*🧑‍🔧 Кантип кошулса/кайра катталса болот? ♻️*


    1️⃣ Биринчи кошулуу процесси кайра каттоодон айырмаланбайт

    2️⃣ Кайра каттоодон өткөндө, мурунку төлөөчү ажыратуу үчүн өзүнчө жол жүрүүнүн кереги жок\.'
