- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Seguro contra terremotos Dask*


    ℹ️ *Información:*

    \- Requerido abrir una cuenta para agua y electricidad\.

    \- Antes de ir a Asat o CK Akdeniz Elektrik *ya deberías tener Dask*\.

    \- No puedes hacerlo en Dask Bank\.

    \- Puedes hacerlo en cualquier compañía de seguros o en Nkolay utilizando el siguiente enlace\.


    💼 *Llévate contigo:*

    1\. Tapu o contrato de arrendamiento

    2\. Pasaporte o Ikamet

    3\. Número de impuesto turco \(El número en sí es suficiente\)

    4\. Dirección completa / Dígale a Ekpa


    📍 *Pedir Dask en [Nkolay](https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Electricidad*


    💼 *Llévate contigo:*

    1\. *Tapu* o *contrato de arrendamiento*

    2\. *Pasaporte* o *Ikamet*

    3\. *Número fiscal turco* \(El número en sí es suficiente\)

    4\. Seguro contra terremotos *Dask*

    5\. *Dinero* para depósito \(Devuelto al desconectarse\)


    📍 *Puedes conectarte solo en [oficina central de CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    🧑‍💼*Denuncia al Código Penal:*

    Número de bloque y de apartamento, así como número de abonado de electricidad\.


    ℹ️ La luz aparecerá en el apartamento dentro de 1 día hábil\.

    ℹ️ Si hay problemas con la electricidad\- notificar al Código Penal\.


    ⚠️El panel eléctrico está en el armario\.

    ⚠️ El medidor eléctrico se encuentra en el sótano, detrás de una puerta cerrada\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Agua*


    💼 *Llévate contigo:*

    1\. *Tapu* o *contrato de arrendamiento*

    2\. *Pasaporte* o *Ikamet*

    3\. *Número fiscal turco* \(El número en sí es suficiente\)

    4\. Seguro contra terremotos *Dask*

    5\. *Dinero* para depósito \(Devuelto al desconectarse\)


    📍 *Conectar agua a [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*Denuncia al Código Penal:*

    Número de bloque y de apartamento, así como número de abonado de agua\.


    ℹ️ Dentro de 3 días hábiles, aparecerá agua en el apartamento\.

    ℹ️ Si tienes problemas con el agua o presión en los grifos\- notifica al Código Penal\.


    ⚠️ El departamento tiene válvula para cerrar el agua\.

    \- En 1\+1, mira debajo del fregadero\.

    \- En 2\+1 está en el alma\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎Internet*


    ℹ️ *Para conectarse a Internet necesita un permiso de residencia \(ikamet\)*


    ℹ️ *Internet residencial en Turquía bajo contrato*

    \- El contrato es por un año o dos años

    \- En caso de rescisión anticipada del contrato, se paga una penalización

    \- El pago se realiza mensualmente


    🌐 *Operadores de Internet*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Para conectarse, debe comunicarse con la oficina del operador con un ikamet\. El precio es el mismo que en el sitio
    web del operador\.

    ⚠️ Es posible que la oficina no encuentre nuestra dirección en el sistema, recomendamos comunicarse con las oficinas más
    cercanas al complejo\.


    🏴‍☠️ *Conéctate sin permiso de residencia*

    \- Para conectarse sin un permiso de residencia, necesita encontrar una persona que se encargue de Internet\.

    \- Esto suele ser más caro, muchos “ayudantes” cobran dinero por dicho servicio\.

    \- Puede encontrar un ayudante a través de su agente inmobiliario o de las oficinas de los operadores de Internet\.


    ⚡️ *Métodos alternativos*

    \- Comparte Internet desde tu teléfono

    \- Pide ayuda a tus vecinos, comparte Wi\-Fi'
- id: HOW_TO_DISCONNECT
  text: '*⛔️ ¿Cómo desactivarlo?*'
  button_texts:
    disconnect_electricity: ⚡️ Electricidad
    disconnect_water: 💧 Agua
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Electricidad*


    💰 Si te desconectas, se devuelve el depósito que se pagó al conectarse, menos el saldo a pagar


    🌎 *Desactivar en línea*

    \- Iniciar sesión en Edevlet

    \- Ir a la página [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- O escriba la búsqueda `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu`

    \- Haga clic en *"Nueva aplicación" \(Yeni Başvuru\)*, seleccione una cuenta y complete sus datos

    \- Complete el IBAN al que se transferirá el dinero

    ⚠️ *Puedes desconectarte en línea solo si te conectaste a Ikamet*


    📍 *Apague la electricidad en [la oficina central de CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *Llévate contigo:*

    1\. *Número de suscriptor* \(se encontrará más rápido en el sistema\)

    2\. *Pasaporte* o *Ikamet*

    3\. *IBAN* al que se transferirá el dinero


    ℹ️ Dentro de 24 horas, el apartamento se quedará sin electricidad\.

    ℹ️ El dinero se acreditará en la cuenta turca solo después de la desconexión, dentro de 7\-30 días\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Agua*


    💰 Si te desconectas, se devuelve el depósito que se pagó al conectarse, menos el saldo a pagar


    🌎 *Desactivar en línea*

    \- Iniciar sesión en Edevlet

    \- Ir a la página [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- O escriba buscar `ASAT Abonelik Sözleşme Feshi Başvurusu`

    \- Haga clic en *"Nueva aplicación" \(Yeni Başvuru\)*, seleccione una cuenta y complete sus datos

    \- Complete el IBAN al que se transferirá el dinero

    ⚠️ *Puedes desconectarte en línea solo si te conectaste a Ikamet*


    📍 *Desconectar el agua en [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Llévate contigo:*

    1\. *Número de suscriptor* \(se encontrará más rápido en el sistema\)

    2\. *Pasaporte* o *Ikamet*

    3\. *IBAN* al que se transferirá el dinero


    ℹ️ Dentro de 3 días hábiles, el agua del apartamento desaparecerá\.

    ℹ️ El dinero se acreditará en la cuenta turca solo después de la desconexión, dentro de 7\-30 días\.'
