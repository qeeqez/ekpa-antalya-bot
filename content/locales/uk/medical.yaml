- id: HOSPITALS
  text: '*🏥Лікарні\- Hastane*


    🛡️ *За страховкою*


    1️⃣️ Щоб подати заявку на страховку, спершу потрібно дізнатися, з якими лікарнями вона працює

    2️⃣ Страхування часто не покриває всю суму лікування, але це залежить від вашого полісу та страхової компанії


    ⁉️ *Як дізнатися, з якими лікарнями працює ваша страховка:*

    1\. Відвідайте веб-сайт [imecedestek](https://imecedestek.com/ContractedOrganizations)

    2\. Вкажіть назву страхової компанії та вид страхування

    3\. Виберіть область, у якій ви хочете переглянути договірні організації

    4\. Виберіть тип закладу

    5\. Натисніть *Ara / Пошук*


    ⭐️ Таким чином ви отримаєте список лікарень та інших медичних закладів, де ви маєте страховку\.


    ❤️‍🩹 *Без страховки*


    \- Ви можете звертатися в лікарні та приватні клініки і не зі страхового списку\.

    \- У цьому випадку ваша страховка також може покривати невелику частину лікування\. \(Про це читайте в описі та умовах
    страхування\)

    \- Якщо у вас немає страховки, то приготуйтеся підготувати досить велику суму\.


    📍 Шукайте лікарні на карті за допомогою турецького слова *Hastane*\.'
  button_texts:
    hospitals_insurance_site: 🌎 {{button_hospital_search}}
- id: POLYCLINIC
  text: '*🧑‍⚕️ Безкоштовні ліки*


    💫 У Туреччині ви можете отримати *основну медичну допомогу безкоштовно*

    \- Для цього після отримання прописки потрібно закріпитися за сімейним лікарем


    🆓️ *Що дає:*

    \- Пройти загальний огляд можна у сімейного лікаря

    \- Пройти базові тести

    \- Отримати рецепт на ліки

    \- Зробіть щеплення собі та своїм дітям

    \- Отримати рекомендації спеціалістів у лікарнях

    \- Історія всіх аналізів і обстежень буде відображатися в додатку e\-Nabız\.

    \- Причому з усіх лікарень, включно з приватними\.


    💼 *Що вам потрібно:*

    \- Турецький номер телефону

    \- e\-Devlet \(здійснено на пошті\)

    \- Реєстрація за Вашою адресою


    🌎 *Як прикріпити:*

    1\. Зареєструватися на [веб-сайт enabiz](https://enabiz.gov.tr/)

    2\. Виберіть функцію *Змінити сімейного лікаря*

    3\. Виберіть місто, район

    4\. Відкриється список доступних сімейних клінік і спеціалістів.

    \- Лікаря, виділеного червоним, не можна вибрати

    \- Лікарі, виділені зеленим, більш вільні

    \- Зміна лікаря з 5-го на 21-ше число відбувається в цей же день\. Заявки з 22 по 4 число розглядатимуться 5\.


    ⚡️*Додатково:*

    \- Зареєструватися на [сайті MHRS](https://www.mhrs.gov.tr/) \(сайт для запису на прийом до лікаря\)


    ⭐ Тепер ви можете *Записатися на прийом до лікаря / Запис на прийом / Рандеву* через сайт і додаток e\-Nabız\'
  button_texts:
