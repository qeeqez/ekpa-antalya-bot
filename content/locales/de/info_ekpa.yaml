- id: HOW_TO_PAY_AIDAT
  text: '*Aidat*


    ℹ️ Monatliche Wartungsgebühr für den Komplex.

    ⚠️ Sie müssen zahlen, auch wenn Sie nicht in einer Wohnung wohnen.


    *Kosten:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Block Apartment Month


    ⚠️ Geben Sie unbedingt die Nummern des Blocks, der Wohnung und des Monats an, für den Sie bezahlen'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Klimaanlage*


    ℹ️ Die zentrale Klimaanlage ist nicht in der Stromrechnung enthalten.

    ⚠️ Bedenken Sie, dass Türkiye ein heißes Land ist und Strom hier teuer ist.


    *Zahlungsziel:*

    ⏳ 7 Tage ab Rechnungserhalt

    ⚠️ Wenn die Zahlung nicht erfolgt, wird sie deaktiviert. Auf der Fernbedienung werden ein Schlosssymbol und „Zentralisiert“
    angezeigt.


    *Zahlung:*

    🪙 Bargeld oder Karte im Büro der Verwaltungsgesellschaft


    💳 Online-Überweisung von einer türkischen Bankkarte auf das Konto:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Name des Empfängers und Zahlungsbeschreibung*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Blockwohnung


    ⚠️ Geben Sie unbedingt die Block- und Wohnungsnummern an, für die Sie bezahlen'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Strom*


    ℹ️ Die Klimaanlage ist nicht in der Stromrechnung enthalten.


    ℹ️ Die *Teilnehmernummer* wird bei der Verbindung vergeben und ist auch auf der Zahlungskarte angegeben.


    *Zahlungsziel:*

    ℹ️ Die Rechnung wird am Monatsende ausgestellt

    ⏳ Die Zahlung muss innerhalb von 10 Tagen nach Rechnungsstellung erfolgen.


    *So finden Sie Ihre Stromrechnung heraus:*

    \- In der türkischen Internetbank beim Bezahlen

    \- Der an der Adresse eintreffende Einzahlungsschein wird in einem Kasten an der Wand im ersten Stock abgelegt

    \- Online auf der Website [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Zahlung:*


    💳 *Online im türkischen Internet-Banking*

    1\. Fatura \(Rechnungszahlung\) \-\> Elektrik \(Strom\) \-\> *CK Akdeniz Elektrik*

    2\. Geben Sie Ihre *Abonnentennummer* ein

    3\. Sie sehen den Betrag und können bezahlen

    ⚠️ Wenn die Rechnung noch nicht ausgestellt wurde, zeigt die Anwendung einen Fehler an.


    🪙 *Bargeld oder Karte*

    \- In der Turkcell-Filiale mit einer kleinen Provision [Nächste 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nächste 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Im PTT-Postamt, [Nächstes Postamt](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- In jedem Büro von CK Akdeniz Elektrik, [Nächstes Büro](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Wasser*


    ℹ️ Die *Teilnehmernummer* wird bei der Verbindung vergeben und ist auch auf der Zahlungskarte angegeben.


    *Zahlungsziel:*

    ℹ️ Die Rechnung wird am Monatsende ausgestellt

    ⏳ Die Zahlung muss innerhalb von 10 Tagen nach Rechnungsstellung erfolgen.


    *So finden Sie Ihre Wasserrechnung heraus:*

    \- In der türkischen Internetbank beim Bezahlen

    \- Der an der Adresse eintreffende Einzahlungsschein wird in einem Kasten an der Wand im ersten Stock abgelegt

    \- Online auf der Website [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Klicken Sie auf HIZLI ÖDEME


    *Zahlung:*


    💳 *Online im türkischen Internet-Banking*

    1\. Fatura \(Rechnung\) \-\> Su \(Wasser\) \-\> *Antalya Su \(ASAT\)*

    2\. Geben Sie Ihre *Teilnehmernummer* ein \(Fügen Sie links von der Nummer ein paar Nullen hinzu\)

    3\. Sie sehen den Betrag und können bezahlen

    ⚠️ Wenn die Rechnung noch nicht ausgestellt wurde, zeigt die Anwendung einen Fehler an.


    🪙 *Bargeld oder Karte*

    \- In der Turkcell-Filiale mit einer kleinen Provision [Nächste 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nächste 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Im PTT-Postamt, [Nächstes Postamt](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- Im [ASAT-Hauptsitz](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
