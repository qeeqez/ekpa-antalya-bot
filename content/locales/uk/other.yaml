version: '1.0'
screens:
- id: CAR_FINE
  text: "*\U0001F697 Штраф за авто на іноземних номерах*\n\n ℹ️ *Перевірте штрафи*\n \\- Перейдіть на [сайт податкової служби](https://ivd.gib.gov.tr/)\n\
    \ \\- Виберіть нижню праву кнопку\n \\- *Yabancı Plakalı Araç Ödemeleri \\(Платежі за іноземні транспортні засоби\\)*\n\
    \ \\- Введіть номер автомобіля\n\n \U0001F4B3 *Оплата онлайн*\n \\- Ви можете зробити це там, після перевірки штрафу\n\
    \ \\- Оплату можна здійснити лише турецькою кредитною карткою\n \\- При виборі оплати через податкову, якщо перейти на\
    \ другу вкладку \\(друга вкладка\\)\n \\- Можна буде оплатити через Ziraat або Vakif Pay\n\n \U0001FA99 *Оплата готівкою*\n\
    \ \\- У податковій службі [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)"
- id: PHONE_UNLOCK
  text: '*📲 Розблокуйте телефон*


    ℹ️ *У Туреччині є 2 різні телефонні замки*

    1\. SIM\-карта блокується через 90 днів \(турист\)

    2\. Сам телефон блокується через 120 днів \(після вставлення будь\-якої турецької SIM\-карти\)'
  button_texts:
    phone_unlock_sim: 📱 Розблокувати SIM (турист)
    phone_unlock_imei: 📱 Розблокуйте телефон (IMEI)
- id: PHONE_UNLOCK_SIM
  text: '*📱 Розблокувати SIM \(Турист\)*


    ℹ️ *Яке блокування?*

    \- Якщо Ваша SIM\-карта видана за паспортом, а не за Ікамет \(прописка\)

    \- Тоді це туристичний сайт і буде заблоковано через 90 днів


    🆓 *Як розблокувати*

    \- В додатку оператора зв''язку введіть свій ікамет \(якщо є, то достатньо самого номера, тому підійде і паперовий\)

    \- Якщо немає ікамета, то прив''язати його до іншої людини не вийде


    ⚡️ *Альтернативні методи*

    \- Як тимчасове рішення, ви можете придбати сім\-карту, видану на ім''я місцевого жителя поблизу комплексу

    \- Перереєструвати Sim на людину з пропискою'
- id: PHONE_UNLOCK_IMEI
  text: '*📱 Розблокуйте телефон \(IMEI\)*


    ℹ️ *Яке блокування?*

    \- Через 120 днів з моменту вставлення турецької SIM\-карти в принесений телефон, він блокується\.

    \- Заблоковано тільки в Туреччині \(продовжує повноцінно працювати в інших країнах\)

    \- Блокується не сам телефон, а IMEI, тобто\. певний слот для SIM\-картки\.

    \- Ніякі SIM\-карти, дзвінки чи SMS не працюють\. Телефон каже «Немає мережі» і «Телефон заборонено»\.

    \- Сам телефон продовжує працювати, включаючи WiFi і дзвінки в месенджерах через інтернет\.'
  button_texts:
    phone_unlock_imei_free: 🆓 Безкоштовний варіант
    phone_unlock_imei_paid: 💰 Платний варіант (30000 TL)
    phone_unlock_imei_reblock: 🤯 Якщо телефон знову заблоковано
- id: PHONE_UNLOCK_IMEI_FREE
  text: '🆓 *Безкоштовне розблокування телефону*

    \- Вставте SIM\-карту в другий слот, якщо він доступний \(на деяких телефонах можна використовувати ESIM\)

    \- Відтепер почнеться відлік 120 днів

    \- Після закінчення терміну другий слот також буде заблоковано


    ❗️ Безкоштовне розблокування на рік через Edevlet більше не працює, це була тимчасова акція на честь Covid


    ⚡️ *Альтернативний варіант*

    \- Купіть дешевий телефон і роздайте з нього WiFi

    \- Купіть модем 4G і роздайте з нього, але тоді неможливо приймати дзвінки'
- id: PHONE_UNLOCK_IMEI_PAID
  text: "*\U0001F4B0 Офіційне платне розблокування телефону*\n\nℹ️ 1 людина може реєструвати 1 телефон кожні 3 роки\\.\n*Обов’язково:*\
    \ ця особа має прибути з\\-за кордону не пізніше 365 днів тому\n\n\U0001F4B0 *Ціна в 2024 році: 30000 TL \U0001F92F*\n\
    \n\U0001F9E7 *Процес реєстрації:*\n\\- Увійдіть в Edevlet, використовуючи номер ikamet і пароль, отриманий поштою\n\\\
    - Перейти на сторінку [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet) \\(або шукати `IMEI Kaydet`\\)\n\\- Заповніть\
    \ свої дані \\(усі IMEI в телефоні, ваш паспорт і дата в'їзду в країну\\)\n\\- Платити\n\n\U0001FA99 *Оплата готівкою*\n\
    \\- Ви можете розрахуватися готівкою в податковій\n\\- Після оплати необхідно оформити заявку на розблокування через Edevlet\
    \ на сторінці [imei kaydet](https://www.turkiye.gov.tr/btk-imei-kaydet)\n\n\U0001F4B5 *Онлайн оплата*\n\\- Оплата можлива\
    \ тільки турецькою карткою\\. Лише кредит, дебет не приймається\n\\- Ви можете вибрати платити через податкову службу\
    \ \\(Vergi Dairesi\\)\n     \\- Замість того, щоб вводити картку, перейдіть на другу вкладку\n     \\- Можна буде оплатити\
    \ ZiraatPay і VakifPay, я робив через zirat\n\n⛔️ *Мінуси*\n\\- Ви повинні використовувати SIM\\-карту, зареєстровану\
    \ в тому ж Ikamet\n\\- Це правило діє 3 роки, потім можна використовувати будь\\-які SIM\\-карти"
- id: PHONE_UNLOCK_IMEI_REBLOCK
  text: "\U0001F92F *Якщо телефон знову заблоковано*\n\nℹ️ Телефон і SIM\\-карта в ньому повинні бути зареєстровані на той\
    \ самий Ikamet\n\n✅ *Якщо все добре*\n\U0001F4F2 Для уточнення телефонуйте в службу БТК за номером 120 \\(є вибір англомовного\
    \ оператора\\)\n\n\U0001F6A8 *Інакше*\n\\- Перенесіть свою SIM\\-картку на інший Ikamet від вашого оператора\n    \\-\
    \ Поточний оплачений пакет втрачено\n    \\- Сама передача може бути не безкоштовною\n\\- Відкрийте нову SIM\\-карту"
