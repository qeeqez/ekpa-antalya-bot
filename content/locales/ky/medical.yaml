- id: AMBULANCE
  text: '*🚑 Тез жардам*


    ☎️ `112`


    ℹ️ *Тез жардамды акыркы чара катары гана чакырыңыз\.*

    Түркияда тез жардам кызматын чакыруу бир тыйынга кымбаттайт\.

    Тез жардам чакырганда, англисче айт, англисче операторго өтүш керек\.


    😷️ *Чет элдиктер үчүн ишеним телефону*


    ☎️ `+90 850 288 38 38`


    ℹ️ *Ишеним телефонунда бардык тилдер сүйлөшөт*

    Алар бардык медициналык маселелерди чечүүгө, анын ичинде тез жардамды чакырууга жардам беришет\.'
- id: PHARMACIES
  text: '*🧑‍⚕️ Аптекалар \- Экзане*


    ℹ️ Кадимки дарыканалар жекшемби күнү жабык


    📍 Көптөгөн дарыканалар ооруканага барчу жолдо жайгашкан:

    📍 [Kepez Devlet Hastanesi](https://goo.gl/maps/b5cnrK2H4apXkqWw9)


    *🏥 Дежурный аптекалар \- Nöbetçi Eczaneler*


    \- Алар күнү-түнү иштешет

    \- Ар куну алар ар турдуу

    \- Учурдагыларды веб-сайттан же тиркемеден көрүүгө болот'
