- id: HOW_TO_PAY_AIDAT
  text: '*Aidat*


    ℹ️ Frais d''entretien mensuels pour le complexe\.

    ⚠️ Vous devez payer, même si vous n''habitez pas en appartement\.


    *Coût :*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Bloc Appartement Mois


    ⚠️ N''oubliez pas d''indiquer les numéros du bloc, de l''appartement et du mois pour lequel vous payez'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Climatisation*


    ℹ️ Le système de climatisation central n''est pas inclus dans la facture d''électricité\.

    ⚠️ Gardez à l''esprit que la Turquie est un pays chaud et que l''électricité y est chère\.


    *Délai de paiement :*

    ⏳ 7 jours à compter de la date de réception de la facture

    ⚠️ Si le paiement n''est pas effectué, il sera désactivé\. Une icône de verrouillage et Centralisé\ apparaîtront sur la
    télécommande\.


    *Paiement :*

    🪙 Espèces ou carte au Bureau de la Société de Gestion


    💳 Virement en ligne d''une carte bancaire turque vers le compte :


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Nom du destinataire et description du paiement*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Appartement en bloc


    ⚠️ Assurez\-vous d''indiquer les numéros de bloc et d''appartement pour lesquels vous payez'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Électricité*


    ℹ️ La climatisation n''est pas incluse dans la facture d''électricité\.


    ℹ️ Le *Numéro d''abonné* est délivré dès la connexion, il est également indiqué sur la carte de paiement\.


    *Délai de paiement :*

    ℹ️ La facture est émise en fin de mois

    ⏳ Le paiement doit être effectué dans les 10 jours suivant l''émission de la facture\.


    *Comment connaître votre facture d''électricité :*

    \- Dans la banque Internet turque lors du paiement

    \- Le bulletin de versement qui arrive à l''adresse est déposé dans une boîte accrochée au mur du premier étage

    \- En ligne sur le site [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Paiement :*


    💳 *En ligne dans les services bancaires par Internet turcs*

    1\. Fatura \(Paiement de factures\) \-\> Elektrik \(Électricité\) \-\> *CK Akdeniz Elektrik*

    2\. Entrez votre *numéro d''abonné*

    3\. Vous verrez le montant et pourrez payer

    ⚠️ Si la facture n''a pas encore été émise, l''application affichera une erreur\.


    🪙 *Espèces ou carte*

    \- Dans la succursale de Turkcell avec une petite commission [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest
    2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Au bureau de poste des PTT, [Bureau de poste le plus proche](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- Dans n''importe quel bureau de CK Akdeniz Elektrik, [Bureau le plus proche](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Eau*


    ℹ️ Le *Numéro d''abonné* est délivré dès la connexion, il est également indiqué sur la carte de paiement\.


    *Délai de paiement :*

    ℹ️ La facture est émise en fin de mois

    ⏳ Le paiement doit être effectué dans les 10 jours suivant l''émission de la facture\.


    *Comment connaître votre facture d''eau :*

    \- Dans la banque Internet turque lors du paiement

    \- Le bulletin de versement qui arrive à l''adresse est déposé dans une boîte accrochée au mur du premier étage

    \- En ligne sur le site [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Cliquez sur HIZLI ÖDEME


    *Paiement :*


    💳 *En ligne dans les services bancaires par Internet turcs*

    1\. Fatura \(Paiement de factures\) \-\> Su \(Eau\) \-\> *Antalya Su \(ASAT\)*

    2\. Entrez votre *numéro d''abonné* \(Ajoutez quelques zéros à gauche du numéro\)

    3\. Vous verrez le montant et pourrez payer

    ⚠️ Si la facture n''a pas encore été émise, l''application affichera une erreur\.


    🪙 *Espèces ou carte*

    \- Dans la succursale de Turkcell avec une petite commission [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest
    2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Au bureau de poste des PTT, [Bureau de poste le plus proche](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- Au [siège social d''ASAT](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱Téléphone portable et Internet 🌎*


    💳 *En ligne dans l''application ou sur le site de votre opérateur*

    \- Pour votre téléphone, vous devez sélectionner un forfait pour le mois prochain

    \- Vous pouvez simplement recharger votre solde et payer plus tard les forfaits à partir de celui\-ci

    \- Pour Internet, vous devez payer la facture du mois précédent


    🪙 *Espèces ou carte*

    \- Dans la succursale de Turkcell avec une petite commission [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest
    2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Dans n''importe quel bureau de votre opérateur télécom'
