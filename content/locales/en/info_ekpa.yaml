- id: HOW_TO_PAY_AIDAT
  text: '*Aidat*


    ℹ️ Monthly maintenance fee for the complex\.

    ⚠️ You must pay, even if you do not live in an apartment\.


    *Cost:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Block Apartment Month


    ⚠️ Be sure to indicate the numbers of the block, apartment and month for which you are paying'
- id: HOW_TO_PAY_CONDITIONER
  text: '*Air conditioning*


    ℹ️ The central air conditioning system is not included in the electricity bill\.

    ⚠️ Keep in mind that Türkiye is a hot country, and electricity is expensive here\.


    *Payment term:*

    ⏳ 7 days from the date of receipt of the invoice

    ⚠️ If payment is not made, it will be disabled\. A lock icon and Centralized\ will appear on the remote control.


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Block Apartment


    ⚠️ Be sure to indicate the block and apartment numbers for which you are paying'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Electricity*


    ℹ️ Air conditioning is not included in the electricity bill\.


    ℹ️ *Subscriber number* is issued upon connection, it is also indicated on the payment card\.


    *Payment term:*

    ℹ️ Invoice is issued at the end of the month

    ⏳ Payment must be made within 10 days after the invoice is issued\.


    *How to find out your electricity bill:*

    \- In the Turkish Internet bank when paying

    \- The payment slip that arrives at the address is placed in a box on the wall on the first floor

    \- Online on the website [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Payment:*


    💳 *Online in Turkish Internet Banking*

    1\. Fatura \(Bill Payment\) \-\> Elektrik \(Electricity\) \-\> *CK Akdeniz Elektrik*

    2\. Enter your *subscriber number*

    3\. You will see the amount and can pay

    ⚠️ If the invoice has not yet been issued, the application will display an error.


    🪙 *Cash or card*

    \- In the Turkcell branch with a small commission [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- At the PTT post office, [Nearest post office](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- In any office of CK Akdeniz Elektrik, [Nearest office](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Water*


    ℹ️ *Subscriber number* is issued upon connection, it is also indicated on the payment card\.


    *Payment term:*

    ℹ️ Invoice is issued at the end of the month

    ⏳ Payment must be made within 10 days after the invoice is issued\.


    *How to find out your water bill:*

    \- In the Turkish Internet bank when paying

    \- The payment slip that arrives at the address is placed in a box on the wall on the first floor

    \- Online on the website [ASAT](https://online.asat.gov.tr/webportal/index.php)\. Click HIZLI ÖDEME


    *Payment:*


    💳 *Online in Turkish Internet Banking*

    1\. Fatura \(Bill Payment\) \-\> Su \(Water\) \-\> *Antalya Su \(ASAT\)*

    2\. Enter your *subscriber number* \(Add a few zeros to the left of the number\)

    3\. You will see the amount and can pay

    ⚠️ If the invoice has not yet been issued, the application will display an error.


    🪙 *Cash or card*

    \- In the Turkcell branch with a small commission [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- At the PTT post office, [Nearest post office](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- At [ASAT Head Office](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱 Mobile phone and Internet 🌎*


    💳 *Online in the application or on your operator’s website*

    \- For your phone you need to select a package for the next month

    \- You can simply top up your balance and later pay for packages from it

    \- For the Internet you need to pay the bill for the previous month


    🪙 *Cash or card*

    \- In the Turkcell branch with a small commission [Nearest 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Nearest 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- In any office of your telecom operator'
