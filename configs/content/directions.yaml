version: "1.0"

screens:
  - id: "DIRECTIONS"
    text: "*Что рядом?*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "markets"
              text: "🛒 Магазины продуктов"
              type: "callback"
              callback: "MARKETS_BUTTON"
            - id: "shops"
              text: "🏪 Магазины"
              type: "callback"
              callback: "SHOPS_BUTTON"
            - id: "shopping_centers"
              text: "🏬 ТЦ"
              type: "callback"
              callback: "SHOPPING_CENTERS_BUTTON"
        - buttons:
            - id: "print_photo"
              text: "🖨 Печать и фото"
              type: "callback"
              callback: "PRINT_AND_PHOTO_BUTTON"
        - buttons:
            - id: "barber"
              text: "💈 Барбершоп"
              type: "callback"
              callback: "BARBER_BUTTON"
        - buttons:
            - id: "tax_office"
              text: "🏛 Налоговая"
              type: "callback"
              callback: "TAX_OFFICE_BUTTON"
            - id: "post_office"
              text: "📮 Почта"
              type: "callback"
              callback: "POST_OFFICE_BUTTON"
        - buttons:
            - id: "city_hall"
              text: "🏛 Мэрия"
              type: "callback"
              callback: "CITY_HALL_BUTTON"
            - id: "population_office"
              text: "👥 ЗАГС"
              type: "callback"
              callback: "POPULATION_OFFICE_BUTTON"
            - id: "migration_office"
              text: "🛂 Миграция"
              type: "callback"
              callback: "MIGRATION_OFFICE_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
              type: "callback"
              callback: "MAIN_MENU_BUTTON"
    navigation:
      - callback: "MARKETS_BUTTON"
        target: "MARKETS"
      - callback: "SHOPS_BUTTON"
        target: "SHOPS"
      - callback: "SHOPPING_CENTERS_BUTTON"
        target: "SHOPPING_CENTERS"
      - callback: "PRINT_AND_PHOTO_BUTTON"
        target: "PRINT_AND_PHOTO"
      - callback: "BARBER_BUTTON"
        target: "BARBER"
