- id: EDEVLET
  text: '*🧧Edevlet*


    ℹ️ Site Web avec une grande variété de services gouvernementaux :

    \- Obtention des certificats et déclarations

    \- Médicament gratuit

    \- Déverrouillez votre téléphone

    \- Beaucoup plus


    🌎 [Lien du site] (https://www.turkiye.gov.tr)


    ⚡️ *Comment se connecter*

    \- Obtenir un permis de séjour \(ikamet\)

    \- Avoir un numéro de téléphone turc

    \- A la poste \(PTT\), dites EDevlet

    \- Pour 20 lires, ils créeront un mot de passe pour le vol, il viendra par SMS


    📍 [Bureau de poste le plus proche] (https://goo.gl/maps/sCWvbXQSn5nhR1U48) \(2\,6 km\)'
  button_texts:
    edevlet_site: 🌐 Site Internet
    edevlet_android: 🤖Android
    edevlet_iphone: 📱iPhone
- id: TAX_NUMBER
  text: '*🪪TIN \(Numéro fiscal turc\)*


    ℹ️ *A quoi ça sert ?*

    \- Enregistrement de Dask et des utilitaires pour vous-même

    \- Permis de séjour

    \- Ouverture d''un compte bancaire


    🌎 *Se connecter*

    \- Accédez au [site Web des impôts] (https://ivd.gib.gov.tr/)

    \- Sélectionnez le bouton central du bas

    \- *Yabancılar İçin Potansiyel Vergi Kimlik Numarası*

    \- *DEMANDE DE NUMÉRO FISCAL POTENTIEL DE NON-CITOYEN*

    \- Remplissez vos coordonnées


    💸 *Récupérez-le auprès du bureau des impôts*

    \- Parfois, le système en ligne écrit une erreur et vous devez vous rendre au bureau des impôts

    \- Bureau des impôts [Antalya Vergi Dairesi] (https://goo.gl/maps/qtCJEGf4cYfD1QXR6)'
- id: ADDRESS_NUMARATAJ
  text: '*🔖 Numarataj \(Numarataj\)*


    ℹ️ *Certificat confirmant l''adresse*

    \- Obligatoire pour l''inscription

    \- Obligatoire pour obtenir un titre de séjour


    💼 *Emportez avec vous :*

    1\. Passeport

    2\. Tapou

    3\. Contrat de location

    4\. Copies de ces documents


    ℹ️ *Instructions pour la réception :*

    1\. À [Kepez Belediye] (https://goo.gl/maps/Fb68nczEehmjzf4K9), faites des copies des documents

    2\. Allez au 2ème étage, suivez les panneaux Numarataj et entrez dans le couloir du bloc D

    3\. Prends un ticket, ils t''appelleront

    4\. Remettez à la personne toutes les copies des documents

    5\. Descendez au premier étage, un à un, donnez vos documents par la fenêtre, ils vous mettront des cachets

    6\. De retour au deuxième étage, ils délivreront un certificat Numaratazh

    ⚠️ Si vous êtes plusieurs, remettez alors des copies des passeports de toutes les personnes qui doivent être inscrites
    dans cette attestation


    📍 Tout se fait à [Kepez Belediye] (https://goo.gl/maps/Fb68nczEehmjzf4K9) \(3\,5 km\)

    ⚡️ Au rez-de-chaussée, vous pouvez faire des copies de documents pour 1 TL'
- id: ADDRESS_REGISTRATION
  text: '*📌Inscription*


    ℹ️ *L''inscription doit être effectuée dans les 20 jours suivant la réception d''un titre de séjour*

    \- Il n''est pas nécessaire d''emmener des enfants avec vous, il est conseillé à chacun d''être majeur

    \- Le permis de séjour ne sera pas renouvelé sans inscription


    ℹ️ L''inscription en ligne pour les étrangers n''est plus possible

    ℹ️ Les étrangers ne sont pas tenus de s''inscrire auprès de Nufus, mais dans des cas particuliers, ils peuvent vous y
    inscrire


    📌 *Inscription au Goc*


    💼 *Emportez avec vous :*

    1\. Ikamet \(permis de séjour\)

    2\. Tapu ou contrat de location

    3\. Numarataj \(Numarataj\)

    4\. Photocopies de Tapu/Traité et Numaratage

    5\. Reçu d''eau ou d''électricité à votre nom


    ⚡️ *Important :*

    \- Le reçu doit être frais, sinon ils refuseront

    \- Ils peuvent demander une copie du kymlik et du tapa du propriétaire de l''appartement


    📍 *Comment s''y rendre :*

    \- Venez à [Goc Idaresi] (https://goo.gl/maps/Q46vs5Dj9ipu32cS9)

    \- A l''entrée, dites *Adres* et montrez l''ikamet, ils vous laisseront entrer

    \- Dans le bâtiment, dites *Adres*, attendez un appel dans la pièce à gauche des fenêtres pour un rendez-vous'
