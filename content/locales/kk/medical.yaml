- id: HOSPITALS
  text: '*🏥Ауруханалар\- Hastane*


    🛡️ *Сақтандыру бойынша*


    1️⃣️ Сақтандыруға өтініш беру үшін алдымен оның қай ауруханалармен жұмыс істейтінін білу керек

    2️⃣ Сақтандыру көбінесе емдеудің барлық сомасын қамтымайды, бірақ бұл сіздің полисіңізге және сақтандыру компаниясына
    байланысты\.


    ⁉️ *Сақтандыру қай ауруханамен жұмыс істейтінін қалай білуге болады:*

    1\. [imecedestek] веб\-сайтына кіріңіз \(https://imecedestek\.com/ContractedOrganizations\)

    2\. Сақтандыру компаниясының атауын және сақтандыру түрін көрсетіңіз

    3\. Келісімшарт ұйымдарын көргіңіз келетін аумақты таңдаңыз

    4\. Мекеме түрін таңдаңыз

    5\. *Ara / Search* түймесін басыңыз\.


    ⭐️ Осылайша сіз сақтандыруы бар ауруханалар мен басқа медициналық мекемелердің тізімін аласыз\.


    ❤️‍🩹 *Сақтандырусыз*


    \- Сақтандыру тізімінен емес, ауруханалар мен жеке клиникаларға бара аласыз\.

    \- Бұл жағдайда сіздің сақтандыруыңыз емделудің аз ғана бөлігін қамтуы мүмкін\. \(Бұл туралы оның сипаттамасы мен сақтандыру
    шарттарында оқыңыз\)

    \- Егер сізде сақтандыру болмаса, онда айтарлықтай үлкен соманы дайындауға дайын болыңыз\.


    📍 *Hastane*\ түрік сөзін пайдаланып картадан ауруханаларды іздеңіз\.'
  button_texts:
    hospitals_insurance_site: 🌎 {{button_hospital_search}}
- id: POLYCLINIC
  text: '*🧑‍⚕️ Тегін дәрі*


    💫 Түркияда сіз *негізгі медициналық көмекті тегін* ала аласыз\.

    \- Ол үшін тұруға ықтиярхат алғаннан кейін жанұялық дәрігерге жазылу керек\.


    🆓️ *Не береді:*

    \- Отбасылық дәрігеріңізден жалпы тексеруден өтуіңізге болады

    \- Негізгі сынақтардан өту

    \- Дәрі\-дәрмектерге рецепт алыңыз

    \- Өзіңізге және балаларыңызға екпе алыңыз

    \- Ауруханадағы мамандардан ұсыныстар алыңыз

    \- Барлық талдаулар мен емтихандардың тарихы e\-Nabız\ қолданбасында көрсетіледі\.

    \- Және барлық ауруханалардан, соның ішінде жекеменшіктерден\.


    💼 *Сізге не қажет:*

    \- Түрік телефон нөмірі

    \- e\-Девлет \(пошта бөлімшесінде жасалды\)

    \- Мекенжайыңыз бойынша тіркелу


    🌎 *Қалай бекіту керек:*

    1\. [enabiz веб\-сайтында] тіркелу\(https://enabiz\.gov\.tr/\)

    2\. *Отбасылық дәрігеріңізді өзгерту* функциясын таңдаңыз\.

    3\. Қаланы, ауданды таңдаңыз

    4\. Қолжетімді отбасылық емханалар мен мамандардың тізімі ашылады\.

    \- Қызыл түспен белгіленген дәрігерді таңдау мүмкін емес

    \- Жасыл түспен белгіленген дәрігерлер әлдеқайда еркін

    \- Дәрігерді 5\-тен 21\-ге ауыстыру сол күні өтеді\. 22\-ден 4\-ке дейін өтініштер 5\-ші күні өңделеді\.


    ⚡️*Қосымша:*

    \- [MHRS веб\-сайтында] \(https://www\.mhrs\.gov\.tr/\) тіркеліңіз \(дәрігердің қабылдауына жазылу веб\-сайты\)


    ⭐ Енді сіз e\-Nabız веб\-сайты мен қосымшасы арқылы *Дәрігердің қабылдауына жазыла аласыз / Қабылдау / Randevu*'
