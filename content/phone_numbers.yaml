version: '1.0'
screens:
- id: PHONE_NUMBERS
  parse_mode: MarkdownV2
  inline_keyboard:
    rows:
    - buttons:
      - id: ekpa_management
        type: callback
        callback: EKPA_MANAGEMENT_BUTTON
    - buttons:
      - id: emergency
        type: callback
        callback: EMERJENCY_BUTTON
      - id: other_phones
        type: callback
        callback: OTHER_PHONES_BUTTON
    - buttons:
      - id: embassy
        type: callback
        callback: EMBASSY_BUTTON
  navigation:
  - callback: EKPA_MANAGEMENT_BUTTON
    target: EKPA_MANAGEMENT
  - callback: EMERJENCY_BUTTON
    target: EMERGENCY
  - callback: EMBASSY_BUTTON
    target: EMBASSY
  - callback: OTHER_PHONES_BUTTON
    target: OTHER_PHONES
- id: EKPA_MANAGEMENT
  parse_mode: MarkdownV2
- id: EMERGENCY
  parse_mode: MarkdownV2
- id: EMBASSY
  parse_mode: MarkdownV2
  inline_keyboard:
    rows:
    - buttons:
      - id: russia_embassy
        type: callback
        callback: RUSSIA_EMBASSY_BUTTON
    - buttons:
      - id: ukraine_embassy
        type: callback
        callback: UKRAINE_EMBASSY_BUTTON
    - buttons:
      - id: kazakhstan_embassy
        type: callback
        callback: KAZAKHSTAN_EMBASSY_BUTTON
    - buttons:
      - id: belarus_embassy
        type: callback
        callback: BELARUS_EMBASSY_BUTTON
  navigation:
  - callback: RUSSIA_EMBASSY_BUTTON
    target: RUSSIA_EMBASSY
  - callback: UKRAINE_EMBASSY_BUTTON
    target: UKRAINE_EMBASSY
  - callback: KAZAKHSTAN_EMBASSY_BUTTON
    target: KAZAKHSTAN_EMBASSY
  - callback: BELARUS_EMBASSY_BUTTON
    target: BELARUS_EMBASSY
- id: RUSSIA_EMBASSY
  parse_mode: html
  disable_web_preview: true
- id: UKRAINE_EMBASSY
  parse_mode: html
  disable_web_preview: true
- id: KAZAKHSTAN_EMBASSY
  parse_mode: html
  disable_web_preview: true
- id: BELARUS_EMBASSY
  parse_mode: html
  disable_web_preview: true
- id: OTHER_PHONES
  parse_mode: MarkdownV2
