- id: AMBULANCE
  text: '*🚑 Ambulans*


    ☎️`112`


    ℹ️ *Sadece son çare olarak ambulans çağırın\.*

    Türkiye''de ambulans çağırmak oldukça pahalıya mal olabilir.

    Ambulans çağırırken İngilizce deyin, İngilizce operatöre geçmelisiniz\.


    😷️ *Yabancılar için yardım hattı*


    ☎️`+90 850 288 38 38`


    ℹ️ *Yardım Hattında tüm diller konuşulmaktadır*

    Ambulans çağırma dahil tüm tıbbi konularda yardımcı oluyorlar\.'
