      text: "*\U0001F691 Скорая помощь*\n\n\U0001F4DE Номер: `112`\n\n\U0001F3E5 Ближайшая больница:\n\U0001F4CD [Kepez Devlet Hastanesi](https://goo\\.gl/maps/b5cnrK2H4apXkqWw9)\n\n⚠️ При звонке в скорую, сообщите адрес четко\n"
