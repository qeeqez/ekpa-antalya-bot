      Бесплатное обслуживание по страховке SGK
      
      📍 Ближайшая поликлиника:
      Расположение на карте
      
      📱 Запись через приложение:
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
