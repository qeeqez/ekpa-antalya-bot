  text: '*🛴 Скутерлер*


    ℹ️ *Анталияда скутерді жалға алу қызметтері:*

    \- *БинБин* \(біздің кешеннің жанында жүріңіз\)

    \- *Марти*

    \- *Хоп*

    \- *Сәуле*

    \- *Хоп*

    \- *Гез*

    \- *Торнет*


    ℹ️ Велосипедтерді жалға беру қызметі *Antbis* жағалауда жұмыс істейді'
