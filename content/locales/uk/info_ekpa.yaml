- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Страхування від землетрусу Dask*


    ℹ️ *Інформація:*

    \- Обов''язково відкрити рахунок на воду та світло\.

    \- Перш ніж перейти до Asat або CK Akdeniz Elektrik, ви *повинні мати Dask*\.

    \- Ви не можете зробити це в Dask Bank\.

    \- Ви можете зробити це в будь\-якій страховій компанії або в Nkolay за посиланням нижче\.


    💼 *Візьми з собою:*

    1\. Тапу або договір оренди

    2\. Паспорт або Ікамет

    3\. Турецький податковий номер \(самого номера достатньо\)

    4\. Повна адреса / Tell Ekpa


    📍 *Замовляйте Dask у [Nkolay](https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Електрика*


    💼 *Візьми з собою:*

    1\. *Тапу* або *договір оренди*

    2\. *Паспорт* або *Ікамет*

    3\. Турецький *податковий номер* \(самого номера достатньо\)

    4\. Страхування від землетрусу *Dask*

    5\. *Гроші* на депозит \(повертаються при відключенні\)


    📍 *Ви можете підключитися лише в [головний офіс CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    🧑‍💼*Повідомити в КК:*

    Номер корпусу та квартири, а також абонентський номер на електроенергію\.


    ℹ️ Світло в квартирі з''явиться протягом 1 робочого дня\.

    ℹ️Якщо є проблеми з електрикою\- повідомляйте в КУпАП\.


    ⚠️ Електрощиток знаходиться в шафі\.

    ⚠️ Електричний лічильник знаходиться в підвалі за закритими дверима\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Вода*


    💼 *Візьми з собою:*

    1\. *Тапу* або *договір оренди*

    2\. *Паспорт* або *Ікамет*

    3\. Турецький *податковий номер* \(самого номера достатньо\)

    4\. Страхування від землетрусу *Dask*

    5\. *Гроші* на депозит \(повертаються при відключенні\)


    📍 *Підключіть воду до [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*Повідомити в КК:*

    Номер блоку та квартири, а також абонентський номер на воду\.


    ℹ️ Протягом 3 робочих днів вода з''явиться в квартирі\.

    ℹ️Якщо у вас проблеми з водою чи тиском у кранах\- повідомляйте в КУпАП\.


    ⚠️В квартирі є кран для перекриття води\.

    \- На 1\+1 подивіться під раковину\.

    \- У 2\+1 знаходиться в душі\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎 Інтернет*


    ℹ️ *Для підключення до Інтернету потрібна посвідка на проживання \(ikamet\)*


    ℹ️ *Домашній Інтернет в Туреччині за договором*

    \- Контракт укладається на рік\-два роки

    \- У разі дострокового розірвання договору сплачується пеня

    \- Оплата здійснюється щомісячно


    🌐 *Інтернет оператори*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ Для підключення необхідно звернутись до офісу оператора з ікаметом\. Ціна така ж, як на сайті оператора\.

    ⚠️ Офіс може не знайти нашу адресу в системі, рекомендуємо звертатися в найближчі до комплексу офіси\.


    🏴‍☠️ *Підключення без прописки*

    \- Щоб підключитися без прописки, потрібно знайти людину, яка влаштує собі інтернет\.

    \- Зазвичай це дорожче, багато «помічників» беруть гроші за таку послугу\.

    \- Помічника можна знайти через свого ріелтора або через офіси інтернет\-операторів\.


    ⚡️ *Альтернативні методи*

    \- Поділіться Інтернетом зі свого телефону

    \- Зверніться по допомогу до сусідів, поділіться Wi\-Fi'
- id: HOW_TO_DISCONNECT
  text: '*⛔️ Як вимкнути?*'
  button_texts:
    disconnect_electricity: ⚡️ Електрика
    disconnect_water: 💧 Вода
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Електрика*


    💰 При відключенні повертається депозит, сплачений при підключенні, за вирахуванням залишку на оплату


    🌎 *Вимкнути онлайн*

    \- Увійти в Edevlet

    \- Перейти на сторінку [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- Або введіть у пошук `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu`

    \- Натисніть *"Нова заявка" \(Yeni Başvuru\)*, виберіть обліковий запис і заповніть свої дані

    \- Заповніть IBAN, на який будуть перераховані гроші

    ⚠️ *Ви можете відключитися онлайн, лише якщо ви підключилися до Ikamet*


    📍 *Вимкніть електрику офлайн у [головному офісі CK Akdeniz Elektrik](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *Візьми з собою:*

    1\. *Номер абонента* \(швидше знайдеться в системі\)

    2\. *Паспорт* або *Ікамет*

    3\. *IBAN*, на який будуть перераховані гроші


    ℹ️ Протягом 24 годин квартира втрачає електроенергію\.

    ℹ️ Гроші будуть зараховані на турецький рахунок тільки після відключення, протягом 7\-30 днів\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Вода*


    💰 При відключенні повертається депозит, сплачений при підключенні, за вирахуванням залишку на оплату


    🌎 *Вимкнути онлайн*

    \- Увійти в Edevlet

    \- Перейти на сторінку [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- Або введіть у пошук `ASAT Abonelik Sözleşme Feshi Başvurusu`

    \- Натисніть *"Нова заявка" \(Yeni Başvuru\)*, виберіть обліковий запис і заповніть свої дані

    \- Заповніть IBAN, на який будуть перераховані гроші

    ⚠️ *Ви можете відключитися онлайн, лише якщо ви підключилися до Ikamet*


    📍 *Вимкнути офлайн воду в [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Візьми з собою:*

    1\. *Номер абонента* \(швидше знайдеться в системі\)

    2\. *Паспорт* або *Ікамет*

    3\. *IBAN*, на який будуть перераховані гроші


    ℹ️ Протягом 3 робочих днів вода в квартирі зникне\.

    ℹ️ Гроші будуть зараховані на турецький рахунок тільки після відключення, протягом 7\-30 днів\.'
