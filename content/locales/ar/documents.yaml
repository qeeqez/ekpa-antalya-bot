- id: EDEVLET
  text: '*🧧إدفليت*


    ℹ️ موقع إلكتروني يقدم مجموعة واسعة من الخدمات الحكومية:

    \- الحصول على الشهادات والكشوفات

    \- دواء مجاني

    \- فتح هاتفك

    \- أكثر من ذلك بكثير


    🌎 [رابط الموقع](https://www.turkiye.gov.tr)


    ⚡️ *كيفية الاتصال*

    \- الحصول على تصريح الإقامة \(ikamet\)

    \- لديك رقم هاتف تركي

    \- في مكتب البريد \(PTT\)، قل EDevlet

    \- بـ 20 ليرة هيعملوا كلمة سر للرحلة بتيجي عن طريق الرسائل القصيرة


    📍[أقرب مكتب بريد](https://goo.gl/maps/sCWvbXQSn5nhR1U48) \(2\.6 كم\)'
  button_texts:
    edevlet_site: 🌐 موقع الكتروني
    edevlet_android: 🤖Android
    edevlet_iphone: 📱 ايفون
- id: TAX_NUMBER
  text: '*🪪TIN \(الرقم الضريبي التركي\)*


    ℹ️ *ما الغرض منه؟*

    \- تسجيل الدسك والمرافق لنفسك

    \- تصريح الإقامة

    \- فتح حساب بنكي


    🌎 *الاتصال بالإنترنت*

    \- انتقل إلى [موقع الضرائب](https://ivd.gib.gov.tr/)

    \- حدد الزر السفلي المركزي

    \- *Yabancılar ıçin Potansiyel Vergi Kimlik Numarası*

    \- *طلب الحصول على الرقم الضريبي المحتمل لغير المواطنين*

    \- املأ التفاصيل الخاصة بك


    💸 *احصل عليها من مكتب الضرائب*

    \- في بعض الأحيان يكتب النظام الإلكتروني خطأ ويجب عليك الذهاب إلى مكتب الضرائب

    \- مكتب الضرائب [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)'
- id: ADDRESS_NUMARATAJ
  text: '*🔖نوماراتاج\(نوماراتاج\)*


    ℹ️ *عنوان تأكيد الشهادة*

    \- مطلوب للتسجيل

    \- يشترط الحصول على تصريح الإقامة


    💼 *خذ معك:*

    1\. جواز السفر

    2\. تابو

    3\. اتفاقية الإيجار

    4\. نسخ من هذه الوثائق


    ℹ️ *تعليمات الاستلام:*

    1\. في [Kepez Belediye](https://goo.gl/maps/Fb68nczEehmjzf4K9) قم بعمل نسخ من المستندات

    2\. اذهب إلى الطابق الثاني، واتبع لافتات نوماراتاج وادخل ممر المبنى D

    3\. خذ تذكرة، وسوف يتصلون بك

    4\. أعط الشخص جميع نسخ المستندات

    5\. انزل إلى الطابق الأول، واحدًا تلو الآخر، وأخرج مستنداتك من النافذة، وسوف يضعون عليك الطوابع

    6\. العودة إلى الطابق الثاني، سوف يصدرون شهادة Numaratazh

    ⚠️ إذا كان هناك العديد منكم، فقم بإعطاء نسخ من جوازات السفر لكل من يجب أن يتم تسجيله في هذه الشهادة


    📍 كل شيء يتم في [كبيز بيليدية](https://goo.gl/maps/Fb68nczEehmjzf4K9) \(3\.5 كم\)

    ⚡️ في الطابق الأرضي يمكنك عمل نسخ من المستندات مقابل 1 ليرة تركية'
- id: ADDRESS_REGISTRATION
  text: '*📌التسجيل*


    ℹ️ *يجب أن يتم التسجيل خلال 20 يومًا بعد الحصول على تصريح الإقامة*

    \- ليس من الضروري اصطحاب الأطفال معك، فمن المستحسن أن يكون الجميع بالغين

    \- لن يتم تجديد تصريح الإقامة دون التسجيل


    ℹ️ التسجيل عبر الإنترنت للأجانب لم يعد ممكنا

    ℹ️ لا يشترط على الأجانب التسجيل في نفوس، لكن في حالات خاصة يمكنهم تسجيلك هناك


    📌 *التسجيل في Goc*


    💼 *خذ معك:*

    1\. إيكامت \(تصريح الإقامة\)

    2\. الطابو أو عقد الإيجار

    3\. نوماراتاج \(نوماراتاج\)

    4\. نسخ من الطابو/المعاهدة والرقم

    5\. إيصال الماء أو الكهرباء بإسمك


    ⚡️ *هام:*

    \- يجب أن يكون الإيصال جديدا، وإلا فسوف يرفضون

    \- يجوز لهم طلب نسخة من الكيمليك والتابا الخاصين بمالك الشقة


    📍 *كيفية الوصول إلى هناك:*

    \- تعال إلى [Goc Idaresi](https://goo.gl/maps/Q46vs5Dj9ipu32cS9)

    \- عند المدخل قل *أدريس* وأظهر الإيكاميت، وسيسمحون لك بالدخول

    \- في المبنى، قل *Adres*، انتظر اتصالاً بالغرفة الموجودة على يسار النوافذ للمقابلة'
