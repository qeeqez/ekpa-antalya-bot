- id: HOW_TO_CONNECT_DASK
  text: '*🛡️Dask Earthquake Insurance*


    ℹ️ *Information:*

    \- Required to open an account for water and electricity\.

    \- Before going to Asat or CK Akdeniz Elektrik you *should already have Dask*\.

    \- You can’t do it in Dask Bank\.

    \- You can do this at any insurance company or at Nkolay using the link below\.


    💼 *Take with you:*

    1\. Tapu or lease agreement

    2\. Passport or Ikamet

    3\. Turkish Tax Number \(The number itself is enough\)

    4\. Full address / Tell Ekpa


    📍 *Order Dask in [Nkolay](https://goo.gl/maps/nyumU39FQYJTnFZt9)*'
- id: HOW_TO_CONNECT_ELECTRICITY
  text: '*⚡️Electricity*


    💼 *Take with you:*

    1\. *Tapu* or *lease agreement*

    2\. *Passport* or *Ikamet*

    3\. Turkish *tax number* \(The number itself is enough\)

    4\. Earthquake insurance *Dask*

    5\. *Money* for deposit \(Returned upon disconnection\)


    📍 *You can connect only at [CK Akdeniz Elektrik head office](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    🧑‍💼*Report to the Criminal Code:*

    Block and apartment number, as well as subscriber number for electricity\.


    ℹ️ Light will appear in the apartment within 1 working day\.

    ℹ️ If there are problems with electricity\- notify the Criminal Code\.


    ⚠️ The electrical panel is in the closet\.

    ⚠️ The electric meter is located in the basement behind a closed door\.'
- id: HOW_TO_CONNECT_WATER
  text: '*💧Water*


    💼 *Take with you:*

    1\. *Tapu* or *lease agreement*

    2\. *Passport* or *Ikamet*

    3\. Turkish *tax number* \(The number itself is enough\)

    4\. Earthquake insurance *Dask*

    5\. *Money* for deposit \(Returned upon disconnection\)


    📍 *Connect water to [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    🧑‍💼*Report to the Criminal Code:*

    Block and apartment number, as well as subscriber number for water\.


    ℹ️ Within 3 working days, water will appear in the apartment\.

    ℹ️ If you have problems with water or pressure in the taps\- notify the Criminal Code\.


    ⚠️ The apartment has a valve to shut off the water\.

    \- At 1\+1, look under the sink\.

    \- In 2\+1 is in the soul\.'
- id: HOW_TO_CONNECT_INTERNET
  text: '*🌎 Internet*


    ℹ️ *To connect to the Internet you need a residence permit \(ikamet\)*


    ℹ️ *Home Internet in Turkey under contract*

    \- The contract is for a year or two years

    \- In case of early termination of the contract, a penalty is paid

    \- Payment is made monthly


    🌐 *Internet operators*

    \- [Turk Telekom](https://turktelekom.com.tr/)

    \- [Turkcell Superonline](https://www.superonline.net/)

    \- [Turksat Kablo](https://www.fiberkablonet.com/)


    ℹ️ To connect, you need to contact the operator’s office with an ikamet\. The price is the same as on the operator''s
    website\.

    ⚠️ The office may not find our address in the system, we recommend contacting the offices closest to the complex\.


    🏴‍☠️ *Connect without a residence permit*

    \- To connect without a residence permit, you need to find a person who will arrange the Internet for themselves\.

    \- This is usually more expensive, many “helpers” charge money for such a service\.

    \- A helper can be found through your realtor or through the offices of Internet operators\.


    ⚡️ *Alternative methods*

    \- Share Internet from your phone

    \- Ask your neighbors for help, share Wi-Fi'
- id: HOW_TO_DISCONNECT
  text: '*⛔️ How to disable?*'
  button_texts:
    disconnect_electricity: ⚡️ Electricity
    disconnect_water: 💧 Water
- id: HOW_TO_DISCONNECT_ELECTRICITY
  text: '*⚡️Electricity*


    💰 If you disconnect, the deposit that was paid upon connection is returned, minus the balance for payment


    🌎 *Disable online*

    \- Login to Edevlet

    \- Go to the page [Ck Akdeniz Feshi Başvurusu](https://www.turkiye.gov.tr/ck-akdeniz-elektrik-perakende-satis-bireysel-abonelik-fesih-basvurusu)

    \- Or type in the search `Ck Akdeniz Bireysel Abonelik Fesih Başvurusu`

    \- Click *"New Application" \(Yeni Başvuru\)*, select an account and fill in your details

    \- Fill in the IBAN to which the money will be transferred

    ⚠️ *You can disconnect online only if you connected to Ikamet*


    📍 *Turn off the electricity offline at [CK Akdeniz Elektrik head office](https://goo.gl/maps/vSsz3eKUWZ7VYqqy9)*


    💼 *Take with you:*

    1\. *Subscriber number* \(it will be found faster in the system\)

    2\. *Passport* or *Ikamet*

    3\. *IBAN* to which the money will be transferred


    ℹ️ Within 24 hours, the apartment will lose electricity\.

    ℹ️ Money will be credited to the Turkish account only after disconnection, within 7\-30 days\.'
- id: HOW_TO_DISCONNECT_WATER
  text: '*💧Water*


    💰 If you disconnect, the deposit that was paid upon connection is returned, minus the balance for payment


    🌎 *Disable online*

    \- Login to Edevlet

    \- Go to the page [ASAT Feshi Başvurusu](https://www.turkiye.gov.tr/antalya-su-kanalizasyon-abonelik-sozlesme-feshi-basvurusu)

    \- Or type in search `ASAT Abonelik Sözleşme Feshi Başvurusu`

    \- Click *"New Application" \(Yeni Başvuru\)*, select an account and fill in your details

    \- Fill in the IBAN to which the money will be transferred

    ⚠️ *You can disconnect online only if you connected to Ikamet*


    📍 *Turn offline water in [ASAT](https://goo.gl/maps/PMfUJd315NtC9dur6)*


    💼 *Take with you:*

    1\. *Subscriber number* \(it will be found faster in the system\)

    2\. *Passport* or *Ikamet*

    3\. *IBAN* to which the money will be transferred


    ℹ️ Within 3 working days, the water in the apartment will disappear\.

    ℹ️ Money will be credited to the Turkish account only after disconnection, within 7\-30 days\.'
