- id: AMBULANCE
  text: '*🚑 Швидка допомога*


    ☎️ `112`


    ℹ️ *Швидку допомогу викликайте лише в крайньому випадку\.*

    У Туреччині виклик швидкої може обійтися в копієчку.

    Викликаючи швидку допомогу, скажімо англійською, необхідно переключитися на англійського оператора\.


    😷️ *Гаряча лінія для іноземців*


    ☎️ `+90 850 288 38 38`


    ℹ️ *Гаряча лінія розмовляє всіма мовами*

    Допомагають з усіма медичними питаннями, включно з викликом швидкої\.'
