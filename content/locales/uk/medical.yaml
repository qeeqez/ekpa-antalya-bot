- id: MEDICINE
  text: '*💊 Турецькі ліки*


    *Пероксид водню:*

    Оксієнлі Су


    * Біль у горлі: *

    Тантум Верде\- спрей

    Стрепсілс\- льодяники


    *Кашель:*

    Вологі: Ацетилцистеїн 600 мг \- 1 раз на добу вранці \(при гастриті \- після їжі або після омепразолу\)

    Сухий: є багато сиропів від сухого кашлю на травах \(наприклад Фітоспан\)


    *Нежить:*

    Набір для промивання пазух \- промивання носа морською водою \(тип Дельфін\)

    Насовін \- судинозвужувальний спрей \(Ксилометазолін\)

    Ризонел, 0,05% \- при алергічному риніті, при тривалому застосуванні судинозвужувальних засобів\. Знімає набряклість носа,
    зменшує виділення \(аналог назонексу\), по 2 дози в кожну ніздрю 2 рази на день 2 тижні, потім по 1 дозі 2 рази на день
    2 тижні, потім \. По 1 дозі 1 раз на добу протягом 2 тижнів\.


    *Від болю:*

    Німес 100 мг \(Німесулід\) \- найз

    Бруфен 400 мг \(Ібупрофен\) \- ібупрофен

    Панадол \ - парацетамол

    Профенід жель \- Фастум гель

    Artril\- знеболюючий гель для втирання в шкіру в області суглоба

    Тилохот \- терафлю


    *Для живота:*

    Бускопан \- спазмолітик при черевних коліках \(ношпа\)

    Рефлор \- при тривалій діареї \(наприклад, при прийомі антибіотиків\)

    Лінекс \- теж там

    Ентеросгель \(Enterosgel\)\ - сорбент у формі гелю

    Eucabon - місцеве вугілля

    Омепразол \- омепразол


    *При запорах:*

    Дюфалак \(Дюфалак\)


    *Нудота:*

    Метпамід \(тип Мотиліум\)


    *Алергія:*

    Еріус \(Еріус\)

    Цетрин \(Цетрин\)

    Фенистил гель \- від шкірної алергії та укусів проти свербіння


    *Герпес:*

    Зовіракс \(крем, як і в Росії\)

    Бепантен \- Бепантен \(опіки, тріщини\)


    *Очі:*

    VİSİNE \(Vizin\) \- з безрецептурного продажу, при свербінні, сухості очей


    *Вуха:*

    Отипакс \- краплі з лідокаїном, знімають біль, знімають запалення, відпускаються без рецепта'
