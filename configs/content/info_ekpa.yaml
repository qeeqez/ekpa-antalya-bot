      *🏢 Офис управления комплексом*
      
      📍 Расположение: на территории комплекса
      
      📞 Телефон: \+90 XXX XXX XX XX
      
      🌐 Сайт: ekpa1207\.com
    parse_mode: "MarkdownV2"
    disable_web_preview: true
    inline_keyboard:
      rows:
        - buttons:
            - id: "management_office_site"
              text: "🌐 Сайт управления"
              type: "url"
              url: "https://ekpa1207.com"
        - buttons:
            - id: "management_office_complex"
              text: "🏘 Офис в комплексе"
              type: "callback"
              callback: "MANAGEMENT_OFFICE_IN_COMPLEX_BUTTON"
        - buttons:
            - id: "info_ekpa"
              text: "🏘 Инфо по EKPA"
              type: "callback"
              callback: "INFO_EKPA_BUTTON"
        - buttons:
            - id: "main_menu"
              text: "🏠 В главное меню"
