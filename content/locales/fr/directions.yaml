- id: POPULATION_OFFICE
  text: '*🧑‍💼 Nufus \(Ministère de l''Enregistrement de la Population\)*


    ℹ️ Dans cette institution, le Tapa est délivré, les citoyens turcs sont enregistrés, les nouveau\-nés sont enregistrés
    et d''autres problèmes de population sont résolus\.

    ⚠️ Les étrangers doivent s''inscrire auprès de Goc, pas de Nufus\.


    📍 [Kepez Nufus](https://goo.gl/maps/1u4SiTYfYBVbRNFs8) \(3\,5 km\)'
- id: MIGRATION_OFFICE
  text: '*👮 Goc Idaresi \(Département des migrations d''Antalya\)*


    1️⃣ Ici, vous devez vous inscrire\.

    2️⃣ Ici a lieu le rendez\-vous \(demande de titre de séjour\) et toutes les questions liées au titre de séjour\ sont résolues\.

    3️⃣ Ceux qui ne l''ont pas encore fait pourront être convoqués ici pour une prise d''empreintes digitales\.


    📍 [Goc Idaresi](https://goo.gl/maps/Q46vs5Dj9ipu32cS9) \(8\,1 km\)'
