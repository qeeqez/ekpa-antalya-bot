  text: '*📝 {{button_important_documents}}*'
  button_texts:
    check_application_status: ✅ Перевірте статус вашої заяви на дозвіл на проживання
    get_id_number: 🆔 Дізнайтеся номер посвідки на проживання
    tax_number: 🪪 ІНН
    edevlet: 🧧Едевлет
    address_numarataj: 🔖 Numaratage
    address_registration: 📌 Реєстрація
- id: EDEVLET
  text: '*🧧Edevlet*


    ℹ️ Веб\-сайт із широким спектром державних послуг:

    \- Отримання довідок та виписок

    \- Безкоштовні ліки

    \- Розблокуйте телефон

    \- Набагато більше


    🌎 [Посилання на сайт](https://www.turkiye.gov.tr)


    ⚡️ *Як підключитися*

    \- Отримати вид на проживання \(ікамет\)

    \- Мати турецький номер телефону

    \- На пошті \(PTT\), скажіть EDevlet

    \- За 20 лір зроблять пароль на рейс, він прийде через смс


    📍 [Найближче поштове відділення](https://goo.gl/maps/sCWvbXQSn5nhR1U48) \(2\,6 км\)'
  button_texts:
    edevlet_site: 🌐 Веб-сайт
    edevlet_android: 🤖Android
    edevlet_iphone: 📱 iPhone
- id: TAX_NUMBER
  text: '*🪪ІПН \(Турецький податковий номер\)*


    ℹ️ *Для чого це?*

    \- Реєстрація Dask і утиліт на себе

    \- ВНЖ

    \- Відкриття рахунку в банку


    🌎 *Вийти в Інтернет*

    \- Перейдіть на [сайт податкової служби](https://ivd.gib.gov.tr/)

    \- Виберіть центральну нижню кнопку

    \- *Yabancılar İçin Potansiyel Vergi Kimlik Numarası*

    \- *ЗАЯВА НА ПОТЕНЦІЙНИЙ ПОДАТКОВИЙ НОМЕР НЕГРОМАДЯНИНА*

    \- Заповніть свої дані


    💸 *Отримати в податковій*

    \- Буває, що онлайн система пише помилку і треба йти до податкової

    \- Податкова служба [Antalya Vergi Dairesi](https://goo.gl/maps/qtCJEGf4cYfD1QXR6)'
- id: ADDRESS_NUMARATAJ
  text: '*🔖 Нумаратаж \(Numarataj\)*


    ℹ️ *Сертифікат, що підтверджує адресу*

    \- Необхідно для реєстрації

    \- Потрібна для отримання посвідки на проживання


    💼 *Візьми з собою:*

    1\. Паспорт

    2\. Тапу

    3\. Договір оренди

    4\. Копії цих документів


    ℹ️ *Інструкція щодо отримання:*

    1\. У [Kepez Belediye](https://goo.gl/maps/Fb68nczEehmjzf4K9) зробіть копії документів

    2\. Підніміться на 2\-й поверх, дотримуйтесь вказівників Numarataj і увійдіть у коридор блоку D

    3\. Візьміть квиток, вам подзвонять

    4\. Надайте особі всі копії документів

    5\. Спускайтеся на перший поверх по одному, видавайте документи у вікно, на вас поставлять штампи

    6\. Повертайтеся на другий поверх, видадуть довідку Нумаратаж

    ⚠️ Якщо вас декілька, то надайте копії паспортів усіх, хто має бути прописаний у цій довідці


    📍 Все зроблено в [Kepez Belediye](https://goo.gl/maps/Fb68nczEehmjzf4K9) \(3\,5 км\)

    ⚡️ На першому поверсі можна зробити копії документів за 1 TL'
- id: ADDRESS_REGISTRATION
  text: '*📌 Реєстрація*


    ℹ️ *Реєстрацію необхідно здійснити протягом 20 днів після отримання посвідки на проживання*

    \- Не обов''язково брати з собою дітей, бажано, щоб усі були дорослими

    \- ВНЖ без реєстрації не продовжиться


    ℹ️ Онлайн\-реєстрація для іноземців більше неможлива

    ℹ️ Іноземці не зобов’язані реєструватися в Nufus, але в особливих випадках вони можуть зареєструвати вас там


    📌 *Реєстрація в Goc*


    💼 *Візьми з собою:*

    1\. Ікамет \(прописка\)

    2\. Тапу або договір оренди

    3\. Нумаратаж \(Нумаратаж\)

    4\. Фотокопії Тапу/Договір і Numaratage

    5\. Квитанція на воду або світло на ваше ім''я


    ⚡️ *Важливо:*

    \- Квитанція має бути свіжою, інакше відмовлять

    \- Вони можуть вимагати копію кімліка та тапи власника квартири


    📍 *Як доїхати:*

    \- Приходьте до [Goc Idaresi](https://goo.gl/maps/Q46vs5Dj9ipu32cS9)

    \- На вході скажи *Adres* і покажи ікамет, пустять

    \- У будівлі скажіть *Adres*, чекайте дзвінка в кімнаті ліворуч від вікон для зустрічі'
