- id: HOW_TO_PAY_AIDAT
  text: '*عايدات*


    ℹ️ رسوم الصيانة الشهرية للمجمع\.

    ⚠️ يجب عليك الدفع، حتى لو كنت لا تعيش في شقة\.


    *التكلفة:*

    ```

    1\+1\- 840 ليرة تركية

    2\+1\- 1310 ليرة تركية

    2\+1\- 1590 ليرة تركية \(مطبخ منفصل\)

    3\+1\- 1970 ليرة تركية

    ```

    *مدة الدفع:*

    ⏳ حتى الخامس من كل شهر


    *الدفع:*

    🪙 نقدا أو بالبطاقة في مكتب شركة الإدارة


    💳 التحويل عبر الإنترنت من بطاقة بنكية تركية إلى الحساب:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *اسم المستلم ووصف الدفع*

    🧑`EKPA 1207 SITESI YONETIMI''

    ℹ️ `عيدات إيكبا 1207` شقة شهرية


    ⚠️ تأكد من الإشارة إلى أرقام المبنى والشقة والشهر الذي تدفع مقابله'
- id: HOW_TO_PAY_CONDITIONER
  text: '*تكييف الهواء*


    ℹ️ نظام التكييف المركزي غير مشمول في فاتورة الكهرباء\.

    ⚠️ ضع في اعتبارك أن تركيا بلد حار، والكهرباء باهظة الثمن هنا\.


    *مدة الدفع:*

    ⏳ 7 أيام من تاريخ استلام الفاتورة

    ⚠️ إذا لم يتم الدفع سيتم تعطيله\. سيظهر رمز القفل وCentralized\ على جهاز التحكم عن بعد\.


    *الدفع:*

    🪙 نقدا أو بالبطاقة في مكتب شركة الإدارة


    💳 التحويل عبر الإنترنت من بطاقة بنكية تركية إلى الحساب:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *اسم المستلم ووصف الدفع*

    🧑`EKPA 1207 SITESI YONETIMI''

    ℹ️ شقة `كليما إكبا 1207` بلوك


    ⚠️ تأكد من الإشارة إلى أرقام المبنى والشقق التي تدفع ثمنها'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*الكهرباء*


    ℹ️ التكييف غير مشمول في فاتورة الكهرباء\.


    ℹ️ *رقم المشترك* يتم إصداره عند الاتصال، كما أنه موضح على بطاقة الدفع\.


    *مدة الدفع:*

    ℹ️ الفاتورة تصدر في نهاية الشهر

    ⏳ يجب أن يتم الدفع خلال 10 أيام من تاريخ إصدار الفاتورة\.


    *كيف تعرف فاتورة الكهرباء:*

    \- في بنك الانترنت التركي عند الدفع

    \- يتم وضع قسيمة الدفع التي تصل إلى العنوان في صندوق على الحائط في الطابق الأول

    \- اونلاين على موقع [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *الدفع:*


    💳 *عبر الإنترنت في الخدمات المصرفية عبر الإنترنت التركية*

    1\. فاتورة \(دفع الفواتير\) \-\> إلكتريك \(كهرباء\) \-\> *سي كيه أكدنيز إلكتريك*

    2\. أدخل *رقم المشترك الخاص بك*

    3\. سترى المبلغ ويمكنك الدفع

    ⚠️ إذا لم يتم إصدار الفاتورة بعد، سيعرض التطبيق خطأ\.


    🪙 *نقداً أو بالبطاقة*

    \- في فرع توركسيل بعمولة صغيرة [أقرب 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7)، [أقرب 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- في مكتب بريد PTT، [أقرب مكتب بريد](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- في أي مكتب لشركة CK Akdeniz Elektrik، [أقرب مكتب](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*ماء*


    ℹ️ *رقم المشترك* يتم إصداره عند الاتصال، كما أنه موضح على بطاقة الدفع\.


    *مدة الدفع:*

    ℹ️ الفاتورة تصدر في نهاية الشهر

    ⏳ يجب أن يتم الدفع خلال 10 أيام من تاريخ إصدار الفاتورة\.


    *كيفية معرفة فاتورة المياه الخاصة بك:*

    \- في بنك الانترنت التركي عند الدفع

    \- يتم وضع قسيمة الدفع التي تصل إلى العنوان في صندوق على الحائط في الطابق الأول

    \- أونلاين على موقع [ASAT](https://online.asat.gov.tr/webportal/index.php)\. انقر فوق هيزلي أوديمي


    *الدفع:*


    💳 *عبر الإنترنت في الخدمات المصرفية عبر الإنترنت التركية*

    1\. فاتورة \(دفع الفواتير\) \-\> سو \(المياه\) \-\> *أنطاليا سو \(ASAT\)*

    2\. أدخل *رقم المشترك الخاص بك* \(أضف بضعة أصفار إلى يسار الرقم\)

    3\. سترى المبلغ ويمكنك الدفع

    ⚠️ إذا لم يتم إصدار الفاتورة بعد، سيعرض التطبيق خطأ\.


    🪙 *نقداً أو بالبطاقة*

    \- في فرع توركسيل بعمولة صغيرة [أقرب 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7)، [أقرب 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- في مكتب بريد PTT، [أقرب مكتب بريد](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- في [مكتب ASAT الرئيسي](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱الهاتف المحمول والإنترنت 🌎*


    💳 *عبر الإنترنت في التطبيق أو على موقع المشغل الخاص بك*

    \- بالنسبة لهاتفك، عليك تحديد باقة للشهر التالي

    \- يمكنك بكل بساطة تعبئة رصيدك والدفع لاحقاً مقابل الباقات منه

    \- بالنسبة للإنترنت عليك دفع فاتورة الشهر السابق


    🪙 *نقداً أو بالبطاقة*

    \- في فرع توركسيل بعمولة صغيرة [أقرب 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7)، [أقرب 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- في أي مكتب لمشغل الاتصالات الخاص بك'
- id: HOW_TO_CONNECT
  text: '*🧑‍🔧 كيفية الاتصال / إعادة التسجيل؟ ♻️*


    1️⃣ لا تختلف عملية الاتصال الأول عن إعادة التسجيل

    2️⃣ عند إعادة التسجيل، لا يحتاج الدافع السابق إلى السفر بشكل منفصل لقطع الاتصال'
