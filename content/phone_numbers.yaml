            - buttons:
                - id: belarus_embassy
                  text: "🇧🇾 Беларуси"
                  type: callback
                  callback: BELARUS_EMBASSY_BUTTON
      navigation:
        - callback: RUSSIA_EMBASSY_BUTTON
          target: RUSSIA_EMBASSY
        - callback: UKRAINE_EMBASSY_BUTTON
          target: UKRAINE_EMBASSY
        - callback: KAZAKHSTAN_EMBASSY_BUTTON
