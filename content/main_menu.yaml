version: "1.0"

commands:
  - command: "/start"
    description: "Главное меню"
    screen_id: "MAIN_MENU"
    is_pinned: true
  - command: "/menu"
    description: "Главное меню"
    screen_id: "MAIN_MENU"
  - command: "/botlink"
    description: "Ссылка на Бота"
    screen_id: "BOT_LINK"
  - command: "/ourchats"
    description: "Наши Чаты"
    screen_id: "OUR_CHATS_INFO"

screens:
  - id: "MAIN_MENU"
    text: "*Главное меню*"
    parse_mode: "MarkdownV2"
    inline_keyboard:
      rows:
        - buttons:
            - id: "ekpa_main_chat"
              text: "🏠 Основной чат EKPA"
              type: "url"
              url: "https://t.me/+14s_2-3hZzVmODAy"
        - buttons:
            - id: "our_chats"
              text: "💬 Наши Чаты"
              type: "callback"
              callback: "OUR_CHATS_BUTTON"
        - buttons:
            - id: "directions"
              text: "🏡 В Комплексе и рядом"
              type: "callback"
              callback: "DIRECTIONS_BUTTON"
        - buttons:
            - id: "info_useful"
              text: "⭐️ Информация"
              type: "callback"
              callback: "INFO_USEFUL_BUTTON"
            - id: "info_ekpa"
              text: "🌟 Все о EKPA"
              type: "callback"
              callback: "INFO_EKPA_BUTTON"
        - buttons:
            - id: "address"
              text: "📍 Наш Адрес"
              type: "callback"
              callback: "ADDRESS_BUTTON"
        - buttons:
            - id: "suggest_changes"
              text: "✍️ Предложить изменения"
              type: "url"
              url: "https://t.me/qeeqez"
    navigation:
      - callback: "OUR_CHATS_BUTTON"
        target: "OUR_CHATS"
      - callback: "DIRECTIONS_BUTTON"
        target: "DIRECTIONS"
      - callback: "DIRECTIONS_SITE_BUTTON"
        target: "DIRECTIONS_SITE"
      - callback: "INFO_USEFUL_BUTTON"
        target: "INFO_USEFUL"
      - callback: "INFO_EKPA_BUTTON"
        target: "INFO_EKPA"
      - callback: "ADDRESS_BUTTON"
        target: "ADDRESS"

  - id: "ADDRESS"
    text: |
      *Наш адрес:*

      *il:* `Antalya`
