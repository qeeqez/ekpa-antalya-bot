version: '1.0'
screens:
- id: TRANSPORT
  text: '*🚌 {{button_transport}}*'
  button_texts:
    bus: 🚌 {{button_bus}}
    antalya_card: 🪪 {{button_antalya_card}}
    taxi: 🚕 {{button_taxi}}
    kick_scooter: 🛴 {{button_scooters}}
- id: BUS
  text: "*\U0001F68EГромадський транспорт*\n\n \U0001F4CD Маршрут найкраще спланувати в *Google Maps*\n \U0001F9ED Актуальне\
    \ місце розташування автобусів можна переглянути в додатку *AntalyaKart*\n\n \U0001F4B5 *Ціна*\n AntalyaKart \\- 9\\.6\
    \ TL\n Банківська карта \\- 9\\.85 TL\n\n \U0001FA99️ *Вартість трансферу*\n AntalyaKart \\- 3 TL\n Банківська карта \\\
    - 9\\.85 TL\n\n ℹ️ *Діти до 6 років безкоштовно*\n ⚠️ *Готівковий розрахунок у транспорті заборонений*"
  button_texts:
    bus_concessionary: 🎫 {{button_benefits}}
- id: BUS_CONCESSIONARY
  text: '🧒👴 *Пільговий проїзд*


    ℹ️ Для пільгового проїзду необхідно оформити дисконтну картку


    💵 *Ціна*

    Студенти та школярі \- 4 TL

    Люди похилого віку, інваліди, вчителі \- 8\.4 TL


    🪙️ *Вартість переказу \- 3 TL*


    ⁉️️ *Як отримати дисконтну картку?*

    \- Видається дітям, людям похилого віку та інвалідам, вчителям

    \- Персональна картка з фото

    \- Дитині потрібна довідка зі школи про те, що вона учень

    \- Можна зробити лише в головних відділеннях AntalyaKart

    \- [Найближче відділення тут](https://goo.gl/maps/UHUeQU8AqJ9D4DSy6), в підземному переході'
- id: ANTALYA_CARD
  text: "*\U0001F4B3 Antalya Kart*\n\n ℹ️ З цією карткою вартість проїзду дешевша\n ℹ️ Можна оплатити за двох, потрібно почекати\
    \ після першої оплати\n\n \U0001F4CD *Де купити?*\n \\- У найближчому [Soylu Market](https://goo.gl/maps/XLS1rGdPT9dvaziG9)\n\
    \ \\- У додатку *Antalya Kart* в розділі *Найближча точка* пункти продажу позначені червоним кольором.\n\n \U0001FA99\
    \ *Як поповнити?*\n \\- Ви можете поповнити готівкою там же, де купуєте\n \\- Поповнюйте онлайн карткою турецького банку\
    \ в додатку Antalya Kart\n\n ⁉️ *Я поповнив картку, але гроші не з'явилися*\n \\- На терміналі в автобусі натисніть червону\
    \ кнопку поповнення\n \\- Утримуйте 5 секунд\n\n \U0001F68C *Як переглянути маршрути в додатку?*\n \\- Знайдіть відповідний\
    \ маршрут на Google Maps\n \\- У додатку Antalya Kart введіть номер маршруту в пошук\n \\- Весь маршрут і сірі автобуси\
    \ будуть відображатися в місцях, де вони зараз їздять\n \\- Прапор \\-\\> кінець маршруту, трикутник \\-\\> початок\n\
    \ \\- Напрямок маршруту можна змінити, натиснувши зелену кнопку"
  button_texts:
    antalya_card_android: 🤖 {{button_android}}
    antalya_card_iphone: 📱 {{button_iphone}}
- id: TAXI
  text: '*🚖 Таксі*


    ℹ️ По всій Анталії висять кнопки виклику таксі, машина приїжджає навіть пізно ввечері


    🤙 *Дзвонити можна:*

    1\. Кнопка перед входом

    2\. Додаток BiTaxi

    3\. Додаток Uber


    💵 *Вартість: посадка 10TL \+ 14TL/км*


    🪙 *Оплата*

    \- За лічильником у дзеркалі

    \- Вартість в додатках розраховується за допомогою того ж лічильника

    \- Ви можете оплатити готівкою в лірах або карткою \(не у всіх таксі\)

    \- У додатку є можливість оплатити прив''язаною карткою'
- id: KICK_SCOOTER
  text: '*🛴 Скутери*


    ℹ️ *Послуги прокату скутерів в Анталії:*

    \- *BinBin* \(їхати біля нашого комплексу\)

    \- *Марті*

    \- *Хоп*

    \- *Промінь*

    \- *Хоп*

    \- *Гез*

    \- *Торнет*


    ℹ️ Вздовж узбережжя працює велопрокат *Antbis*'
