- id: HOW_TO_PAY_AIDAT
  text: '*Айдат*


    ℹ️ Комплекстин ай сайынкы тейлөө акысы\.

    ⚠️ Квартирада жашабасаңыз да төлөшүңүз керек\.


    *Баасы:*

    ```

    1\+1\- 840 TL

    2\+1\- 1310 TL

    2\+1\- 1590 TL \(Separate kitchen\)

    3\+1\- 1970 TL

    ```

    *Payment term:*

    ⏳ Until the 5th of every month


    *Payment:*

    🪙 Cash or card at the Management Company Office


    💳 Online transfer from a Turkish bank card to the account:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Recipient''s name and payment description*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Aidat Ekpa 1207` Блок Квартира Ай


    ⚠️ Сиз төлөп жаткан кварталдын, батирдин жана айдын номерлерин көрсөтүүнү унутпаңыз'
- id: HOW_TO_PAY_CONDITIONER
  text: '*кондиционер*


    ℹ️ Борбордук кондиционер системасы электр энергиясына кирбейт\.

    ⚠️ Эсиңизде болсун, Түркия ысык өлкө жана бул жерде электр энергиясы кымбат \.


    *Төлөм мөөнөтү:*

    ⏳ Эсеп\-фактураны алган күндөн тартып 7 күн

    ⚠️ Эгер төлөм жүргүзүлбөсө, ал өчүрүлөт\. Алыстан башкаруу пультунда кулпу сөлөкөтү жана Борборлоштурулган\ пайда болот\.


    *Төлөм:*

    🪙 Башкаруучу компаниянын кеңсесинде накталай акча же карта


    💳 Түрк банкынын картасынан эсепке онлайн которуу:


    🏦 `TR24 0013 4000 0203 8787 9000 01`


    *Алуучунун аты жана төлөм сүрөттөмөсү*

    🧑 `EKPA 1207 SITESI YONETIMI`

    ℹ️ `Klima Ekpa 1207` Блок батир


    ⚠️ Сиз төлөп жаткан блоктун жана батирдин номерлерин сөзсүз түрдө көрсөтүңүз'
- id: HOW_TO_PAY_ELECTRICITY
  text: '*Электр*


    ℹ️ Кондиционер электр энергиясына кирбейт\.


    ℹ️ *Абоненттик номер* кошулганда берилет, ал төлөм картасында да көрсөтүлөт\.


    *Төлөм мөөнөтү:*

    ℹ️ Эсеп\-фактура айдын аягында берилет

    ⏳ Төлөм эсеп\-фактура берилгенден кийин 10 күндүн ичинде жүргүзүлүшү керек\.


    *Электр энергиясы үчүн эсепти кантип билсе болот:*

    \- Төлөөдө түрк интернет банкында

    \- Дарекке келип түшкөн төлөм баракчасы биринчи кабаттагы дубалдын кутучасына салынат

    \- Онлайнда [CK Akdeniz](https://online.ckakdeniz.com.tr)


    *Төлөм:*


    💳 *Түрк интернет банкингинде онлайн*

    1\. Фатура \(Эсепти төлөө\) \-\> Elektrik \(Электр энергиясы\) \-\> *CK Akdeniz Elektrik*

    2\. *Абоненттик номериңизди* киргизиңиз

    3\. Сиз сумманы көрүп, төлөй аласыз

    ⚠️ Эгерде эсеп\-фактура чыга элек болсо, анда колдонмо катаны көрсөтөт\.


    🪙 *Накталай акча же карта*

    \- Turkcell филиалында чакан комиссия менен [Жакынкы 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Жакынкы 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- PTT почта бөлүмүндө, [Жакынкы почта](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- CK Akdeniz Elektrikтин каалаган кеңсесинде, [Жакынкы кеңсе](https://goo.gl/maps/nyumU39FQYJTnFZt9)'
- id: HOW_TO_PAY_WATER
  text: '*Суу*


    ℹ️ *Абоненттик номер* кошулганда берилет, ал төлөм картасында да көрсөтүлөт\.


    *Төлөм мөөнөтү:*

    ℹ️ Эсеп\-фактура айдын аягында берилет

    ⏳ Төлөм эсеп\-фактура берилгенден кийин 10 күндүн ичинде жүргүзүлүшү керек\.


    *Суу үчүн эсепти кантип билсе болот:*

    \- Төлөөдө түрк интернет банкында

    \- Дарекке келип түшкөн төлөм баракчасы биринчи кабаттагы дубалдын кутучасына салынат

    \- Онлайн [ASAT](https://online.asat.gov.tr/webportal/index.php)\ сайтында\. HIZLI ÖDEME чыкылдатыңыз


    *Төлөм:*


    💳 *Түрк интернет банкингинде онлайн*

    1\. Фатура \(Эсепти төлөө\) \-\> Су \(Суу\) \-\> *Анталия Су \(ASAT\)*

    2\. *Абоненттик номериңизди* киргизиңиз \(Сандын сол жагына бир нече нөлдү кошуңуз\)

    3\. Сиз сумманы көрүп, төлөй аласыз

    ⚠️ Эгерде эсеп\-фактура чыга элек болсо, анда колдонмо катаны көрсөтөт\.


    🪙 *Накталай акча же карта*

    \- Turkcell филиалында чакан комиссия менен [Жакынкы 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Жакынкы 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- PTT почта бөлүмүндө, [Жакынкы почта](https://goo.gl/maps/fwskNzeEbtX9hspz6)

    \- [ASAT Башкы кеңсесинде](https://goo.gl/maps/3GqKDPPnW8gUUz5q6)'
- id: HOW_TO_PAY_PHONE_AND_INTERNET
  text: '*📱 Уюлдук телефон жана интернет 🌎*


    💳 *Онлайн тиркемеде же операторуңуздун веб\-сайтында*

    \- Телефонуңуз үчүн кийинки айга топтомду тандоо керек

    \- Сиз жөн гана балансыңызды толуктап, андан кийин пакеттерди төлөй аласыз

    \- Интернет үчүн мурунку айдын эсебин төлөшүңүз керек


    🪙 *Накталай акча же карта*

    \- Turkcell филиалында чакан комиссия менен [Эң жакын 1](https://goo.gl/maps/M3DtmNhv5wfqFGqx7), [Эң жакын 2](https://goo.gl/maps/wn9ixfN5vDJqqLQn6)

    \- Сиздин байланыш операторуңуздун каалаган кеңсесинде'
